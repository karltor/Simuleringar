<!DOCTYPE html>
<html>
<head>
  <title>Gissa Kvadratroten</title>
  <link rel="icon" href="squareroot.jpg" type="image/jpg">

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f3f4f6;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #4CAF50;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    input[type="text"] {
      padding: 12px 20px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 4px;
    }
    .correct {
      color: green;
    }
    .incorrect {
      color: red;
    }
    #feedback {
      margin-top: 10px;
      font-weight: bold;
    }
    .statistics {
  float: right;
  width: 300px;
  padding: 20px;
  background-color: #eee;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

  </style>
</head>
<body>

  <div class="container">
    <h1>Välkommen till "Gissa Kvadratroten"!</h1>
    <p>Skriv in ett tal och tryck på "Starta" för att börja.</p>

    <input id="numberInput" type="text" placeholder="Skriv ett tal..." onkeyup="if(event.keyCode == 13) initialize()">
    <button onclick="initialize()">Starta</button>

    <div id="hint"></div>

    <div id="feedback"></div>

    <input id="guessInput" type="text" placeholder="Din gissning..." disabled onkeyup="if(event.keyCode == 13) { checkGuess(); this.value=''; }">
    <button onclick="checkGuess()" disabled id="guessButton">Gissa</button>
  </div>
  <div class="statistics">
    <h2>Statistik</h2>
    <p>Antal rötter: <span id="rootCount">0</span></p>
    <p>Största rot: <span id="maxRoot">N/A</span></p>
    <p>Minsta rot: <span id="minRoot">N/A</span></p>
    <p>Minst försök: <span id="minTries">N/A</span></p>
    <p>Högst försök: <span id="maxTries">N/A</span></p>
    <p>Snittförsök: <span id="avgTries">N/A</span></p>
  </div>

  <script>
    let a, b, target;
let rootCount = 0;
let maxRoot = 0;
let minRoot = Infinity;
let minTries = Infinity;
let maxTries = 0;
let totalTries = 0;
let tries = 0;

const hint = document.getElementById('hint');
const guessInput = document.getElementById('guessInput');
const guessButton = document.getElementById('guessButton');
const feedback = document.getElementById('feedback');

// Uppdatera statistik efter varje lyckad gissning
function updateStatistics(root) {
  rootCount++;
  maxRoot = Math.max(maxRoot, root);
  minRoot = Math.min(minRoot, root);
  minTries = Math.min(minTries, tries);
  maxTries = Math.max(maxTries, tries);
  totalTries += tries;

  // Update DOM
  document.getElementById('rootCount').innerText = rootCount;
  document.getElementById('maxRoot').innerText = maxRoot.toFixed(3);
  document.getElementById('minRoot').innerText = minRoot.toFixed(3);
  document.getElementById('minTries').innerText = minTries;
  document.getElementById('maxTries').innerText = maxTries;
  document.getElementById('avgTries').innerText = (totalTries / rootCount).toFixed(2);

  // Save to localStorage
  localStorage.setItem('rootCount', rootCount);
  localStorage.setItem('maxRoot', maxRoot);
  localStorage.setItem('minRoot', minRoot);
  localStorage.setItem('minTries', minTries);
  localStorage.setItem('maxTries', maxTries);
  localStorage.setItem('totalTries', totalTries);
}
function loadStatistics() {
  if (localStorage.getItem('rootCount')) rootCount = parseInt(localStorage.getItem('rootCount'));
  if (localStorage.getItem('maxRoot')) maxRoot = parseFloat(localStorage.getItem('maxRoot'));
  if (localStorage.getItem('minRoot')) minRoot = parseFloat(localStorage.getItem('minRoot'));
  if (localStorage.getItem('minTries')) minTries = parseInt(localStorage.getItem('minTries'));
  if (localStorage.getItem('maxTries')) maxTries = parseInt(localStorage.getItem('maxTries'));
  if (localStorage.getItem('totalTries')) totalTries = parseInt(localStorage.getItem('totalTries'));

  document.getElementById('rootCount').innerText = rootCount || '0';
  document.getElementById('maxRoot').innerText = isFinite(maxRoot) ? maxRoot.toFixed(3) : 'N/A';
  document.getElementById('minRoot').innerText = isFinite(minRoot) ? minRoot.toFixed(3) : 'N/A';
  document.getElementById('minTries').innerText = isFinite(minTries) ? minTries : 'N/A';
  document.getElementById('maxTries').innerText = isFinite(maxTries) ? maxTries : 'N/A';
  document.getElementById('avgTries').innerText = rootCount ? (totalTries / rootCount).toFixed(2) : 'N/A';
}

function initialize() {
  guessInput.disabled = false;
  guessButton.disabled = false;
  hint.innerHTML = '';
  feedback.innerHTML = '';
  target = parseFloat(document.getElementById('numberInput').value.replace(',', '.'));

  let decimalPlaces = 3;
  if (target > 0 && target < 1) {
    a = 0;
    b = 1;
    decimalPlaces = 5;
  } else {
    a = Math.floor(Math.sqrt(target));
    b = Math.ceil(Math.sqrt(target));
  }

   hint.innerHTML = `Eftersom att &radic;${formatNumber(a*a, decimalPlaces)} är ${formatNumber(a, decimalPlaces)} och &radic;${formatNumber(b*b, decimalPlaces)} är ${formatNumber(b, decimalPlaces)}, borde talet ligga mellan ${formatNumber(a, decimalPlaces)} och ${formatNumber(b, decimalPlaces)}.`;
  tries = 0;  // Reset the attempt counter
}

function countDecimalPlaces(value) {
  if (Math.floor(value) === value) return 0;
  return value.toString().split(".")[1].length || 0;
}

function checkGuess() {
  tries++;
  let userGuess = parseFloat(guessInput.value.replace(',', '.'));
  const guessSquared = Math.pow(userGuess, 2);

  // Räkna antalet decimaler i användarens gissning
  let userDecimalPlaces = countDecimalPlaces(userGuess);

  // Använd användarens decimalplatser om de är större än de förinställda
  let decimalPlaces = Math.max(2, userDecimalPlaces);

  if (target > 0 && target < 1) {
    decimalPlaces = Math.max(3, userDecimalPlaces);
  }

  const margin = Math.min(0.49, target * 0.01); // 1% av målvärdet eller 0,49, beroende på vilket som är större

  feedback.innerHTML = `${userGuess} x ${userGuess} blir ${formatNumber(guessSquared, decimalPlaces)}.`;

  if (Math.abs(guessSquared - target) < margin) {
    feedback.innerHTML += ` <span class="correct">Grattis, du har hittat roten!</span>`;
    guessButton.disabled = true;
    guessInput.disabled = true;
    updateStatistics(userGuess);
  } else {
    if (guessSquared < target) a = Math.max(a, userGuess);
    else b = Math.min(b, userGuess);
    hint.innerHTML = `Talet är mellan ${formatNumber(a, decimalPlaces)} och ${formatNumber(b, decimalPlaces)}. Vad vill du gissa på?`;
  }
}



function formatNumber(num, decimalPlaces) {
  const n = parseFloat(num.toFixed(decimalPlaces));
  return Number.isInteger(n) ? String(n) : String(n.toFixed(decimalPlaces));
}
loadStatistics()

  </script>

</body>
</html>
