<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kärnfissions-simulering - Uran-235</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #050505; color: white; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            max-width: 300px;
        }
        .btn-group { display: flex; gap: 5px; margin: 5px 0 10px 0; }
        button {
            display: block; width: 100%;
            margin: 5px 0; padding: 10px;
            cursor: pointer; background: #2c3e50;
            color: white; border: none; border-radius: 4px;
            transition: background 0.3s;
        }
        button:hover { background: #34495e; }
        button.active { background: #c0392b; border: 1px solid #ff7675; }
        .stats { font-size: 0.9em; margin-top: 10px; color: #ccc; border-top: 1px solid #444; padding-top: 10px; }
        .slider-container { margin: 15px 0; font-size: 0.9em; }
        .slider-container input { width: 100%; }
        #hidden-settings {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.5); padding: 5px 10px;
            border-radius: 4px; font-size: 11px; color: #888;
            opacity: 0.3; transition: opacity 0.3s;
        }
        #hidden-settings:hover { opacity: 1; }
    </style>
</head>
<body>

<div id="ui">
    <h3 style="margin-top: 0; color: #ecf0f1;">Fissions-simulering</h3>
    <button onclick="shootNeutron()">Skjut start-neutron</button>
    
    <div style="font-size: 0.85em; margin-bottom: 2px; color: #bdc3c7;">Lägg till U-235:</div>
    <div class="btn-group">
        <button onclick="addUranium(5)">+5</button>
        <button onclick="addUranium(25)">+25</button>
        <button onclick="addUranium(100)">+100</button>
    </div>

    <button id="rodBtn" onclick="toggleControlRods()">Aktivera Styrstavar: AV</button>
    
    <div class="slider-container">
        <label>Simuleringshastighet: <span id="speedVal">1.0</span>x</label>
        <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('speedVal').textContent = this.value">
    </div>

    <button onclick="resetSim()" style="background: #7f8c8d;">Återställ Scen</button>
    
    <div class="stats">
        Atomer: <span id="atomCount">1</span><br>
        Neutroner: <span id="neutronCount">0</span><br>
        Styrstavar i grid: <span id="rodCount">0</span>
    </div>
</div>

<div id="hidden-settings">
    Absorptions-radie bonus: <input type="number" id="absorbBonus" value="25" style="width:35px; background: #222; color: #fff; border: 1px solid #555;">%
</div>

<div id="label-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    let scene, camera, renderer, clock, controls;
    let atoms = [], neutrons = [], activeFragments = [], labels = [], flashes = [];
    let rodMesh = null; // InstancedMesh för styrstavar
    let rodPositions = []; // För kollisionsberäkning
    let controlRodsActive = false;
    let rodHeight = 40;

    const PROTON_COLOR = 0xff3333;
    const NEUTRON_COLOR = 0xffffff;
    const ATOM_RADIUS = 1.5;
    const ROD_SPACING = 12; // Avstånd mellan stavar i grid

    let uraniumTemplate, baTemplate, krTemplate;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(40, 40, 60);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050505);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(50, 100, 50);
        scene.add(mainLight);

        clock = new THREE.Clock();
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        buildTemplates();
        createUranium(new THREE.Vector3(0, 0, 0));

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    function buildIsotopeTemplate(pCount, nCount, radius) {
        const group = new THREE.Group();
        const sphereGeo = new THREE.SphereGeometry(radius, 8, 8);
        const pMat = new THREE.MeshPhongMaterial({ color: PROTON_COLOR, shininess: 30 });
        const nMat = new THREE.MeshPhongMaterial({ color: NEUTRON_COLOR, shininess: 30 });
        
        let types = Array(pCount).fill('p').concat(Array(nCount).fill('n'));
        for (let i = types.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [types[i], types[j]] = [types[j], types[i]];
        }

        const pMesh = new THREE.InstancedMesh(sphereGeo, pMat, pCount);
        const nMesh = new THREE.InstancedMesh(sphereGeo, nMat, nCount);
        const dummy = new THREE.Object3D();

        for (let i = 0; i < (pCount + nCount); i++) {
            const phi = Math.acos(-1 + (2 * i) / (pCount + nCount));
            const theta = Math.sqrt((pCount + nCount) * Math.PI) * phi;
            const r = (radius > 0.1 ? 1.1 : 0.7) * Math.pow(Math.random(), 0.3);
            dummy.position.set(r * Math.cos(theta) * Math.sin(phi), r * Math.sin(theta) * Math.sin(phi), r * Math.cos(phi));
            dummy.updateMatrix();
            if (types[i] === 'p') pMesh.setMatrixAt(scene.userData.pIdx++, dummy.matrix);
            else nMesh.setMatrixAt(scene.userData.nIdx++, dummy.matrix);
        }
        group.add(pMesh, nMesh);
        return group;
    }

    function buildTemplates() {
        scene.userData.pIdx = 0; scene.userData.nIdx = 0; uraniumTemplate = buildIsotopeTemplate(92, 143, 0.15);
        scene.userData.pIdx = 0; scene.userData.nIdx = 0; baTemplate = buildIsotopeTemplate(56, 85, 0.12);
        scene.userData.pIdx = 0; scene.userData.nIdx = 0; krTemplate = buildIsotopeTemplate(36, 56, 0.12);
    }

    function createUranium(pos) {
        const group = uraniumTemplate.clone();
        group.position.copy(pos);
        scene.add(group);
        atoms.push({ group, radius: ATOM_RADIUS });
    }

    function addUranium(count) {
        const minDistance = 4.8;
        let globalAttempts = 0;
        for (let i = 0; i < count; i++) {
            let pos, valid = false, searchArea = 15 + Math.sqrt(atoms.length) * 2;
            while (!valid && globalAttempts < 2000) {
                globalAttempts++;
                pos = new THREE.Vector3((Math.random()-0.5)*searchArea*2, (Math.random()-0.5)*searchArea*2, (Math.random()-0.5)*searchArea*2);
                valid = true;
                for (let a of atoms) { if (pos.distanceTo(a.group.position) < minDistance) { valid = false; break; } }
            }
            if (valid) createUranium(pos);
        }
        if (controlRodsActive) updateControlRods(); // Uppdatera grid om atomer tillkommit
        updateUI();
    }

    function updateControlRods() {
        if (rodMesh) { scene.remove(rodMesh); rodMesh = null; }
        if (!controlRodsActive || atoms.length === 0) return;

        // Hitta ytterpunkter för atomer
        let minX = 0, maxX = 0, minZ = 0, maxZ = 0, minY = 0, maxY = 0;
        atoms.forEach(a => {
            minX = Math.min(minX, a.group.position.x); maxX = Math.max(maxX, a.group.position.x);
            minZ = Math.min(minZ, a.group.position.z); maxZ = Math.max(maxZ, a.group.position.z);
            minY = Math.min(minY, a.group.position.y); maxY = Math.max(maxY, a.group.position.y);
        });

        // Bestäm höjd baserat på Y-axeln
        rodHeight = (maxY - minY) + 40; 
        const yCenter = (maxY + minY) / 2;

        // Skapa grid-positioner
        rodPositions = [];
        const margin = 10;
        for (let x = Math.floor((minX-margin)/ROD_SPACING)*ROD_SPACING; x <= maxX+margin; x += ROD_SPACING) {
            for (let z = Math.floor((minZ-margin)/ROD_SPACING)*ROD_SPACING; z <= maxZ+margin; z += ROD_SPACING) {
                rodPositions.push(new THREE.Vector3(x, yCenter, z));
            }
        }

        // Material med metall-look
        const rodGeo = new THREE.CylinderGeometry(0.7, 0.7, rodHeight, 16);
        const rodMat = new THREE.MeshStandardMaterial({ 
            color: 0x888888, 
            metalness: 1.0, 
            roughness: 0.1,
            envMapIntensity: 1.0
        });

        rodMesh = new THREE.InstancedMesh(rodGeo, rodMat, rodPositions.length);
        const dummy = new THREE.Object3D();
        rodPositions.forEach((pos, i) => {
            dummy.position.copy(pos);
            dummy.updateMatrix();
            rodMesh.setMatrixAt(i, dummy.matrix);
        });
        scene.add(rodMesh);
        document.getElementById('rodCount').textContent = rodPositions.length;
    }

    function toggleControlRods() {
        controlRodsActive = !controlRodsActive;
        const btn = document.getElementById('rodBtn');
        btn.textContent = `Aktivera Styrstavar: ${controlRodsActive ? 'PÅ' : 'AV'}`;
        btn.classList.toggle('active', controlRodsActive);
        updateControlRods();
    }

    function createFlash(pos) {
        const light = new THREE.PointLight(0xffcc00, 10, 15);
        light.position.copy(pos);
        scene.add(light);
        flashes.push({ light, life: 0.4 });
    }

    function spawnNeutron(pos, vel) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        mesh.position.copy(pos);
        scene.add(mesh);
        neutrons.push({ mesh, velocity: vel, active: true });
    }

    function fission(atom) {
        const pos = atom.group.position.clone();
        scene.remove(atom.group);
        createFlash(pos);

        // Skapa dotterisotoper
        const frags = [{t:baTemplate, n:'Ba-141', v:new THREE.Vector3(-0.15,0.04,0)}, {t:krTemplate, n:'Kr-92', v:new THREE.Vector3(0.15,-0.04,0)}];
        frags.forEach(f => {
            const g = f.t.clone(); g.position.copy(pos); scene.add(g);
            activeFragments.push({ group: g, velocity: f.v, life: 2.5 });
            const div = document.createElement('div'); div.className = 'label'; div.textContent = f.n;
            document.getElementById('label-container').appendChild(div);
            labels.push({ element: div, object: g, life: 2.5 });
        });

        for (let i = 0; i < 3; i++) {
            const v = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(0.22);
            spawnNeutron(pos.clone(), v);
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const simSpeed = parseFloat(document.getElementById('speedSlider').value);
        if (controls) controls.update();

        // Flashes
        for (let i = flashes.length - 1; i >= 0; i--) {
            flashes[i].life -= delta;
            flashes[i].light.intensity = (flashes[i].life / 0.4) * 12;
            if (flashes[i].life <= 0) { scene.remove(flashes[i].light); flashes.splice(i, 1); }
        }

        // Neutrons
        const absorbRadSq = Math.pow(0.7 + (parseFloat(document.getElementById('absorbBonus').value)/100), 2);
        for (let i = neutrons.length - 1; i >= 0; i--) {
            const n = neutrons[i];
            n.mesh.position.addScaledVector(n.velocity, simSpeed);

            // Kolla Uran
            for (let j = atoms.length - 1; j >= 0; j--) {
                if (n.mesh.position.distanceTo(atoms[j].group.position) < ATOM_RADIUS) {
                    fission(atoms[j]); atoms.splice(j, 1); n.active = false; break;
                }
            }

            // Kolla Grid-styrstavar
            if (n.active && controlRodsActive && rodPositions.length > 0) {
                for (let rp of rodPositions) {
                    const dx = n.mesh.position.x - rp.x;
                    const dz = n.mesh.position.z - rp.z;
                    const dy = Math.abs(n.mesh.position.y - rp.y);
                    if (dx*dx + dz*dz < absorbRadSq && dy < rodHeight/2) {
                        n.active = false; break;
                    }
                }
            }

            if (n.mesh.position.length() > 250 || !n.active) {
                scene.remove(n.mesh); neutrons.splice(i, 1);
            }
        }

        activeFragments.forEach((f, i) => { 
            f.group.position.addScaledVector(f.velocity, simSpeed); f.life -= delta * simSpeed;
            if (f.life <= 0) { scene.remove(f.group); activeFragments.splice(i, 1); }
        });

        labels.forEach((l, i) => {
            const vector = l.object.position.clone().project(camera);
            l.element.style.left = (vector.x * 0.5 + 0.5) * window.innerWidth + 'px';
            l.element.style.top = (-(vector.y * 0.5) + 0.5) * window.innerHeight + 'px';
            l.life -= delta * simSpeed;
            if (l.life < 0.5) l.element.style.opacity = l.life / 0.5;
            if (l.life <= 0) { if (l.element.parentNode) l.element.parentNode.removeChild(l.element); labels.splice(i, 1); }
        });

        renderer.render(scene, camera);
        updateUI();
    }

    function shootNeutron() {
        if (atoms.length === 0) return;
        const target = atoms[Math.floor(Math.random()*atoms.length)];
        const startPos = new THREE.Vector3(-60, target.group.position.y, target.group.position.z);
        spawnNeutron(startPos, new THREE.Vector3().subVectors(target.group.position, startPos).normalize().multiplyScalar(0.3));
    }

    function resetSim() {
        atoms.forEach(a => scene.remove(a.group)); atoms = [];
        neutrons.forEach(n => scene.remove(n.mesh)); neutrons = [];
        activeFragments.forEach(f => scene.remove(f.group)); activeFragments = [];
        labels.forEach(l => { if (l.element.parentNode) l.element.parentNode.removeChild(l.element); }); labels = [];
        if (rodMesh) { scene.remove(rodMesh); rodMesh = null; }
        controlRodsActive = false;
        document.getElementById('rodBtn').classList.remove('active');
        document.getElementById('rodBtn').textContent = "Aktivera Styrstavar: AV";
        createUranium(new THREE.Vector3(0, 0, 0));
        updateUI();
    }

    function updateUI() {
        document.getElementById('atomCount').textContent = atoms.length;
        document.getElementById('neutronCount').textContent = neutrons.length;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
</script>
</body>
</html>
