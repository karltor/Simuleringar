<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tärningskastare</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #container {
            text-align: center;
        }

        #diceCanvas {
            width: 200px;
            height: 200px;
            border: 2px solid #000;
            background-color: white;
            margin-bottom: 20px;
        }

        #rollButton {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 36px; /* Fixed height to prevent layout shift */
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="diceCanvas"></canvas>
        <div id="result"></div>
        <button id="rollButton">Kasta tärningarna</button>
    </div>

    <script>
        const canvas = document.getElementById('diceCanvas');
        const ctx = canvas.getContext('2d');
        const rollButton = document.getElementById('rollButton');
        const resultDiv = document.getElementById('result');

        canvas.width = 200;
        canvas.height = 200;

        function getRandomNumber() {
            return Math.floor(Math.random() * 10) + 1; // Rolling from 1-10
        }

        function drawDice(number, x, y, size = 50) {
            ctx.clearRect(x - size / 2, y - size / 2, size, size);

            // Draw dice background
            ctx.fillStyle = 'white';
            ctx.fillRect(x - size / 2, y - size / 2, size, size);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.strokeRect(x - size / 2, y - size / 2, size, size);

            // Draw dice dots
            ctx.fillStyle = 'black';
            const dotSize = size / 8;

            function drawDot(dx, dy) {
                ctx.beginPath();
                ctx.arc(x + dx, y + dy, dotSize, 0, 2 * Math.PI);
                ctx.fill();
            }

            const dotPositions = {
                1: [[0, 0]],
                2: [[-size / 4, -size / 4], [size / 4, size / 4]],
                3: [[-size / 4, -size / 4], [0, 0], [size / 4, size / 4]],
                4: [[-size / 4, -size / 4], [-size / 4, size / 4], [size / 4, -size / 4], [size / 4, size / 4]],
                5: [[-size / 4, -size / 4], [-size / 4, size / 4], [0, 0], [size / 4, -size / 4], [size / 4, size / 4]],
                6: [[-size / 4, -size / 4], [-size / 4, 0], [-size / 4, size / 4], [size / 4, -size / 4], [size / 4, 0], [size / 4, size / 4]],
                7: [[-size / 4, -size / 4], [-size / 4, 0], [-size / 4, size / 4], [size / 4, -size / 4], [size / 4, 0], [size / 4, size / 4], [0, 0]],
                8: [[-size / 4, -size / 4], [-size / 4, 0], [-size / 4, size / 4], [size / 4, -size / 4], [size / 4, 0], [size / 4, size / 4], [0, -size / 4], [0, size / 4]],
                9: [[-size / 4, -size / 4], [-size / 4, 0], [-size / 4, size / 4], [size / 4, -size / 4], [size / 4, 0], [size / 4, size / 4], [0, -size / 4], [0, size / 4], [0, 0]],
                10: [[-size / 4, -size / 4], [-size / 4, 0], [-size / 4, size / 4], [size / 4, -size / 4], [size / 4, 0], [size / 4, size / 4], [0, -size / 4], [0, size / 4], [-size / 8, -size / 8], [size / 8, size / 8]]
            };

            dotPositions[number].forEach(([dx, dy]) => drawDot(dx, dy));
        }

        function animateDice() {
            let counter = 0;
            const maxCounter = 20;

            function rollAnimation() {
                const number1 = getRandomNumber();
                const number2 = getRandomNumber();

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                drawDice(number1, canvas.width / 2 - 50 + Math.random() * 4 - 2, canvas.height / 2 + Math.random() * 4 - 2);
                drawDice(number2, canvas.width / 2 + 50 + Math.random() * 4 - 2, canvas.height / 2 + Math.random() * 4 - 2);

                counter++;
                if (counter < maxCounter) {
                    requestAnimationFrame(rollAnimation);
                } else {
                    rollDice();
                }
            }

            rollAnimation();
        }

        function rollDice() {
            const number1 = getRandomNumber();
            const number2 = getRandomNumber();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawDice(number1, canvas.width / 2 - 50, canvas.height / 2);
            drawDice(number2, canvas.width / 2 + 50, canvas.height / 2);
            resultDiv.textContent = `Tärningarna landade på: ${number1} och ${number2}`;
        }

        rollButton.addEventListener('click', () => {
            resultDiv.textContent = '';
            animateDice();
        });
    </script>
</body>
</html>
