<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proportionalitet — Träning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #222;
    }

    h1 { font-size: 2rem; color: #1a1a2e; margin-bottom: 4px; }

    .subtitle {
      color: #777;
      font-size: 0.9rem;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      padding: 28px 32px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
    }

    .card-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #aaa;
      margin-bottom: 14px;
    }

    .scenario {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #333;
      margin-bottom: 20px;
      text-align: left;
    }

    .scenario strong { color: #1a1a2e; }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 20px;
    }

    /* Value table */
    .val-table {
      margin: 0 auto 20px;
      border-collapse: collapse;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }

    .val-table th {
      background: #f0f4ff;
      color: #555;
      font-weight: 600;
      padding: 8px 18px;
      border: 1px solid #dde;
      font-size: 0.9rem;
    }

    .val-table td {
      padding: 10px 18px;
      border: 1px solid #dde;
      text-align: center;
      background: #fafbff;
      font-weight: 600;
      color: #1a1a2e;
    }

    /* Answer buttons */
    .answer-row {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .answer-row button {
      flex: 1;
      max-width: 200px;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-yes { background: #4caf50; color: #fff; }
    .btn-yes:hover { background: #43a047; transform: translateY(-1px); }

    .btn-no { background: #ef5350; color: #fff; }
    .btn-no:hover { background: #e53935; transform: translateY(-1px); }

    /* Feedback */
    .feedback {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      transition: opacity 0.4s;
    }

    .feedback.correct { color: #2e7d32; }
    .feedback.wrong { color: #c62828; }

    .explanation {
      max-width: 560px;
      width: 100%;
      min-height: 24px;
      font-size: 0.95rem;
      color: #555;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 10px;
    }

    .explanation strong { color: #1a1a2e; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    .stat {
      background: #fff;
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
      min-width: 80px;
    }

    .stat-value { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; }
    .stat-label { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .streak-color { color: #ff9800; }

    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #bbb;
    }

    .hint kbd {
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
    }
  </style>
</head>
<body>

<h1>Proportionalitet</h1>
<p class="subtitle">Är sambandet proportionellt? Svara Ja eller Nej.</p>

<div class="card">
  <div class="card-label" id="card-label">Fråga</div>
  <div class="scenario" id="scenario"></div>
  <div id="table-container"></div>
  <div class="question-text" id="question">Tryck på en knapp för att börja!</div>
  <div class="answer-row">
    <button class="btn-yes" onclick="answer(true)">Ja, proportionellt</button>
    <button class="btn-no" onclick="answer(false)">Nej, inte proportionellt</button>
  </div>
</div>

<div class="feedback" id="feedback"></div>
<div class="explanation" id="explanation"></div>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="s-correct">0</div><div class="stat-label">Rätt</div></div>
  <div class="stat"><div class="stat-value" id="s-wrong">0</div><div class="stat-label">Fel</div></div>
  <div class="stat"><div class="stat-value streak-color" id="s-streak">0</div><div class="stat-label">Streak</div></div>
  <div class="stat"><div class="stat-value" id="s-best">0</div><div class="stat-label">Bästa</div></div>
</div>

<p class="hint"><kbd>←</kbd> Ja &nbsp; <kbd>→</kbd> Nej</p>

<script>
// ─── State ──────────────────────────────────────
let currentQ = null;
let waiting = false;
let stats = { correct: 0, wrong: 0, streak: 0, best: 0 };

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
const coin = () => Math.random() < 0.5;

// ─── Question generators ────────────────────────
// Each returns { scenario, table (optional), question, answer: bool, explanation }

const generators = [
  genUnitPrice,
  genCraftsman,
  genTaxi,
  genPhonePlan,
  genDelivery,
  genTableCheck,
  genCompareOffers,
  genBulkDeal,
  genSwimPool,
  genRentalCar
];

// ── 1. Jämförelsepris / Kilopris ──
function genUnitPrice() {
  const items = [
    { name: 'äpplen', unit: 'kg' },
    { name: 'bananer', unit: 'kg' },
    { name: 'ris', unit: 'kg' },
    { name: 'mjöl', unit: 'kg' },
    { name: 'godis', unit: 'hg' },
    { name: 'kaffe', unit: 'g', factor: 100 },
    { name: 'juice', unit: 'liter' },
    { name: 'mjölk', unit: 'liter' },
    { name: 'skruvar', unit: 'st' },
    { name: 'ägg', unit: 'st' },
  ];
  const item = pick(items);
  const pricePerUnit = randInt(5, 40);
  const amounts = [1, 2, 3, 5];
  const rows = amounts.map(a => [a, a * pricePerUnit]);

  return {
    scenario: `Du köper <strong>${item.name}</strong>. Priset är alltid <strong>${pricePerUnit} kr/${item.unit}</strong>.`,
    table: { headers: [item.unit, 'Pris (kr)'], rows },
    question: 'Är priset proportionellt mot mängden?',
    answer: true,
    explanation: `Ja! Priset per ${item.unit} är alltid ${pricePerUnit} kr. Dubbla mängden → dubbla priset. Inget fast tillägg.`
  };
}

// ── 2. Hantverkare med startavgift ──
function genCraftsman() {
  const types = [
    { title: 'rörmokare', verb: 'Rörmokaren' },
    { title: 'elektriker', verb: 'Elektrikern' },
    { title: 'snickare', verb: 'Snickaren' },
    { title: 'målare', verb: 'Målaren' },
  ];
  const type = pick(types);
  const startFee = pick([200, 300, 400, 500, 600, 800]);
  const hourly = pick([250, 300, 350, 400, 450, 500]);
  const hours = [1, 2, 3, 4, 5];
  const rows = hours.map(h => [h, startFee + h * hourly]);

  return {
    scenario: `${type.verb} tar en <strong>startavgift på ${startFee} kr</strong> och sedan <strong>${hourly} kr/timme</strong>.`,
    table: { headers: ['Timmar', 'Totalkostnad (kr)'], rows },
    question: 'Är totalkostnaden proportionell mot antalet timmar?',
    answer: false,
    explanation: `Nej! Startavgiften på ${startFee} kr gör att sambandet inte går genom nollpunkten. 0 timmar kostar ${startFee} kr, inte 0 kr. Kvoten kostnad/timmar är inte konstant: ${rows[0][1]}/${rows[0][0]} = ${rows[0][1]} men ${rows[1][1]}/${rows[1][0]} = ${rows[1][1] / rows[1][0]}.`
  };
}

// ── 3. Taxi ──
function genTaxi() {
  const startFee = pick([39, 45, 50, 55, 60]);
  const perKm = pick([10, 12, 15, 18, 20]);
  const kms = [2, 5, 8, 10, 15];
  const rows = kms.map(k => [k, startFee + k * perKm]);

  return {
    scenario: `En taxi har en <strong>grundavgift på ${startFee} kr</strong> och kostar sedan <strong>${perKm} kr/km</strong>.`,
    table: { headers: ['Kilometer', 'Kostnad (kr)'], rows },
    question: 'Är kostnaden proportionell mot antalet kilometer?',
    answer: false,
    explanation: `Nej! Grundavgiften ${startFee} kr tillkommer oavsett sträcka. Vid 0 km betalar du ändå ${startFee} kr. Kvoten kr/km ändras: ${rows[0][1]}/${rows[0][0]} = ${(rows[0][1] / rows[0][0]).toFixed(1)} men ${rows[2][1]}/${rows[2][0]} = ${(rows[2][1] / rows[2][0]).toFixed(1)}.`
  };
}

// ── 4. Telefonabonnemang ──
function genPhonePlan() {
  const isProp = coin();

  if (isProp) {
    // Kontantkort utan fast avgift
    const perMin = pick([1, 2, 3]);
    const mins = [10, 20, 50, 100];
    const rows = mins.map(m => [m, m * perMin]);
    return {
      scenario: `Ett kontantkort kostar <strong>${perMin} kr/minut</strong> utan fast månadsavgift.`,
      table: { headers: ['Minuter', 'Kostnad (kr)'], rows },
      question: 'Är kostnaden proportionell mot antalet minuter?',
      answer: true,
      explanation: `Ja! Ingen fast avgift — bara ${perMin} kr per minut. Dubbla minuterna → dubbla kostnaden.`
    };
  } else {
    const monthly = pick([49, 79, 99, 129]);
    const perMin = pick([1, 2, 3]);
    const mins = [0, 10, 30, 60];
    const rows = mins.map(m => [m, monthly + m * perMin]);
    return {
      scenario: `Ett abonnemang kostar <strong>${monthly} kr/månad</strong> plus <strong>${perMin} kr/minut</strong> för samtal.`,
      table: { headers: ['Minuter', 'Kostnad (kr)'], rows },
      question: 'Är totalkostnaden proportionell mot antalet minuter?',
      answer: false,
      explanation: `Nej! Fast avgiften ${monthly} kr tillkommer alltid. Även vid 0 minuter betalar du ${monthly} kr.`
    };
  }
}

// ── 5. Leverans / Frakt ──
function genDelivery() {
  const isProp = coin();

  if (isProp) {
    const perItem = pick([15, 20, 25, 30, 40, 50]);
    const items = ['böcker', 'tröjor', 'muggar', 'posters'];
    const item = pick(items);
    const counts = [1, 2, 3, 5, 10];
    const rows = counts.map(c => [c, c * perItem]);
    return {
      scenario: `En webbshop säljer <strong>${item}</strong> för <strong>${perItem} kr/st</strong>. Fri frakt.`,
      table: { headers: ['Antal', 'Totalpris (kr)'], rows },
      question: 'Är totalpriset proportionellt mot antalet?',
      answer: true,
      explanation: `Ja! Ingen fraktkostnad och samma pris per styck. Dubbla antalet → dubbla priset.`
    };
  } else {
    const shipping = pick([29, 39, 49, 59, 79]);
    const perItem = pick([15, 20, 25, 30, 40]);
    const items = ['böcker', 'tröjor', 'muggar', 'posters'];
    const item = pick(items);
    const counts = [1, 2, 3, 5];
    const rows = counts.map(c => [c, shipping + c * perItem]);
    return {
      scenario: `En webbshop säljer <strong>${item}</strong> för <strong>${perItem} kr/st</strong> med en <strong>frakt på ${shipping} kr</strong> (oavsett antal).`,
      table: { headers: ['Antal', 'Totalpris (kr)'], rows },
      question: 'Är totalpriset proportionellt mot antalet?',
      answer: false,
      explanation: `Nej! Frakten ${shipping} kr gör att priset inte startar på 0. Pris per styck sjunker ju fler du köper: ${rows[0][1]}/${rows[0][0]} = ${rows[0][1]} kr/st men ${rows[3][1]}/${rows[3][0]} = ${(rows[3][1] / rows[3][0]).toFixed(1)} kr/st.`
    };
  }
}

// ── 6. Tabell utan kontext — kolla kvoten ──
function genTableCheck() {
  const isProp = coin();
  const k = randInt(2, 15);
  const xs = [1, 2, 3, 4, 5, 6];
  const useXs = xs.slice(0, randInt(4, 6));

  if (isProp) {
    const rows = useXs.map(x => [x, x * k]);
    return {
      scenario: 'Titta på tabellen nedan.',
      table: { headers: ['x', 'y'], rows },
      question: 'Är y proportionellt mot x?',
      answer: true,
      explanation: `Ja! Kvoten y/x = ${k} för alla rader. y = ${k}·x, och det går genom (0, 0).`
    };
  } else {
    const c = randInt(2, 10);
    const rows = useXs.map(x => [x, x * k + c]);
    return {
      scenario: 'Titta på tabellen nedan.',
      table: { headers: ['x', 'y'], rows },
      question: 'Är y proportionellt mot x?',
      answer: false,
      explanation: `Nej! Kvoten y/x ändras: ${rows[0][1]}/${rows[0][0]} = ${rows[0][1]} men ${rows[1][1]}/${rows[1][0]} = ${(rows[1][1] / rows[1][0]).toFixed(1)}. Det finns en fast del (+${c}) som gör att det inte är proportionellt.`
    };
  }
}

// ── 7. Jämför två erbjudanden ──
function genCompareOffers() {
  const items = ['glass', 'pennor', 'batterier', 'tennisbollar', 'cupcakes'];
  const item = pick(items);
  const priceA = randInt(5, 15);
  const countA = randInt(2, 6);
  const totalA = priceA * countA;
  const priceB = priceA + pick([-2, -1, 1, 2]);
  const countB = countA + pick([1, 2, 3]);
  const totalB = priceB * countB;

  const cheaperIsA = (totalA / countA) < (totalB / countB);
  const unitA = (totalA / countA).toFixed(2);
  const unitB = (totalB / countB).toFixed(2);

  // This is proportional within each deal (unit price is constant)
  return {
    scenario: `<strong>Erbjudande A:</strong> ${countA} ${item} för ${totalA} kr<br><strong>Erbjudande B:</strong> ${countB} ${item} för ${totalB} kr<br><br>Båda butikerna har samma styckpris oavsett hur många du köper (inget fast tillägg).`,
    table: null,
    question: 'Är priset proportionellt mot antalet i båda erbjudandena?',
    answer: true,
    explanation: `Ja! I varje butik är priset proportionellt — styckpriset är konstant (A: ${unitA} kr/st, B: ${unitB} kr/st). Inget fast tillägg. Men de har olika proportionalitetskonstant (styckpris).`
  };
}

// ── 8. Mängdrabatt / stegad prissättning ──
function genBulkDeal() {
  const item = pick(['godis', 'frukt', 'kakor', 'bollar']);
  const basePrice = randInt(8, 20);
  // Not proportional: price drops after certain quantity
  const rows = [
    [1, basePrice],
    [2, basePrice * 2],
    [3, basePrice * 3],
    [5, basePrice * 4],   // discount kicks in
    [10, basePrice * 7],  // even more discount
  ];

  return {
    scenario: `En butik säljer <strong>${item}</strong> och ger <strong>mängdrabatt</strong> — ju fler du köper, desto billigare per styck.`,
    table: { headers: ['Antal', 'Totalpris (kr)'], rows },
    question: 'Är totalpriset proportionellt mot antalet?',
    answer: false,
    explanation: `Nej! Styckpriset ändras: ${rows[0][1]}/${rows[0][0]} = ${rows[0][1]} kr/st men ${rows[4][1]}/${rows[4][0]} = ${(rows[4][1] / rows[4][0]).toFixed(1)} kr/st. Mängdrabatten gör att kvoten inte är konstant.`
  };
}

// ── 9. Simhall med entré + bantid ──
function genSwimPool() {
  const isProp = coin();

  if (isProp) {
    const perVisit = pick([60, 80, 100, 120]);
    const visits = [1, 2, 3, 5, 10];
    const rows = visits.map(v => [v, v * perVisit]);
    return {
      scenario: `En simhall tar <strong>${perVisit} kr per besök</strong>. Inga andra avgifter.`,
      table: { headers: ['Besök', 'Totalkostnad (kr)'], rows },
      question: 'Är totalkostnaden proportionell mot antalet besök?',
      answer: true,
      explanation: `Ja! Varje besök kostar exakt ${perVisit} kr. Ingen fast avgift — 0 besök = 0 kr.`
    };
  } else {
    const memberFee = pick([200, 300, 500]);
    const perVisit = pick([40, 50, 60, 80]);
    const visits = [0, 1, 3, 5, 10];
    const rows = visits.map(v => [v, memberFee + v * perVisit]);
    return {
      scenario: `En simhall kräver ett <strong>medlemskort för ${memberFee} kr</strong>, sedan kostar varje besök <strong>${perVisit} kr</strong>.`,
      table: { headers: ['Besök', 'Totalkostnad (kr)'], rows },
      question: 'Är totalkostnaden proportionell mot antalet besök?',
      answer: false,
      explanation: `Nej! Medlemsavgiften ${memberFee} kr gör att det inte startar på 0. Vid 0 besök har du redan betalat ${memberFee} kr.`
    };
  }
}

// ── 10. Hyrbil ──
function genRentalCar() {
  const isProp = coin();

  if (isProp) {
    const perKm = pick([2, 3, 4, 5]);
    const kms = [10, 20, 50, 100, 200];
    const rows = kms.map(k => [k, k * perKm]);
    return {
      scenario: `En bilpool tar <strong>${perKm} kr/km</strong> utan fast avgift.`,
      table: { headers: ['Kilometer', 'Kostnad (kr)'], rows },
      question: 'Är kostnaden proportionell mot antalet kilometer?',
      answer: true,
      explanation: `Ja! Bara ${perKm} kr/km, ingen startavgift. Kör dubbelt så långt → betala dubbelt.`
    };
  } else {
    const daily = pick([200, 300, 400, 500]);
    const perKm = pick([2, 3, 4, 5]);
    const kms = [0, 10, 50, 100, 200];
    const rows = kms.map(k => [k, daily + k * perKm]);
    return {
      scenario: `En hyrbil kostar <strong>${daily} kr/dag</strong> plus <strong>${perKm} kr/km</strong>.`,
      table: { headers: ['Kilometer', 'Kostnad (kr)'], rows },
      question: 'Är kostnaden proportionell mot antalet kilometer?',
      answer: false,
      explanation: `Nej! Dagshyran ${daily} kr tillkommer alltid. 0 km kostar ändå ${daily} kr.`
    };
  }
}

// ─── Render ─────────────────────────────────────
function renderTable(tableData) {
  if (!tableData) return '';
  let html = '<table class="val-table"><tr>';
  for (const h of tableData.headers) html += `<th>${h}</th>`;
  html += '</tr>';
  for (const row of tableData.rows) {
    html += '<tr>';
    for (const cell of row) html += `<td>${cell}</td>`;
    html += '</tr>';
  }
  html += '</table>';
  return html;
}

function nextQuestion() {
  currentQ = pick(generators)();
  waiting = false;

  document.getElementById('scenario').innerHTML = currentQ.scenario;
  document.getElementById('table-container').innerHTML = currentQ.table ? renderTable(currentQ.table) : '';
  document.getElementById('question').textContent = currentQ.question;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('explanation').innerHTML = '';
  document.getElementById('card-label').textContent = 'Fråga';
}

function answer(val) {
  if (!currentQ || waiting) return;
  waiting = true;

  const fb = document.getElementById('feedback');
  const expl = document.getElementById('explanation');

  if (val === currentQ.answer) {
    fb.textContent = 'Rätt!';
    fb.className = 'feedback correct';
    stats.correct++;
    stats.streak++;
    if (stats.streak > stats.best) stats.best = stats.streak;
  } else {
    fb.textContent = 'Fel!';
    fb.className = 'feedback wrong';
    stats.wrong++;
    stats.streak = 0;
  }

  expl.innerHTML = currentQ.explanation;
  updateStatsUI();
  saveStats();

  const delay = val === currentQ.answer ? 1200 : 3500;
  setTimeout(nextQuestion, delay);
}

// ─── Stats ──────────────────────────────────────
function updateStatsUI() {
  document.getElementById('s-correct').textContent = stats.correct;
  document.getElementById('s-wrong').textContent = stats.wrong;
  document.getElementById('s-streak').textContent = stats.streak;
  document.getElementById('s-best').textContent = stats.best;
}

function saveStats() {
  localStorage.setItem('prop-stats', JSON.stringify(stats));
}

function loadStats() {
  const s = localStorage.getItem('prop-stats');
  if (s) stats = JSON.parse(s);
  updateStatsUI();
}

// ─── Keyboard ───────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') answer(true);
  if (e.key === 'ArrowRight') answer(false);
});

// ─── Init ───────────────────────────────────────
loadStats();
nextQuestion();
</script>
</body>
</html>
