<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta-strålning: Den atomära kaskaden</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        #root { flex-grow: 1; display: flex; flex-direction: column; }
        canvas { display: block; image-rendering: auto; }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid white;
        }
        /* Fix för Google Sites scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ZapIcon = () => (
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        );
        const PlayIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const RotateIcon = () => (
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        );

        const App = () => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [speed, setSpeed] = useState(12); 
            const [isRunning, setIsRunning] = useState(false);
            const [atomCount, setAtomCount] = useState(60);
            const [stats, setStats] = useState({ ions: 0, activeParticles: 0 });

            const particlesRef = useRef([]); 
            const atomsRef = useRef([]);
            const animationRef = useRef(null);

            const initAtoms = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const newAtoms = [];
                // Dynamisk grid baserat på canvasens faktiska bredd
                const cols = Math.max(4, Math.floor(canvas.width / 80));
                const rows = Math.ceil(atomCount / cols);
                const spacingX = (canvas.width - 60) / cols;
                const spacingY = (canvas.height - 60) / rows;

                for (let i = 0; i < atomCount; i++) {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    
                    newAtoms.push({
                        id: i,
                        x: 40 + spacingX * col + (Math.random() - 0.5) * 30,
                        y: 40 + spacingY * row + (Math.random() - 0.5) * 30,
                        ionized: false,
                        electrons: [
                            { angle: Math.random() * Math.PI * 2, orbitRadius: 15, speed: 0.04, active: true },
                            { angle: Math.random() * Math.PI * 2, orbitRadius: 24, speed: 0.02, active: true }
                        ]
                    });
                }
                atomsRef.current = newAtoms;
                particlesRef.current = [];
                setStats({ ions: 0, activeParticles: 0 });
            }, [atomCount]);

            useEffect(() => {
                const updateSize = () => {
                    if (canvasRef.current && containerRef.current) {
                        const rect = containerRef.current.getBoundingClientRect();
                        canvasRef.current.width = rect.width;
                        canvasRef.current.height = rect.height;
                        initAtoms();
                    }
                };
                
                // Använd ResizeObserver för att hantera iFrame-ändringar bättre
                const observer = new ResizeObserver(updateSize);
                if (containerRef.current) observer.observe(containerRef.current);
                
                updateSize();
                return () => observer.disconnect();
            }, [initAtoms]);

            const updatePhysics = (ctx) => {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

                atomsRef.current.forEach(atom => {
                    ctx.beginPath();
                    ctx.arc(atom.x, atom.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = atom.ionized ? '#f43f5e' : '#fb7185';
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('+', atom.x, atom.y + 3);

                    atom.electrons.forEach(e => {
                        if (!e.active) return;
                        e.angle += e.speed;
                        const ex = atom.x + Math.cos(e.angle) * e.orbitRadius;
                        const ey = atom.y + Math.sin(e.angle) * e.orbitRadius;
                        ctx.beginPath();
                        ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#22d3ee';
                        ctx.fill();
                    });
                });

                const aliveParticles = [];
                particlesRef.current.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.996;
                    p.vy *= 0.996;
                    p.energy *= 0.996;

                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
                    ctx.strokeStyle = p.type === 'primary' ? '#3b82f6' : 'rgba(34, 211, 238, 0.5)';
                    ctx.lineWidth = p.type === 'primary' ? 3 : 1.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.type === 'primary' ? 4 : 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = p.type === 'primary' ? '#60a5fa' : '#22d3ee';
                    ctx.fill();

                    atomsRef.current.forEach(atom => {
                        atom.electrons.forEach(e => {
                            if (!e.active) return;
                            const ex = atom.x + Math.cos(e.angle) * e.orbitRadius;
                            const ey = atom.y + Math.sin(e.angle) * e.orbitRadius;
                            const dx = ex - p.x;
                            const dy = ey - p.y;
                            const distSq = dx*dx + dy*dy;

                            if (distSq < 400 && p.energy > 5) {
                                e.active = false;
                                atom.ionized = true;
                                const dist = Math.sqrt(distSq);
                                const pushX = (dx / dist);
                                const pushY = (dy / dist);

                                aliveParticles.push({
                                    x: ex, y: ey,
                                    vx: pushX * (p.vx * 0.5 + 2.5),
                                    vy: pushY * (p.vy * 0.5 + 2.5),
                                    energy: p.energy * 0.4,
                                    type: 'secondary'
                                });

                                p.vx -= pushX * 1.5;
                                p.vy -= pushY * 1.5;
                                p.energy -= 12;
                                setStats(s => ({ ...s, ions: s.ions + 1 }));
                            }
                        });
                    });

                    if ((p.vx*p.vx + p.vy*p.vy) > 0.1 && p.x > -50 && p.x < ctx.canvas.width + 50 && p.y > -50 && p.y < ctx.canvas.height + 50) {
                        aliveParticles.push(p);
                    }
                });

                particlesRef.current = aliveParticles;
                if (aliveParticles.length !== stats.activeParticles) {
                    setStats(s => ({ ...s, activeParticles: aliveParticles.length }));
                }

                if (aliveParticles.length === 0 && isRunning) {
                    setIsRunning(false);
                }
            };

            const animate = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                updatePhysics(ctx);
                animationRef.current = requestAnimationFrame(animate);
            }, [isRunning]);

            useEffect(() => {
                animationRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(animationRef.current);
            }, [animate]);

            const handleStart = () => {
                initAtoms();
                particlesRef.current = [{
                    x: -10,
                    y: canvasRef.current.height / 2 + (Math.random() - 0.5) * (canvasRef.current.height * 0.6),
                    vx: speed,
                    vy: (Math.random() - 0.5) * 2,
                    energy: speed * 12,
                    type: 'primary'
                }];
                setIsRunning(true);
            };

            return (
                <div className="flex flex-col min-h-screen text-slate-100 p-3 md:p-6 bg-[#020617]">
                    <header className="mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div className="flex flex-col">
                            <h1 className="text-xl md:text-2xl font-black text-cyan-400 uppercase tracking-tighter flex items-center gap-2">
                                <span className="p-1 bg-blue-500 rounded text-slate-900 shrink-0">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                </span>
                                Beta-Kaskad 2.0
                            </h1>
                            <p className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-0.5">Atomär Jonisering</p>
                        </div>
                        
                        <div className="flex gap-2 md:gap-4 bg-slate-900/80 p-2 md:p-3 rounded-2xl border border-white/5 backdrop-blur-md self-stretch sm:self-auto justify-around">
                            <div className="px-2 md:px-4 text-center">
                                <p className="text-[9px] uppercase text-slate-500 font-black">Joniseringar</p>
                                <p className="text-lg md:text-2xl font-mono text-rose-500 leading-none mt-1">{stats.ions}</p>
                            </div>
                            <div className="px-2 md:px-4 text-center border-l border-white/10">
                                <p className="text-[9px] uppercase text-slate-500 font-black">Partiklar</p>
                                <p className="text-lg md:text-2xl font-mono text-cyan-400 leading-none mt-1">{stats.activeParticles}</p>
                            </div>
                        </div>
                    </header>

                    <div className="flex flex-col md:grid md:grid-cols-4 gap-4 md:gap-6 flex-grow overflow-hidden">
                        {/* Sidebar */}
                        <div className="md:col-span-1 space-y-4 md:space-y-6 bg-slate-900/40 p-4 md:p-6 rounded-3xl border border-white/5 flex flex-col shrink-0">
                            <div className="space-y-6 md:space-y-8">
                                <div>
                                    <label className="flex items-center gap-2 text-[10px] font-black text-slate-400 uppercase mb-3">
                                        <ZapIcon /> Start-Energi
                                    </label>
                                    <input type="range" min="8" max="25" value={speed} onChange={e => setSpeed(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider" />
                                    <div className="flex justify-between mt-2 font-mono text-[9px] text-blue-400 uppercase">
                                        <span>Låg</span>
                                        <span>{speed} units</span>
                                        <span>Hög</span>
                                    </div>
                                </div>

                                <div>
                                    <label className="flex items-center gap-2 text-[10px] font-black text-slate-400 uppercase mb-3">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg> Vävnadstäthet
                                    </label>
                                    <input type="range" min="20" max="150" step="10" value={atomCount} onChange={e => setAtomCount(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider" />
                                    <div className="flex justify-between mt-2 font-mono text-[9px] text-rose-400 uppercase">
                                        <span>Gles</span>
                                        <span>{atomCount} atomer</span>
                                        <span>Tät</span>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-4 md:mt-auto space-y-2 md:space-y-3">
                                <button onClick={handleStart} disabled={isRunning && stats.activeParticles > 0} className="w-full py-4 md:py-5 bg-blue-600 hover:bg-blue-500 disabled:opacity-20 rounded-2xl font-black uppercase tracking-[0.2em] transition-all shadow-xl shadow-blue-900/20 flex items-center justify-center gap-3 text-xs md:text-sm">
                                    <PlayIcon /> Skjut Stråle
                                </button>
                                <button onClick={() => { setIsRunning(false); initAtoms(); }} className="w-full py-3 bg-slate-800/50 hover:bg-slate-700 rounded-2xl font-bold text-[9px] uppercase tracking-widest text-slate-400 transition-all flex items-center justify-center gap-2">
                                    <RotateIcon /> Nollställ
                                </button>
                            </div>
                        </div>

                        {/* Visualizer Area */}
                        <div ref={containerRef} className="md:col-span-3 bg-slate-950 rounded-[2rem] md:rounded-[2.5rem] border border-white/5 relative overflow-hidden shadow-inner min-h-[300px] md:min-h-0">
                            <canvas ref={canvasRef} className="w-full h-full" />
                            
                            <div className="absolute top-4 left-4 md:top-8 md:left-8 p-3 md:p-5 bg-black/40 rounded-2xl md:rounded-3xl border border-white/5 backdrop-blur-xl space-y-2 md:space-y-4 pointer-events-none">
                                <div className="flex items-center gap-2 md:gap-3">
                                    <div className="w-3 h-3 md:w-4 md:h-4 bg-rose-500 rounded-full flex items-center justify-center text-[7px] md:text-[8px] font-black text-white">+</div>
                                    <span className="text-[8px] md:text-[10px] font-black uppercase tracking-widest text-slate-400">Protoner</span>
                                </div>
                                <div className="flex items-center gap-2 md:gap-3">
                                    <div className="w-4 md:w-6 h-1 md:h-1.5 bg-blue-500 rounded-full"></div>
                                    <span className="text-[8px] md:text-[10px] font-black uppercase tracking-widest text-slate-400">Beta-Elektron</span>
                                </div>
                                <div className="flex items-center gap-2 md:gap-3">
                                    <div className="w-2 md:w-3 h-2 md:h-3 bg-cyan-400 rounded-full shadow-[0_0_8px_rgba(34,211,238,0.6)]"></div>
                                    <span className="text-[8px] md:text-[10px] font-black uppercase tracking-widest text-slate-400">Kaskad</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
