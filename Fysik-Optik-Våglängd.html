<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justera våglängd och se färger</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  text-align: center;
  background-color: #f0f0f0;
}
input[type="range"] {
  width: 100%;
  max-width: 600px; /* Justera detta värde efter önskad bredd */
}

canvas {
  display: block;
  margin: 0 auto;
  background-color: #000000;
  border: 1px solid #ccc;
}

  </style>
</head>
<body>
  <h1>Justera våglängd och se färger</h1>
  <p>Våglängd (nm): <input type="range" id="wavelengthSlider" min="380" max="780" value="500" /></p>
  <p id="wavelengthValue">Våglängd: 500 nm</p>
  <canvas id="canvas" width="800" height="400"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('wavelengthSlider');
let isMouseDown = false;

slider.addEventListener('input', () => {
  drawSineWave(slider.value);
});

canvas.addEventListener('mousedown', (event) => {
  isMouseDown = true;
  updateSlider(event.clientX);
});

canvas.addEventListener('mouseup', () => {
  isMouseDown = false;
});

canvas.addEventListener('mousemove', (event) => {
  if (isMouseDown) {
    updateSlider(event.clientX);
  }
});

function updateSlider(clientX) {
  const sliderRect = slider.getBoundingClientRect();
  const sliderWidth = sliderRect.width;
  const sliderLeft = sliderRect.left;

  let newValue = ((clientX - sliderLeft) / sliderWidth) * (slider.max - slider.min) + parseInt(slider.min, 10);
  newValue = Math.min(Math.max(newValue, slider.min), slider.max);
  slider.value = newValue;
  drawSineWave(slider.value);
  document.getElementById('wavelengthValue').textContent = `Våglängd: ${newValue.toFixed(0)} nm`;

}

function wavelengthToColor(wavelength) {
  const w = parseInt(wavelength, 10);
  let r, g, b;

  if (w >= 380 && w < 440) {
    r = -(w - 440) / (440 - 380);
    g = 0;
    b = 1;
  } else if (w >= 440 && w < 490) {
    r = 0;
    g = (w - 440) / (490 - 440);
    b = 1;
  } else if (w >= 490 && w < 510) {
    r = 0;
    g = 1;
    b = -(w - 510) / (510 - 490);
  } else if (w >= 510 && w < 580) {
    r = (w - 510) / (580 - 510);
    g = 1;
    b = 0;
  } else if (w >= 580 && w < 645) {
    r = 1;
    g = -(w - 645) / (645 - 580);
    b = 0;
  } else if (w >= 645 && w <= 780) {
    r = 1;
    g = 0;
    b = 0;
  } else {
    r = 0;
    g = 0;
    b = 0;
  }

  const factor = 1.5;
  r = Math.round(255 * r * factor);
  g = Math.round(255 * g * factor);
  b = Math.round(255 * b * factor);

  return `rgb(${r}, ${g}, ${b})`;
}

function drawSineWave(wavelength) {
  const color = wavelengthToColor(wavelength);
  const width = canvas.width;
  const height = canvas.height;
  const amplitude = height / 4;
  const centerY = height / 2;

  const scaledWavelength = (wavelength - 380) / (780 - 380) * (width / 2) + width / 10;
  const frequency = 1 / scaledWavelength;

  ctx.clearRect(0, 0, width, height);
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;

  ctx.shadowBlur = 20;
  ctx.shadowColor = color;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

    for (let x = 0; x < width; x++) {
    const y = centerY + amplitude * Math.sin(2 * Math.PI * frequency * x);
    if (x === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }

  ctx.stroke();

  // Ta bort glow-effekt för att undvika att den påverkar andra element
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
}

// Initialt anrop för att rita sinuskurvan med startvåglängden
drawSineWave(slider.value);


  </script>
</body>
</html>
