<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptiv Träning: Koordinatsystem</title>
    <style>
        :root {
            --primary: #4A90E2;
            --bg: #F4F7F9;
            --panel-bg: #FFFFFF;
            --text: #333333;
            --error: #E74C3C;
            --error-bg: #FDEDEC;
            --success: #2ECC71;
            --success-bg: #EAFAF1;
            --gold: #F1C40F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .app-container {
            display: flex;
            width: 95vw;
            height: 92vh; 
            max-width: 1200px;
            background: var(--panel-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .canvas-section {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FAFAFA;
            border-right: 2px solid #EEE;
            padding: 2vh;
        }

        canvas.interactive { cursor: crosshair; }
        canvas {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1; 
        }

        .task-section {
            flex: 1;
            padding: 3vh 3vw; 
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            overflow: hidden; 
        }

        .top-content {
            display: flex;
            flex-direction: column;
            gap: 1.5vh; 
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-select {
            font-size: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: bold;
            background: none;
            border: 2px solid transparent;
            outline: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .level-select:hover {
            background-color: #EBF5FF;
            border-color: var(--primary);
        }

        .xp-bar-container {
            width: 100px;
            height: 8px;
            background-color: #EEE;
            border-radius: 4px;
            overflow: hidden;
        }
        .xp-bar {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }

        .endless-stats {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
            background: #FEF9E7;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #FAD7A1;
            display: none; 
        }

        h2 {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .middle-content {
            display: flex;
            flex-direction: column;
            gap: 1.5vh; 
            align-items: center; 
        }

        .coord-input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.4rem;
            background: #f8f9fa;
            padding: 1vh 2vw;
            border-radius: 10px;
            width: fit-content;
        }

        input[type="text"] {
            width: 55px; 
            padding: 1vh 0; 
            font-size: 1.3rem;
            border: 3px solid #CCC;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        input[type="text"].active-input, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
            background-color: #EBF5FF;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px; 
            width: 100%;
            max-width: 220px; 
        }

        .numpad button {
            padding: 1.5vh 0; 
            font-size: 1.3rem;
            font-weight: bold;
            background-color: #FFF;
            border: 2px solid #DDD;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            color: #333;
        }
        .numpad button:hover { background-color: #F0F0F0; }
        .numpad button:active { transform: scale(0.95); background-color: #E0E0E0; }
        .numpad button.action-btn { background-color: #ecf0f1; font-size: 1rem; }

        .bottom-content {
            display: flex;
            flex-direction: column;
            gap: 1vh;
            min-height: 80px; 
        }

        .btn-area {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            padding: 1.5vh 20px;
            font-size: 1.2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .btn:hover { background-color: #357ABD; }
        .btn.secondary { background-color: #95A5A6; }

        .feedback-box {
            padding: 1.2vh;
            border-radius: 8px;
            font-size: 1rem;
            display: none;
            line-height: 1.3;
        }

        .feedback-box.error {
            display: block;
            background-color: var(--error-bg);
            border-left: 5px solid var(--error);
            color: #A93226;
        }

        .feedback-box.success {
            display: block;
            background-color: var(--success-bg);
            border-left: 5px solid var(--success);
            color: #1E8449;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        .timer-text {
            font-size: 1.1rem;
            color: #555;
            font-weight: bold;
            text-align: center;
            width: 100%;
            padding: 1.5vh;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="canvas-section">
            <canvas id="coordCanvas" width="540" height="540"></canvas>
        </div>
        
        <div class="task-section">
            <div class="top-content">
                <div class="header-bar">
                    <select id="levelSelect" class="level-select" onchange="changeLevel(this.value)"></select>
                    <div class="xp-bar-container" id="xpContainer"><div class="xp-bar" id="xpBar"></div></div>
                    <div class="endless-stats" id="endlessStats">🏆 <span id="endlessScoreText">0</span> lösta</div>
                </div>
                <h2 id="taskTitle">Laddar...</h2>
                <div class="question-text" id="questionText"></div>
            </div>
            
            <div class="middle-content" id="inputArea"></div>

            <div class="bottom-content">
                <div class="btn-area" id="buttonArea">
                    <button class="btn" id="submitBtn" onclick="checkAnswer()">Svara (Enter)</button>
                    <button class="btn secondary" id="resetBtn" style="display: none;" onclick="resetClicks()">Börja om</button>
                </div>
                <div id="feedbackBox" class="feedback-box"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('coordCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const scale = 45; 
        const originX = width / 2;
        const originY = height / 2;

        let unlockedLevel = parseInt(localStorage.getItem('coord_unlockedLevel')) || 1;
        if(unlockedLevel > 5) unlockedLevel = 5; 

        let currentLevel = parseInt(localStorage.getItem('coord_currentLevel')) || 1;
        if(currentLevel > unlockedLevel) currentLevel = unlockedLevel;

        let xp = 0; 
        let endlessScore = parseInt(localStorage.getItem('coord_endlessScore')) || 0;
        let mistakesOnCurrent = 0;
        let currentQ = {};
        let userClickedPoints = []; 
        let activeInputId = 'x_val'; 
        let countdownTimer;
        
        let isTransitioning = false; 

        function updateLevelDropdown() {
            const select = document.getElementById('levelSelect');
            select.innerHTML = '';
            for(let i = 1; i <= unlockedLevel; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i === 5 ? "Mängdträning ♾️" : `Nivå ${i}`;
                if(i === currentLevel) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function changeLevel(levelStr) {
            currentLevel = parseInt(levelStr);
            localStorage.setItem('coord_currentLevel', currentLevel);
            xp = 0;
            loadNewQuestion();
        }

        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }

        function generateQuestion() {
            let q = { points: [], lines: [], type: "", title: "", text: "", isInteractive: false };
            
            let taskType = currentLevel;
            if (currentLevel === 5) {
                taskType = randomInt(1, 4);
            }

            if (taskType === 1) {
                let rx = randomInt(-4, 4), ry = randomInt(-4, 4);
                if (rx===0 && ry===0) rx=1;
                q.title = "Läs av punkten";
                q.text = "Vilka koordinater har punkten <strong>A</strong>?";
                q.type = "read";
                q.points = [{ id: 'A', x: rx, y: ry, color: '#8E44AD' }];
                q.answer = { x: rx, y: ry };
            } 
            else if (taskType === 2) {
                let rx = randomInt(-4, 4), ry = randomInt(-4, 4);
                if (rx===0 && ry===0) rx=1; 
                q.title = "Placera punkten";
                q.text = `Klicka i koordinatsystemet för att sätta ut en punkt på <strong>(${rx}, ${ry})</strong>.`;
                q.type = "click_single";
                q.isInteractive = true;
                q.answer = { x: rx, y: ry };
            }
            else if (taskType === 3) {
                let ix = randomInt(-4, 4), iy = randomInt(-4, 4);
                q.title = "Skärningspunkt";
                q.text = "Ange koordinaterna där de två linjerna korsas.";
                q.type = "read";
                
                const slopes = [
                    {dy: 1, dx: 1}, {dy: -1, dx: 1}, 
                    {dy: 2, dx: 1}, {dy: -2, dx: 1}, 
                    {dy: 1, dx: 2}, {dy: -1, dx: 2}, 
                    {dy: 3, dx: 1}, {dy: -3, dx: 1}  
                ];
                let s1 = slopes[randomInt(0, slopes.length - 1)];
                let s2;
                do { s2 = slopes[randomInt(0, slopes.length - 1)]; } while (s1.dy/s1.dx === s2.dy/s2.dx);

                q.lines = [
                    { x1: ix - 10*s1.dx, y1: iy - 10*s1.dy, x2: ix + 10*s1.dx, y2: iy + 10*s1.dy, color: '#E74C3C' },
                    { x1: ix - 10*s2.dx, y1: iy - 10*s2.dy, x2: ix + 10*s2.dx, y2: iy + 10*s2.dy, color: '#2980B9' }
                ];
                q.answer = { x: ix, y: iy };
            }
            else if (taskType === 4) {
                // NYTT: Slumpa fram en hel giltig kvadrat för att få två bra startpunkter
                let size = randomInt(2, 4);
                // Garanterar att kvadraten får plats i koordinatsystemet (-5 till 5)
                let minC = -4, maxC = 5 - size; 
                let tx = randomInt(minC, maxC);
                let ty = randomInt(minC, maxC);
                
                let corners = [
                    {x: tx, y: ty}, 
                    {x: tx + size, y: ty}, 
                    {x: tx + size, y: ty + size}, 
                    {x: tx, y: ty + size}
                ];
                
                // Välj två punkter bredvid varandra slumpmässigt
                let startIdx = randomInt(0, 3);
                let p1 = corners[startIdx];
                let p2 = corners[(startIdx + 1) % 4];

                q.title = "Bygg en kvadrat!";
                q.text = `Sätt ut de <strong>två</strong> saknade hörnen för att forma en kvadrat.`;
                q.type = "click_square"; 
                q.isInteractive = true;
                q.points = [
                    { id: 'A', x: p1.x, y: p1.y, color: '#F39C12' },
                    { id: 'B', x: p2.x, y: p2.y, color: '#E67E22' }
                ];
            }

            if (currentLevel === 5) {
                q.title = "♾️ " + q.title;
            }

            return q;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, width, height);
            for (let i = -5; i <= 5; i++) {
                ctx.beginPath();
                ctx.strokeStyle = i === 0 ? "#222" : "#E0E0E0"; 
                ctx.lineWidth = i === 0 ? 2.5 : 1.5;
                let px = originX + i * scale, py = originY - i * scale; 
                ctx.moveTo(px, 0); ctx.lineTo(px, height);
                ctx.moveTo(0, py); ctx.lineTo(width, py);
                ctx.stroke();
                ctx.fillStyle = "#444"; ctx.font = "bold 16px Arial";
                if (i !== 0) {
                    ctx.fillText(i, px - (i > 0 ? 5 : 8), originY + 22);
                    ctx.fillText(i, originX + 12, py + 6);
                }
            }
            ctx.fillStyle = "#222"; ctx.font = "bold 18px Arial";
            ctx.fillText("x", width - 20, originY - 15);
            ctx.fillText("y", originX + 15, 25);
        }

        function drawLine(line) {
            ctx.beginPath(); ctx.strokeStyle = line.color; ctx.lineWidth = 3;
            ctx.moveTo(originX + line.x1 * scale, originY - line.y1 * scale);
            ctx.lineTo(originX + line.x2 * scale, originY - line.y2 * scale); ctx.stroke();
        }

        function drawPoint(x, y, label, color) {
            const px = originX + x * scale, py = originY - y * scale;
            ctx.beginPath(); ctx.arc(px, py, 7, 0, 2 * Math.PI);
            ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = "#222"; ctx.lineWidth = 1; ctx.stroke();
            if (label) {
                ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(px + 10, py - 24, 24, 24);
                ctx.fillStyle = "black"; ctx.font = "bold 18px Arial"; ctx.fillText(label, px + 15, py - 6);
            }
        }

        function renderCanvas() {
            drawGrid();
            if (currentQ.lines) currentQ.lines.forEach(drawLine);
            if (currentQ.points) currentQ.points.forEach(p => drawPoint(p.x, p.y, p.id, p.color));
            userClickedPoints.forEach((p, index) => drawPoint(p.x, p.y, `P${index+1}`, '#27AE60'));
        }

        canvas.addEventListener('mousedown', function(e) {
            if (!currentQ.isInteractive || isTransitioning) return;
            const rect = canvas.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (canvas.width / rect.width);
            const py = (e.clientY - rect.top) * (canvas.height / rect.height);
            const logicalX = Math.round((px - originX) / scale);
            const logicalY = Math.round((originY - py) / scale);

            if (logicalX >= -5 && logicalX <= 5 && logicalY >= -5 && logicalY <= 5) {
                if (currentQ.type === "click_single") {
                    userClickedPoints = [{ x: logicalX, y: logicalY }];
                }
                // NYTT: Nu godkänner vi max 2 klick för kvadraten
                else if (currentQ.type === "click_square" && userClickedPoints.length < 2) {
                    if (!userClickedPoints.some(p => p.x === logicalX && p.y === logicalY) && 
                        !currentQ.points.some(p => p.x === logicalX && p.y === logicalY)) {
                        userClickedPoints.push({ x: logicalX, y: logicalY });
                    }
                }
                renderCanvas();
            }
        });

        function resetClicks() { userClickedPoints = []; renderCanvas(); }

        function setActiveInput(id) {
            activeInputId = id;
            document.querySelectorAll('.coord-input-group input').forEach(el => el.classList.remove('active-input'));
            if(document.getElementById(id)) document.getElementById(id).classList.add('active-input');
        }

        function numpadPress(val) {
            if (isTransitioning) return;
            const input = document.getElementById(activeInputId);
            if (!input) return;

            if (val === 'back') {
                input.value = input.value.slice(0, -1);
            } else if (val === '-') {
                if (!input.value.includes('-')) input.value = '-' + input.value;
            } else {
                if (input.value.replace('-','').length >= 1) return;
                input.value += val;
                if (activeInputId === 'x_val') setTimeout(() => setActiveInput('y_val'), 100);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (isTransitioning) return; 
            if (document.getElementById('submitBtn') && document.getElementById('submitBtn').style.display === 'none' && !currentQ.isInteractive) return;
            
            if (!document.getElementById('x_val')) {
                if (e.key === 'Enter') checkAnswer();
                return;
            }

            if (e.key === 'Enter') { checkAnswer(); return; }
            if (e.key === 'Tab') {
                e.preventDefault();
                setActiveInput(activeInputId === 'x_val' ? 'y_val' : 'x_val');
                return;
            }
            if (e.key === 'Backspace') { numpadPress('back'); return; }
            if (e.key === '-') { numpadPress('-'); return; }
            if (/^[0-9]$/.test(e.key)) { numpadPress(e.key); return; }
        });

        function updateUI() {
            clearInterval(countdownTimer); 
            updateLevelDropdown();
            
            if (currentLevel === 5) {
                document.getElementById('xpContainer').style.display = 'none';
                document.getElementById('endlessStats').style.display = 'block';
                document.getElementById('endlessScoreText').innerText = endlessScore;
            } else {
                document.getElementById('xpContainer').style.display = 'block';
                document.getElementById('endlessStats').style.display = 'none';
                document.getElementById('xpBar').style.width = `${(xp / 3) * 100}%`;
            }

            document.getElementById('taskTitle').innerText = currentQ.title;
            document.getElementById('questionText').innerHTML = currentQ.text;
            
            const feedback = document.getElementById('feedbackBox');
            feedback.style.display = "none";
            feedback.className = "feedback-box";
            feedback.classList.remove('shake-animation');

            const btnArea = document.getElementById('buttonArea');
            btnArea.innerHTML = `
                <button class="btn" id="submitBtn" onclick="checkAnswer()">Svara (Enter)</button>
                <button class="btn secondary" id="resetBtn" style="display: none;" onclick="resetClicks()">Börja om</button>
            `;

            const inputArea = document.getElementById('inputArea');
            inputArea.innerHTML = "";

            if (currentQ.isInteractive) {
                canvas.classList.add("interactive");
                document.getElementById('resetBtn').style.display = currentQ.type === "click_square" ? "inline-block" : "none";
                inputArea.innerHTML = `<div style="color: #666; font-style: italic; text-align: center; font-size: 1.1rem; margin-top: 2vh;">Klicka direkt i diagrammet.</div>`;
            } else {
                canvas.classList.remove("interactive");
                inputArea.innerHTML = `
                    <div class="coord-input-group">
                        <span>(</span>
                        <input type="text" id="x_val" placeholder="x" readonly onclick="setActiveInput('x_val')">
                        <span>,</span>
                        <input type="text" id="y_val" placeholder="y" readonly onclick="setActiveInput('y_val')">
                        <span>)</span>
                    </div>
                    <div class="numpad">
                        <button onclick="numpadPress('1')">1</button>
                        <button onclick="numpadPress('2')">2</button>
                        <button onclick="numpadPress('3')">3</button>
                        <button onclick="numpadPress('4')">4</button>
                        <button onclick="numpadPress('5')">5</button>
                        <button onclick="numpadPress('6')">6</button>
                        <button onclick="numpadPress('7')">7</button>
                        <button onclick="numpadPress('8')">8</button>
                        <button onclick="numpadPress('9')">9</button>
                        <button class="action-btn" onclick="numpadPress('-')">-</button>
                        <button onclick="numpadPress('0')">0</button>
                        <button class="action-btn" onclick="numpadPress('back')">⌫</button>
                    </div>`;
                
                setActiveInput('x_val');
            }
        }

        function loadNewQuestion() {
            isTransitioning = false; 
            userClickedPoints = [];
            mistakesOnCurrent = 0;
            currentQ = generateQuestion();
            updateUI();
            renderCanvas();
        }

        function triggerErrorShake() {
            const container = document.getElementById('inputArea');
            const feedback = document.getElementById('feedbackBox');
            if(container) { container.classList.remove('shake-animation'); void container.offsetWidth; container.classList.add('shake-animation'); }
            feedback.classList.remove('shake-animation'); void feedback.offsetWidth; feedback.classList.add('shake-animation');
        }

        function showFeedback(message, type) {
            const fb = document.getElementById('feedbackBox');
            fb.innerHTML = message;
            fb.className = `feedback-box ${type}`;
        }

        function isSquareValid(pA, p1, p2, p3) {
            let pts = [pA, p1, p2, p3];
            let dSq = [];
            for(let i=0; i<4; i++) {
                for(let j=i+1; j<4; j++) {
                    dSq.push( Math.pow(pts[i].x - pts[j].x, 2) + Math.pow(pts[i].y - pts[j].y, 2) );
                }
            }
            dSq.sort((a, b) => a - b);
            return dSq[0] > 0 && dSq[0] === dSq[1] && dSq[1] === dSq[2] && dSq[2] === dSq[3] && 
                   dSq[4] === dSq[5] && dSq[4] === 2 * dSq[0];
        }

        function checkAnswer() {
            if (isTransitioning) return; 

            let isCorrect = false;

            if (!currentQ.isInteractive) {
                const xIn = parseInt(document.getElementById('x_val').value);
                const yIn = parseInt(document.getElementById('y_val').value);
                
                if (isNaN(xIn) || isNaN(yIn)) {
                    triggerErrorShake(); showFeedback("Fyll i både x och y.", "error"); return;
                }
                if (xIn === currentQ.answer.x && yIn === currentQ.answer.y) isCorrect = true;
                else if (xIn === currentQ.answer.y && yIn === currentQ.answer.x) {
                    showFeedback("Du har förväxlat x och y. X är liggande, Y är stående.", "error");
                    triggerErrorShake(); return;
                } else {
                    showFeedback(`Fel koordinater. Kolla noga från origo (0,0).`, "error");
                    triggerErrorShake(); return;
                }
            } 
            else if (currentQ.type === "click_single") {
                if (userClickedPoints.length === 0) { triggerErrorShake(); showFeedback("Klicka i diagrammet först.", "error"); return; }
                let pt = userClickedPoints[0];
                if (pt.x === currentQ.answer.x && pt.y === currentQ.answer.y) isCorrect = true;
                else { showFeedback(`Punkten hamnade fel.`, "error"); triggerErrorShake(); return; }
            }
            else if (currentQ.type === "click_square") {
                // NYTT: Nu krävs bara att 2 punkter är utsatta
                if (userClickedPoints.length < 2) {
                    triggerErrorShake(); showFeedback(`Sätt ut ${2 - userClickedPoints.length} punkt(er) till.`, "error"); return;
                }
                // NYTT: Rättar baserat på de två genererade och de två utplacerade
                if (isSquareValid(currentQ.points[0], currentQ.points[1], userClickedPoints[0], userClickedPoints[1])) {
                    isCorrect = true;
                } else {
                    triggerErrorShake(); showFeedback("Det blev ingen kvadrat. Börja om och testa igen!", "error"); return;
                }
            }

            if (isCorrect) {
                isTransitioning = true; 
                showFeedback("Helt rätt!", "success");
                
                if (currentLevel === 5) {
                    endlessScore++;
                    localStorage.setItem('coord_endlessScore', endlessScore);
                    document.getElementById('endlessScoreText').innerText = endlessScore;
                } else {
                    if (mistakesOnCurrent === 0) xp++; 
                    if (xp >= 3) {
                        currentLevel++; 
                        xp = 0;
                        if(currentLevel > unlockedLevel) {
                            unlockedLevel = Math.min(currentLevel, 5);
                            localStorage.setItem('coord_unlockedLevel', unlockedLevel);
                        }
                        localStorage.setItem('coord_currentLevel', currentLevel);
                        setTimeout(() => showFeedback(currentLevel === 5 ? "Grymt! Du har låst upp Mängdträning!" : "Level Up! Nu blir det svårare.", "success"), 500);
                    }
                    document.getElementById('xpBar').style.width = `${(xp / 3) * 100}%`;
                }

                canvas.classList.remove("interactive");
                
                let timeLeft = 2; 
                const btnArea = document.getElementById('buttonArea');
                btnArea.innerHTML = `<div class="timer-text">Nästa om ${timeLeft}...</div>`;
                
                countdownTimer = setInterval(() => {
                    timeLeft--;
                    if(timeLeft <= 0) {
                        clearInterval(countdownTimer);
                        loadNewQuestion();
                    } else {
                        btnArea.innerHTML = `<div class="timer-text">Nästa om ${timeLeft}...</div>`;
                    }
                }, 1000);

            } else {
                mistakesOnCurrent++;
                if (mistakesOnCurrent >= 3 && currentLevel > 1 && currentLevel < 5) {
                    isTransitioning = true; 
                    currentLevel--; xp = 0;
                    localStorage.setItem('coord_currentLevel', currentLevel);
                    showFeedback("Vi backar ett steg så du får öva mer.", "error");
                    triggerErrorShake();
                    setTimeout(() => loadNewQuestion(), 3000);
                } else if (mistakesOnCurrent >= 3 && currentLevel === 5) {
                    showFeedback("Ingen fara, försök igen!", "error");
                    triggerErrorShake();
                }
            }
        }

        loadNewQuestion();
    </script>
</body>
</html>
