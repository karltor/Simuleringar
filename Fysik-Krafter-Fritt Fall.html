<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulering: Fritt Fall</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #ef4444; 
      --btn-bg: #0f172a;
      --btn-text: #f8fafc;
      --btn-hover: #334155;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden; /* Nu funkar detta utan att gömma något! */
    }

    header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
    }
    
    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    main {
      display: flex;
      gap: 16px;
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
    }

    .stage-wrapper {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px -10px rgba(0,0,0,0.05);
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    aside {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px -10px rgba(0,0,0,0.05);
    }

    .panel h3 {
      margin: 0 0 12px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    /* Telemetrin utspridd på tre kolumner istället för två rader */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-box span.val {
      display: block;
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums; 
      color: var(--btn-bg);
    }

    .stat-box span.label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
      display: block;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group:last-of-type {
      margin-bottom: 12px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
    }

    .val-badge {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--btn-bg);
      margin: 0;
    }
    
    .note {
      font-size: 11px;
      color: var(--text-muted);
      margin: 6px 0 0 0;
      line-height: 1.3;
    }

    button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    button:hover { background: var(--btn-hover); }
    button:active { transform: scale(0.98); }

  </style>
</head>
<body>

  <header>
    <h1>Fritt Fall Simulering</h1>
    <p class="subtitle">Undersök hur luftmotstånd (atmosfärens densitet) påverkar hastigheten.</p>
  </header>

  <main>
    <div class="stage-wrapper">
      <canvas id="simCanvas"></canvas>
    </div>

    <aside>
      <div class="panel">
        <h3>Telemetri</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="val" id="time">0.00</span>
            <span class="label">Tid (s)</span>
          </div>
          <div class="stat-box">
            <span class="val" id="vel">0.00</span>
            <span class="label">Fart (m/s)</span>
          </div>
          <div class="stat-box">
            <span class="val" id="height">50.0</span>
            <span class="label">Höjd (m)</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Förutsättningar</h3>
        
        <div class="control-group">
          <div class="control-header">
            <span>Fallhöjd</span>
            <span class="val-badge"><span id="hVal">50</span> m</span>
          </div>
          <input type="range" id="startHeight" min="10" max="200" value="50">
        </div>

        <div class="control-group">
          <div class="control-header">
            <span>Atmosfärens densitet</span>
            <span class="val-badge" id="dVal">1.20</span>
          </div>
          <input type="range" id="densitySlider" min="0" max="100" value="50">
          <p class="note">Mitten = Jordens atmosfär (1.2). Noll = Vakuum. Max = Extrem gasjätte (12.0).</p>
        </div>

        <button onclick="resetSim()">▶︎ Släpp bollen!</button>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let y = 0;             
    let velocity = 0;      
    let time = 0;          
    const g = 9.82;        
    let dt = 0.016;        
    let isRunning = false;
    let actualDensity = 1.2; 
    let particles = [];

    function calculateDensity(sliderValue) {
      if (sliderValue <= 50) {
        return (sliderValue / 50) * 1.2;
      } else {
        let x = (sliderValue - 50) / 50;
        return 1.2 * Math.pow(10, x);
      }
    }

    function createParticles() {
      particles = [];
      let count = actualDensity * 30; 
      if(count > 400) count = 400;    
      
      for(let i=0; i<count; i++) {
        particles.push({
          x: Math.random(), 
          y: Math.random(),
          s: Math.random() * 2 + 1 
        });
      }
    }

    function fitCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentNode.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    function draw() {
      const rect = canvas.parentNode.getBoundingClientRect();
      const targetHeight = parseFloat(document.getElementById('startHeight').value);
      
      const topMargin = 40;
      const bottomMargin = 40;
      const availablePx = rect.height - topMargin - bottomMargin;
      const scale = availablePx / targetHeight; 

      let darkness = Math.min(1, actualDensity / 6);
      ctx.fillStyle = `rgba(224, 242, 254, ${1 - darkness * 0.5})`;
      ctx.fillRect(0, 0, rect.width, rect.height);
      
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(0, rect.height - bottomMargin, rect.width, bottomMargin);

      ctx.fillStyle = "rgba(100, 150, 200, 0.4)";
      particles.forEach(p => {
        let px = p.x * rect.width;
        let py = p.y * rect.height;
        ctx.beginPath();
        ctx.arc(px, py, p.s, 0, Math.PI*2);
        ctx.fill();
        
        if (isRunning) {
            p.y -= (velocity * scale * dt * 0.002); 
            if (p.y < 0) {
                p.y = 1;
                p.x = Math.random();
            }
        }
      });

      const ballPxY = topMargin + (y * scale);
      ctx.fillStyle = "var(--accent)";
      ctx.beginPath();
      ctx.arc(rect.width/2, ballPxY, 15, 0, Math.PI*2);
      ctx.fill();
      
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.beginPath();
      ctx.arc(rect.width/2 - 4, ballPxY - 4, 4, 0, Math.PI*2);
      ctx.fill();

      if (isRunning) {
        const k = 0.05; 
        let dragForce = k * actualDensity * Math.pow(velocity, 2);
        let acceleration = g - dragForce;
        
        if (acceleration < 0 && velocity > 0) {
             acceleration = (0 - velocity)/dt; 
        }

        velocity += acceleration * dt;
        y += velocity * dt;
        time += dt;

        document.getElementById('time').innerText = time.toFixed(2);
        document.getElementById('vel').innerText = velocity.toFixed(2);
        document.getElementById('height').innerText = Math.max(0, (targetHeight - y)).toFixed(1);

        if (y >= targetHeight) {
            y = targetHeight;
            isRunning = false;
            velocity = 0; 
            document.getElementById('height').innerText = "0.0";
        }
      }
      
      requestAnimationFrame(draw);
    }

    function resetSim() {
      y = 0;
      velocity = 0;
      time = 0;
      isRunning = true;
      document.getElementById('height').innerText = document.getElementById('startHeight').value;
      particles.forEach(p => p.y = Math.random());
    }

    document.getElementById('densitySlider').oninput = function() {
      actualDensity = calculateDensity(this.value);
      document.getElementById('dVal').innerText = actualDensity.toFixed(2);
      createParticles();
      y = 0; velocity = 0; time = 0; isRunning = false;
      document.getElementById('height').innerText = document.getElementById('startHeight').value;
    }
    
    document.getElementById('startHeight').oninput = function() {
      document.getElementById('hVal').innerText = this.value;
      y = 0; velocity = 0; time = 0; isRunning = false;
      document.getElementById('height').innerText = this.value;
    }
    
    window.addEventListener('resize', fitCanvas);

    fitCanvas();
    createParticles();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
