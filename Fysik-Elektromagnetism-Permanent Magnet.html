<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fysiklab: Magnetism</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f8fafc; }
    canvas { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Hjälpfunktioner för Rendering ---
    const drawParticle = (ctx, x, y, spinUp, radius = 15, isDragging = false, energy = 0) => {
      ctx.save();
      
      let renderX = x;
      let renderY = y;
      
      if (energy > 50) {
        renderX += (Math.random() - 0.5) * (energy / 10);
        renderY += (Math.random() - 0.5) * (energy / 10);
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(239, 68, 68, 0.8)'; // Röd skugga
      } else if (isDragging) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(14, 165, 233, 0.8)';
      }

      // Kärnan
      ctx.beginPath();
      ctx.arc(renderX, renderY, radius, 0, Math.PI * 2);
      ctx.fillStyle = energy > 50 ? '#ef4444' : '#0ea5e9'; 
      ctx.fill();
      ctx.strokeStyle = energy > 50 ? '#991b1b' : '#0369a1';
      ctx.lineWidth = isDragging ? 4 : 2;
      ctx.stroke();

      // Pilen (Nu väldigt mörk för maximal kontrast mot vit/ljusgrå bakgrund)
      ctx.beginPath();
      ctx.moveTo(renderX, renderY + (spinUp ? radius : -radius) * 0.5);
      ctx.lineTo(renderX, renderY + (spinUp ? -radius : radius) * 1.5);
      
      ctx.lineTo(renderX - 6, renderY + (spinUp ? -radius : radius) * 1.5 + (spinUp ? 6 : -6));
      ctx.moveTo(renderX, renderY + (spinUp ? -radius : radius) * 1.5);
      ctx.lineTo(renderX + 6, renderY + (spinUp ? -radius : radius) * 1.5 + (spinUp ? 6 : -6));
      
      ctx.strokeStyle = '#020617'; // Nästan svart
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      
      ctx.restore();
    };

    const drawWell = (ctx, x, y, width, label, isHighlight = false) => {
      ctx.beginPath();
      ctx.moveTo(x - width/2, y - 50);
      ctx.quadraticCurveTo(x - width/2, y + 50, x, y + 50);
      ctx.quadraticCurveTo(x + width/2, y + 50, x + width/2, y - 50);
      ctx.strokeStyle = isHighlight ? '#0ea5e9' : '#94a3b8'; 
      ctx.lineWidth = isHighlight ? 5 : 3;
      ctx.stroke();
      
      ctx.fillStyle = isHighlight ? '#0284c7' : '#475569';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 75);
    };

    function App() {
      const [step, setStep] = useState(1);

      const renderStep = () => {
        switch (step) {
          case 1: return <Step1Spin />;
          case 2: return <Step2Pauli />;
          case 3: return <Step3Exchange />;
          case 4: return <Step4Domains />;
          case 5: return <Step5Anisotropy />;
          default: return null;
        }
      };

      return (
        <div className="flex flex-col h-screen text-slate-800 font-sans">
          <header className="bg-white p-4 border-b border-slate-200 flex justify-between items-center shadow-sm z-20">
            <div>
              <h1 className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-700">
                Fysiklab: Magnetism
              </h1>
            </div>
            <div className="flex space-x-2">
              {[1, 2, 3, 4, 5].map((s) => (
                <button
                  key={s}
                  onClick={() => setStep(s)}
                  className={`w-10 h-10 rounded-full font-bold flex items-center justify-center transition-all duration-300 ${
                    step === s 
                      ? 'bg-blue-600 text-white shadow-md scale-110' 
                      : 'bg-slate-100 text-slate-500 hover:bg-slate-200 border border-slate-200'
                  }`}
                >
                  {s}
                </button>
              ))}
            </div>
          </header>
          <main className="flex-1 relative bg-slate-50 overflow-hidden">
             {renderStep()}
          </main>
        </div>
      );
    }

    // --- STEG 1 ---
    function Step1Spin() {
      const canvasRef = useRef(null);
      const [spinUp, setSpinUp] = useState(true);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationId;
        let time = 0;

        const render = () => {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          const x = canvas.width / 2;
          const y = canvas.height / 2 + Math.sin(time * 0.05) * 10; 

          // Fältlinjer
          ctx.strokeStyle = 'rgba(14, 165, 233, 0.3)';
          ctx.lineWidth = 2;
          for (let i = 1; i <= 5; i++) {
            ctx.beginPath();
            const r = i * 40;
            ctx.ellipse(x, y, r, r * 2, 0, spinUp ? Math.PI : 0, spinUp ? Math.PI*2 : Math.PI);
            ctx.stroke();
          }

          drawParticle(ctx, x, y, spinUp, 40);
          
          time++;
          animationId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationId);
      }, [spinUp]);

      return (
        <div className="absolute inset-0 w-full h-full flex flex-col md:flex-row">
          <div className="md:w-1/3 p-8 bg-white/95 backdrop-blur-md border-r border-slate-200 z-10 flex flex-col justify-center shadow-xl">
            <h2 className="text-3xl font-black text-sky-700 mb-6">1. Inbyggd Magnetism</h2>
            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm">
               <h3 className="text-xl font-bold text-slate-800 mb-2">Uppdrag:</h3>
               <p className="text-slate-600 mb-6 text-lg leading-relaxed">
                 Fysikens mest grundläggande regel om elektroner: De är små magneter från start. Klicka på knappen för att tvinga elektronens inbyggda magnetiska fält att byta riktning.
               </p>
               <button 
                  onClick={() => setSpinUp(!spinUp)}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-xl font-bold transition-colors shadow-md text-lg active:scale-95"
                >
                  Vänd Magnetfältet (Spinn)
                </button>
            </div>
          </div>
          <div className="absolute inset-0 w-full h-full">
            <canvas ref={canvasRef} className="w-full h-full" />
          </div>
        </div>
      );
    }

    // --- STEG 2: PAULI (Uppdaterad med magnet-liknelse) ---
    function Step2Pauli() {
      const canvasRef = useRef(null);
      const [spinUp, setSpinUp] = useState(true); 
      const isDragging = useRef(false);
      const hasDragged = useRef(false);
      const p1 = useRef({ x: 0, y: 0, vx: 0, vy: 0 }); // Den vi drar i
      const p2 = useRef({ spinUp: true }); // Den stationära i atomen
      const energyLevel = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationId;

        // Starta p1 i atomen så de börjar repelleras direkt (visar jämvikten)
        p1.current.x = canvas.clientWidth * 0.7;
        p1.current.y = canvas.clientHeight * 0.5;

        const getPointerPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const handleDown = (e) => {
            const pos = getPointerPos(e);
            const dx = pos.x - p1.current.x;
            const dy = pos.y - p1.current.y;
            if (Math.sqrt(dx*dx + dy*dy) < 60) {
                isDragging.current = true;
                hasDragged.current = true;
            }
        };
        const handleUp = () => { isDragging.current = false; };
        const handleMove = (e) => {
            if (!isDragging.current) return;
            const pos = getPointerPos(e);
            p1.current.x = pos.x;
            p1.current.y = pos.y;
        };

        canvas.addEventListener('mousedown', handleDown);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        canvas.addEventListener('touchstart', handleDown);
        canvas.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleUp);

        const render = () => {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          const atomX = canvas.width * 0.7;
          const atomY = canvas.height * 0.5;
          const fixedElectronX = atomX;
          const fixedElectronY = atomY;

          const dx = p1.current.x - fixedElectronX;
          const dy = p1.current.y - fixedElectronY;
          const dist = Math.max(10, Math.sqrt(dx*dx + dy*dy));
          
          let targetEnergy = 0;

          // Grundläggande dragningskraft in mot kärnan (som en fjäder)
          const k_attract = 0.05;
          let fx = -k_attract * dx;
          let fy = -k_attract * dy;

          // UPP TILL BEVIS: Magnetliknelsen
          if (spinUp === p2.current.spinUp) {
              // Samma Spinn (Repellerar som två Nordpoler via Inverse Square Law)
              const eq_dist = canvas.width * 0.2; // Jämvikt vid 20% av skärmen
              const C = k_attract * Math.pow(eq_dist, 3);
              const force_rep = C / (dist * dist);

              fx += (dx / dist) * force_rep;
              fy += (dy / dist) * force_rep;
              
              targetEnergy = Math.max(0, 150 - dist); // Röd glöd om vi tvingar in dem
          } else {
              // Motsatt Spinn (Attraherar/Trivs bredvid varandra)
              const targetX = atomX - 35; // Offset för att ligga bredvid
              fx = (targetX - p1.current.x) * 0.1;
              fy = (atomY - p1.current.y) * 0.1;
          }

          if (!isDragging.current) {
              // Begränsa max-kraft för att förhindra att den flyger av skärmen
              const maxForce = 30;
              const fMag = Math.sqrt(fx*fx + fy*fy);
              if (fMag > maxForce) {
                  fx = (fx / fMag) * maxForce;
                  fy = (fy / fMag) * maxForce;
              }

              p1.current.vx += fx;
              p1.current.vy += fy;
              p1.current.vx *= 0.82; // Friktion/luftmotstånd
              p1.current.vy *= 0.82;
              
              p1.current.x += p1.current.vx;
              p1.current.y += p1.current.vy;
          }
          
          // Hård gräns så den aldrig någonsin lämnar skärmen
          p1.current.x = Math.max(30, Math.min(canvas.width - 30, p1.current.x));
          p1.current.y = Math.max(30, Math.min(canvas.height - 30, p1.current.y));

          energyLevel.current += (targetEnergy - energyLevel.current) * 0.2;

          if (energyLevel.current > 10) {
             ctx.fillStyle = `rgba(239, 68, 68, ${Math.min(0.3, energyLevel.current / 150)})`;
             ctx.fillRect(0,0, canvas.width, canvas.height);
          }

          drawWell(ctx, atomX, atomY, 200, "Atomkärna");
          drawParticle(ctx, fixedElectronX, fixedElectronY, p2.current.spinUp, 20, false, 0);
          
          // Visuell indikator att p1 går att dra i
          if (!isDragging.current && !hasDragged.current) {
             ctx.beginPath();
             ctx.arc(p1.current.x, p1.current.y, 35 + Math.sin(Date.now()*0.005)*5, 0, Math.PI*2);
             ctx.strokeStyle = 'rgba(14, 165, 233, 0.6)';
             ctx.setLineDash([5, 5]);
             ctx.lineWidth = 2;
             ctx.stroke();
             ctx.setLineDash([]);
             ctx.fillStyle = '#0284c7';
             ctx.font = 'bold 14px sans-serif';
             ctx.textAlign = 'center';
             ctx.fillText("Dra i mig", p1.current.x, p1.current.y - 45);
          }

          drawParticle(ctx, p1.current.x, p1.current.y, spinUp, 20, isDragging.current, energyLevel.current);

          animationId = requestAnimationFrame(render);
        };
        render();

        return () => {
            cancelAnimationFrame(animationId);
            canvas.removeEventListener('mousedown', handleDown);
            canvas.removeEventListener('mousemove', handleMove);
            window.removeEventListener('mouseup', handleUp);
            canvas.removeEventListener('touchstart', handleDown);
            canvas.removeEventListener('touchmove', handleMove);
            window.removeEventListener('touchend', handleUp);
        };
      }, [spinUp]);

      return (
        <div className="absolute inset-0 w-full h-full flex flex-col md:flex-row">
          <div className="md:w-1/3 p-8 bg-white/95 backdrop-blur-md border-r border-slate-200 z-10 flex flex-col justify-center shadow-xl pointer-events-auto">
            <h2 className="text-3xl font-black text-sky-700 mb-6">2. Par-Regeln (Pauli)</h2>
            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
               <h3 className="text-xl font-bold text-slate-800">Uppdrag:</h3>
               <p className="text-slate-600 text-lg">
                 Dra din elektron mot atomkärnan. Vad händer om de snurrar åt samma håll?
               </p>
               
               <div className="pt-4">
                   <button 
                      onClick={() => setSpinUp(!spinUp)}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-xl font-bold transition-colors active:scale-95 text-lg"
                    >
                      Byt spinn på din elektron
                    </button>
               </div>
               <div className="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100">
                 <p className="text-sm text-blue-900 font-medium leading-relaxed">
                   Insikt: Precis som två vanliga stavmagneter dras elektroner med <strong>motsatt spinn</strong> mot varandra (attraherar) och får dela plats i atomen. Men om de har <strong>samma spinn</strong> stöter de bort varandra våldsamt!
                 </p>
               </div>
            </div>
          </div>
          <div className="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing">
            <canvas ref={canvasRef} className="w-full h-full touch-none" />
          </div>
        </div>
      );
    }

    // --- STEG 3: UTBYTESVÄXELVERKAN (Omskriven slutsats) ---
    function Step3Exchange() {
      const canvasRef = useRef(null);
      const [sameSpin, setSameSpin] = useState(true);
      
      const particles = useRef([
        { id: 1, x: 0, targetX: 0, spinUp: true, vx: 0 },
        { id: 2, x: 0, targetX: 0, spinUp: true, vx: 0 } 
      ]);
      const coulombEnergy = useRef(50); 

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationId;
        let time = 0;

        const render = () => {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          time++;

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          
          const atom1X = cx - 120;
          const atom2X = cx + 120;
          const wellWidth = 140;

          if (sameSpin) {
            particles.current[0].targetX = atom1X - 45; 
            particles.current[1].targetX = atom2X + 45;
            particles.current[1].spinUp = true;
          } else {
            particles.current[0].targetX = atom1X + 45;
            particles.current[1].targetX = atom2X - 45;
            particles.current[1].spinUp = false;
          }

          particles.current.forEach(p => {
            if(p.x === 0) p.x = p.targetX; 
            const ax = (p.targetX - p.x) * 0.05;
            p.vx = (p.vx + ax) * 0.7;
            p.x += p.vx + (Math.random() - 0.5) * (sameSpin ? 0.3 : 2.0); 
          });

          drawWell(ctx, atom1X, cy, wellWidth, "Järnatom 1");
          drawWell(ctx, atom2X, cy, wellWidth, "Järnatom 2");

          if (!sameSpin) {
              ctx.beginPath();
              ctx.moveTo(particles.current[0].x + 15, cy);
              for(let i = particles.current[0].x + 25; i < particles.current[1].x - 15; i+= 10) {
                  ctx.lineTo(i, cy + Math.sin(time*0.5 + i)*15);
              }
              ctx.lineTo(particles.current[1].x - 15, cy);
              ctx.strokeStyle = `rgba(239, 68, 68, 0.8)`;
              ctx.lineWidth = 6;
              ctx.stroke();
          }

          const targetEnergy = sameSpin ? 10 : 90;
          coulombEnergy.current += (targetEnergy - coulombEnergy.current) * 0.1;

          particles.current.forEach(p => {
             drawParticle(ctx, p.x, cy, p.spinUp, 20, false, !sameSpin ? coulombEnergy.current : 0);
          });

          animationId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationId);
      }, [sameSpin]);

      return (
        <div className="absolute inset-0 w-full h-full flex flex-col md:flex-row">
          <div className="md:w-1/3 p-8 bg-white/95 backdrop-blur-md border-r border-slate-200 z-10 flex flex-col justify-center shadow-xl pointer-events-auto">
            <h2 className="text-3xl font-black text-sky-700 mb-6">3. Järnets Hemlighet</h2>
            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
               <h3 className="text-xl font-bold text-slate-800">Uppdrag:</h3>
               <p className="text-slate-600 text-lg">
                 Testa tillstånden nedan. Vad händer när de två intilliggande elektronerna pekar åt motsatt håll?
               </p>
               
               <div className="flex flex-col gap-3 pt-2">
                  <button 
                    onClick={() => setSameSpin(false)}
                    className={`px-6 py-4 rounded-xl font-bold transition-all text-left text-lg ${!sameSpin ? 'bg-red-600 text-white shadow-md' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
                  >
                    1. Motsatt Spinn (Elektrisk stöt!)
                  </button>
                  <button 
                    onClick={() => setSameSpin(true)}
                    className={`px-6 py-4 rounded-xl font-bold transition-all text-left text-lg ${sameSpin ? 'bg-green-600 text-white shadow-md' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
                  >
                    2. Samma Spinn (Säkert avstånd)
                  </button>
              </div>
              <div className="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100">
                 <p className="text-sm text-blue-900 font-medium leading-relaxed">
                   <strong>Varför blir järn magnetiskt?</strong><br/>
                   1. Elektroner (minusladdningar) hatar att vara nära varandra.<br/>
                   2. Om de har *samma* spinn, repellerar de och tvingas ligga på varsin ytterkant.<br/>
                   3. Detta avstånd gör att de slipper krocka!<br/>
                   4. Att slippa krocka sparar energi. Därför snurrar järnatomerna hellre åt *samma håll*, och deras magnetfält slås ihop!
                 </p>
               </div>
            </div>
          </div>
          <div className="absolute inset-0 w-full h-full">
            <canvas ref={canvasRef} className="w-full h-full" />
          </div>
        </div>
      );
    }

    // --- STEG 4: DOMÄNER (Fixad dynamisk area) ---
    function Step4Domains() {
      const canvasRef = useRef(null);
      const mousePos = useRef({ x: -1000, y: -1000 });
      const isMagnetActive = useRef(false);
      const autoCompleting = useRef(false);
      
      // Vi skapar ett extremt stort rutnät i minnet, men ritar bara ut det som ryms på skärmen
      const MAX_ROWS = 60;
      const MAX_COLS = 60;
      
      const spins = useRef(Array(MAX_ROWS).fill().map((_, y) => 
        Array(MAX_COLS).fill().map((_, x) => ({
          targetAngle: (Math.floor(x/3) * 1.5 + Math.floor(y/3) * 2.1) % (Math.PI*2),
          angle: 0,
          aligned: false
        }))
      ));

      useEffect(() => {
        spins.current.forEach(row => row.forEach(spin => spin.angle = spin.targetAngle));
        autoCompleting.current = false;
        
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationId;

        const getPointerPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const handleMove = (e) => {
            mousePos.current = getPointerPos(e);
            isMagnetActive.current = true;
        };
        const handleLeave = () => { isMagnetActive.current = false; };

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('mouseleave', handleLeave);
        canvas.addEventListener('touchend', handleLeave);

        const render = () => {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          const cellW = 40; 
          const cellH = 40;
          
          const visibleCols = Math.min(MAX_COLS, Math.ceil(canvas.width / cellW));
          const visibleRows = Math.min(MAX_ROWS, Math.ceil(canvas.height / cellH));
          
          let totalVisible = 0;
          let alignedVisible = 0;

          // Kontrollera först hur många som är målade
          for (let y = 0; y < visibleRows; y++) {
            for (let x = 0; x < visibleCols; x++) {
              totalVisible++;
              if (spins.current[y][x].aligned) alignedVisible++;
            }
          }

          // Kedjereaktion om vi når 50%
          if (totalVisible > 0 && (alignedVisible / totalVisible) >= 0.5) {
              autoCompleting.current = true;
          }

          alignedVisible = 0; // Återställ för den riktiga ritloopen

          for (let y = 0; y < visibleRows; y++) {
            for (let x = 0; x < visibleCols; x++) {
              const spin = spins.current[y][x];
              const drawX = x * cellW + cellW/2;
              const drawY = y * cellH + cellH/2;
              
              if (autoCompleting.current) {
                  spin.targetAngle = -Math.PI / 2; // Tvinga uppåt automatiskt
                  spin.aligned = true;
              } else if (isMagnetActive.current) {
                  const dx = mousePos.current.x - drawX;
                  const dy = mousePos.current.y - drawY;
                  const dist = Math.sqrt(dx*dx + dy*dy);
                  
                  if (dist < 180) { // Penselstorlek
                      spin.targetAngle = -Math.PI / 2;
                      spin.aligned = true;
                  }
              }
              
              const diff = spin.targetAngle - spin.angle;
              spin.angle += diff * 0.15; 

              if (spin.aligned) alignedVisible++;

              ctx.save();
              ctx.translate(drawX, drawY);
              ctx.rotate(spin.angle);
              
              ctx.fillStyle = spin.aligned ? '#0ea5e9' : `hsl(${(spin.targetAngle * 180 / Math.PI) % 360}, 40%, 60%)`;
              
              ctx.beginPath();
              ctx.moveTo(-cellW*0.25, -cellH*0.1);
              ctx.lineTo(cellW*0.35, 0); 
              ctx.lineTo(-cellW*0.25, cellH*0.1);
              ctx.fill();
              ctx.restore();
            }
          }

          if (isMagnetActive.current && !autoCompleting.current) {
              ctx.beginPath();
              ctx.arc(mousePos.current.x, mousePos.current.y, 180, 0, Math.PI*2);
              ctx.strokeStyle = 'rgba(14, 165, 233, 0.4)';
              ctx.lineWidth = 3;
              ctx.stroke();
              ctx.fillStyle = 'rgba(14, 165, 233, 0.1)';
              ctx.fill();
          }

          const alignPercentage = totalVisible > 0 ? (alignedVisible / totalVisible) : 0;
          
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.fillRect(0, canvas.height - 70, canvas.width, 70);
          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(20, canvas.height - 40, canvas.width - 40, 16);
          ctx.fillStyle = alignPercentage >= 0.99 ? '#22c55e' : '#3b82f6'; // Grön när klar
          ctx.fillRect(20, canvas.height - 40, (canvas.width - 40) * alignPercentage, 16);
          
          ctx.fillStyle = '#1e293b';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`Materialets Nettomagnetfält: ${(alignPercentage*100).toFixed(0)}%`, canvas.width/2, canvas.height - 50);

          animationId = requestAnimationFrame(render);
        };
        render();
        
        return () => {
            cancelAnimationFrame(animationId);
            canvas.removeEventListener('mousemove', handleMove);
            canvas.removeEventListener('touchmove', handleMove);
            canvas.removeEventListener('mouseleave', handleLeave);
            canvas.removeEventListener('touchend', handleLeave);
        };
      }, []);

      return (
        <div className="absolute inset-0 w-full h-full flex flex-col md:flex-row">
           <div className="md:w-1/3 p-8 bg-white/95 backdrop-blur-md border-r border-slate-200 z-10 flex flex-col justify-start shadow-xl pointer-events-auto">
            <h2 className="text-3xl font-black text-sky-700 mb-6">4. Magnetiska Zoner</h2>
            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
               <h3 className="text-xl font-bold text-slate-800">Uppdrag:</h3>
               <p className="text-slate-600 text-lg">
                 Dra muspekaren över materialet för att agera stark extern magnet.
               </p>
               <p className="text-slate-600 text-lg">
                 Målet är att "måla" över hela ytan tills materialets nettomagnetfält når 100%.
               </p>
               <div className="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100">
                 <p className="text-sm text-blue-900 font-medium">
                   Insikt: I o-magnetiserat järn raderar lokala zoner ut varandra – fältet är 0. Men när du applicerar ett starkt fält utifrån tvingas de att rikta in sig, och de sparar denna nya riktning!
                 </p>
               </div>
            </div>
          </div>
          <div className="absolute inset-0 w-full h-full cursor-crosshair">
            <canvas ref={canvasRef} className="w-full h-full touch-none" />
          </div>
        </div>
      );
    }

    // --- STEG 5: ANISOTROPI (Sängen-liknelsen) ---
    function Step5Anisotropy() {
      const canvasRef = useRef(null);
      const isDragging = useRef(false);
      const currentAngle = useRef(0); 

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animationId;

        const getPointerPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const handleDown = (e) => { isDragging.current = true; handleMove(e); };
        const handleUp = () => { isDragging.current = false; };
        const handleMove = (e) => {
            if (!isDragging.current) return;
            const pos = getPointerPos(e);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            currentAngle.current = Math.atan2(pos.y - centerY, pos.x - centerX);
        };

        canvas.addEventListener('mousedown', handleDown);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        canvas.addEventListener('touchstart', handleDown);
        canvas.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleUp);

        const render = () => {
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;

          if (!isDragging.current) {
             const normalized = (currentAngle.current % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
             let target = (normalized > Math.PI / 2 && normalized < 3 * Math.PI / 2) ? Math.PI : 0;
             const diff = target - currentAngle.current;
             if (Math.abs(diff) > 0.01) {
                 currentAngle.current += diff * 0.15; 
             }
          }

          // Rita "Sängen" (Kristallstrukturen)
          ctx.fillStyle = '#e2e8f0'; 
          const gridRows = 5;
          const gridCols = 10;
          const spacingX = 60;
          const spacingY = 30; // Mycket smalare Y än X för att tydliggöra "sängen"
          
          for(let r= 0; r < gridRows; r++) {
              for(let c = 0; c < gridCols; c++) {
                  const x = cx + (c - gridCols/2 + 0.5) * spacingX;
                  const y = cy + (r - gridRows/2 + 0.5) * spacingY;
                  
                  if (c < gridCols - 1) {
                     ctx.beginPath();
                     ctx.moveTo(x, y);
                     ctx.lineTo(x + spacingX, y);
                     ctx.strokeStyle = '#cbd5e1';
                     ctx.lineWidth = 2;
                     ctx.stroke();
                  }
                  if (r < gridRows - 1) {
                     ctx.beginPath();
                     ctx.moveTo(x, y);
                     ctx.lineTo(x, y + spacingY);
                     ctx.stroke();
                  }
                  
                  ctx.beginPath();
                  ctx.arc(x, y, 6, 0, Math.PI*2);
                  ctx.fill();
              }
          }

          // Rita Lätta axeln (Bekväma sängen)
          ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
          ctx.fillRect(cx - 300, cy - 40, 600, 80);
          ctx.strokeStyle = 'rgba(34, 197, 94, 0.5)';
          ctx.lineWidth = 3;
          ctx.strokeRect(cx - 300, cy - 40, 600, 80);
          
          ctx.fillStyle = '#16a34a';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText("Lätt riktning (Kristallens långsida)", cx, cy - 50);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(currentAngle.current);
          
          ctx.fillStyle = '#0ea5e9';
          ctx.shadowBlur = isDragging.current ? 20 : 5;
          ctx.shadowColor = '#0ea5e9';
          
          ctx.beginPath();
          ctx.moveTo(0, -25);
          ctx.lineTo(160, 0); // Gör pilen lång för att visa att den är svår att vända
          ctx.lineTo(0, 25);
          ctx.fill();
          
          ctx.beginPath();
          ctx.arc(0, 0, 25, 0, Math.PI*2);
          ctx.fillStyle = '#0284c7';
          ctx.fill();
          ctx.restore();

          const diffFromHorizontal = Math.min(
              Math.abs(Math.cos(currentAngle.current - 0)),
              Math.abs(Math.cos(currentAngle.current - Math.PI))
          );
          
          ctx.textAlign = 'center';
          if (diffFromHorizontal > 0.95) {
             ctx.fillStyle = '#16a34a';
             ctx.font = 'bold 28px sans-serif';
             ctx.fillText("STABIL", cx, cy - 180);
          } else {
             ctx.fillStyle = '#ef4444';
             ctx.font = 'bold 28px sans-serif';
             ctx.fillText("OBEKVÄMT! (Släpp pilen)", cx, cy - 180);
          }

          animationId = requestAnimationFrame(render);
        };
        render();

        return () => {
            cancelAnimationFrame(animationId);
            canvas.removeEventListener('mousedown', handleDown);
            canvas.removeEventListener('mousemove', handleMove);
            window.removeEventListener('mouseup', handleUp);
            canvas.removeEventListener('touchstart', handleDown);
            canvas.removeEventListener('touchmove', handleMove);
            window.removeEventListener('touchend', handleUp);
        };
      }, []);

      return (
        <div className="absolute inset-0 w-full h-full flex flex-col md:flex-row">
           <div className="md:w-1/3 p-8 bg-white/95 backdrop-blur-md border-r border-slate-200 z-10 flex flex-col justify-start shadow-xl pointer-events-auto">
            <h2 className="text-3xl font-black text-sky-700 mb-6">5. Att bli "Permanent"</h2>
            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
               <h3 className="text-xl font-bold text-slate-800">Uppdrag:</h3>
               <p className="text-slate-600 text-lg">
                 Ta tag i den stora magnetiska pilen och tvinga den att peka rakt uppåt. Släpp den sedan.
               </p>
               <div className="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100">
                 <p className="text-sm text-blue-900 font-medium leading-relaxed">
                   <strong>Varför "vill" den ligga ner?</strong><br/>
                   Tänk dig att du ska sova i en väldigt smal säng. Det är lätt att ligga raklång (Lätt riktning), men obekvämt att ligga på tvären.<br/><br/>
                   På samma sätt är atomer i en bra magnet byggda i ett avlångt mönster. När elektronens fält sträcker ut sig längs mönstret, låser den fast sig själv. Det är detta (Anisotropi) som gör en magnet <strong>permanent!</strong>
                 </p>
               </div>
            </div>
          </div>
          <div className="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing">
            <canvas ref={canvasRef} className="w-full h-full touch-none" />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
