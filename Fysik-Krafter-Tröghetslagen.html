<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spaceship - Newton's First Law</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        .ui-element, #controls-tutorial {
            position: absolute;
            padding: 15px 25px;
            color: #fff;
            background: rgba(20, 25, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            user-select: none;
        }

        #score {
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4CAF50;
        }

        #velocity-meter {
            bottom: 20px;
            left: 20px;
            font-size: 1.1rem;
            color: #00bcd4;
        }

        #controls-tutorial {
            bottom: 20px;
            right: 20px;
            text-align: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
            gap: 10px;
        }

        .key {
            display: inline-block;
            min-width: 30px;
            height: 30px;
            line-height: 30px;
            background: linear-gradient(135deg, #444, #222);
            border: 1px solid #555;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            padding: 0 5px;
        }

        .label {
            font-size: 13px;
            color: #ccc;
        }
        
        .warning-label {
            color: #ffaa00;
            font-size: 11px;
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #popup-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff5555;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            border: 2px solid #ff5555;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="score" class="ui-element">Poäng: 0</div>
    <div id="velocity-meter" class="ui-element">Hastighet: 0 m/s</div>
    
    <div id="controls-tutorial">
        <h4 style="margin: 0 0 15px 0; color: #aaa; text-transform: uppercase; font-size: 12px;">Flygsystem</h4>
        <div class="control-group">
            <div class="key">W</div><div class="key">S</div>
            <div class="label">Huvudmotor (Gas/Back)</div>
        </div>
        <div class="control-group">
            <div class="key">A</div><div class="key">D</div>
            <div class="label">Roll (Rotera axel)</div>
        </div>
        <div class="control-group">
            <div class="key">↑</div><div class="key">↓</div>
            <div class="label">Pitch (Nos Upp/Ner)</div>
        </div>
        <div class="control-group">
            <div class="key">←</div><div class="key">→</div>
            <div class="label">Yaw (Nos Vänster/Höger)</div>
        </div>
        <div class="warning-label">Tröghet aktiv: Ge motkraft för att stanna</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, spaceship, engineLight;
        let starGeo, stars, dustGeo, dust;
        let asteroids = [];
        let explosions = []; 
        let score = 0;

        // Fysikvariabler - Newton mode
        let velocity = new THREE.Vector3();
        let acceleration = new THREE.Vector3();
        let rotationSpeed = new THREE.Vector3(0, 0, 0); 
        const thrust = 0.0015; 
        const drag = 1.0; 
        const rotationAcceleration = 0.0001; 
        const boundaryLimit = 1500;

        // Tröskelvärden för flygassistans (auto-stop)
        const rotAssistThreshold = 0.002; 
        const velAssistThreshold = 0.03;

        // Input state
        const keys = { w: false, s: false, a: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0005); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            createEnvironment();
            createIntricateSpaceship(); 
            generateAsteroids();

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', (e) => setKey(e.key, true), false);
            document.addEventListener('keyup', (e) => setKey(e.key, false), false);

            animate();
        }

        function setKey(key, isPressed) {
            if (keys.hasOwnProperty(key)) keys[key] = isPressed;
        }

        function createIntricateSpaceship() {
            spaceship = new THREE.Group();

            // --- Material Setup ---
            const darkMetal = new THREE.MeshStandardMaterial({ color: 0x222629, metalness: 0.8, roughness: 0.3, flatShading: true });
            const lightMetal = new THREE.MeshStandardMaterial({ color: 0x88929e, metalness: 0.7, roughness: 0.4, flatShading: true });
            const accentMetal = new THREE.MeshStandardMaterial({ color: 0xd9534f, metalness: 0.6, roughness: 0.2, flatShading: true }); 
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x050a11, metalness: 1.0, roughness: 0.0, transparent: true, opacity: 0.8, flatShading: true });
            const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 

            // 1. Central Kropp (Hexagon)
            const coreGeo = new THREE.CylinderGeometry(0.7, 1.2, 5, 6);
            coreGeo.rotateX(Math.PI / 2);
            const core = new THREE.Mesh(coreGeo, lightMetal);
            spaceship.add(core);

            // 2. Nos (Kon)
            const noseGeo = new THREE.ConeGeometry(0.7, 3.5, 6);
            noseGeo.rotateX(Math.PI / 2);
            const nose = new THREE.Mesh(noseGeo, darkMetal);
            nose.position.set(0, 0, -4.25);
            spaceship.add(nose);

            // 3. Cockpit (Aggressiv diamantform)
            const canopyGeo = new THREE.CylinderGeometry(0.5, 0.7, 2.5, 4);
            canopyGeo.rotateX(Math.PI / 2);
            canopyGeo.rotateZ(Math.PI / 4); 
            const canopy = new THREE.Mesh(canopyGeo, glassMat);
            canopy.position.set(0, 0.9, -1.2);
            canopy.scale.set(1, 0.6, 1);
            spaceship.add(canopy);

            // 4. Sidokroppar (Pods)
            const podGeo = new THREE.CylinderGeometry(0.4, 0.6, 4, 8);
            podGeo.rotateX(Math.PI / 2);
            const podL = new THREE.Mesh(podGeo, darkMetal);
            podL.position.set(-1.2, 0, 0.5);
            const podR = new THREE.Mesh(podGeo, darkMetal);
            podR.position.set(1.2, 0, 0.5);
            spaceship.add(podL);
            spaceship.add(podR);

            // 5. Huvudvingar (Bakåtsvepta)
            const wingGeo = new THREE.BoxGeometry(8, 0.2, 3);
            
            const wingL = new THREE.Mesh(wingGeo, lightMetal);
            wingL.position.set(-3.5, 0, 1.5);
            wingL.rotation.y = -Math.PI / 7; 
            spaceship.add(wingL);

            const wingR = new THREE.Mesh(wingGeo, lightMetal);
            wingR.position.set(3.5, 0, 1.5);
            wingR.rotation.y = Math.PI / 7;
            spaceship.add(wingR);

            // BORTTAGET: Winglets (orange klossar på kanterna)

            // 6. Laserkononer (Detaljer på vingarna)
            const cannonGeo = new THREE.CylinderGeometry(0.08, 0.1, 2.5, 8);
            cannonGeo.rotateX(Math.PI / 2);
            
            const cannonL = new THREE.Mesh(cannonGeo, darkMetal);
            cannonL.position.set(-4.5, 0.2, 0);
            spaceship.add(cannonL);

            const cannonR = new THREE.Mesh(cannonGeo, darkMetal);
            cannonR.position.set(4.5, 0.2, 0);
            spaceship.add(cannonR);

            // 7. Motorblock (3 Thrusters)
            const mainEngineGeo = new THREE.CylinderGeometry(0.6, 0.9, 1.2, 12);
            mainEngineGeo.rotateX(Math.PI / 2);
            const mainEngine = new THREE.Mesh(mainEngineGeo, accentMetal);
            mainEngine.position.set(0, 0, 3.1);
            spaceship.add(mainEngine);

            const sideEngineGeo = new THREE.CylinderGeometry(0.35, 0.5, 1, 12);
            sideEngineGeo.rotateX(Math.PI / 2);
            
            const engineL = new THREE.Mesh(sideEngineGeo, darkMetal);
            engineL.position.set(-1.2, 0, 2.8);
            spaceship.add(engineL);

            const engineR = new THREE.Mesh(sideEngineGeo, darkMetal);
            engineR.position.set(1.2, 0, 2.8);
            spaceship.add(engineR);

            // 8. Greebles (Små tekniska paneler för realism)
            const greebleGeo = new THREE.BoxGeometry(0.3, 0.1, 0.4);
            for(let i=0; i<8; i++) {
                const g = new THREE.Mesh(greebleGeo, darkMetal);
                g.position.set(
                    (Math.random() - 0.5) * 1.5, 
                    0.6, 
                    (Math.random() - 0.5) * 3
                );
                spaceship.add(g);
            }

            // 9. Neonstrips
            const neonStripGeo = new THREE.BoxGeometry(3, 0.25, 0.1);
            const stripL = new THREE.Mesh(neonStripGeo, neonMat);
            stripL.position.set(-3, 0.05, 0.1);
            stripL.rotation.y = -Math.PI / 7;
            spaceship.add(stripL);

            const stripR = new THREE.Mesh(neonStripGeo, neonMat);
            stripR.position.set(3, 0.05, 0.1);
            stripR.rotation.y = Math.PI / 7;
            spaceship.add(stripR);

            // --- Uppdaterade Fysiska Jetflammor (Plasma-strålar) ---
            spaceship.userData.flames = [];
            
            const flameMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.9,
                blending: THREE.AdditiveBlending // Ger det en lysande, energetisk look
            });

            // Huvudflamma (Kon)
            const mainFlameGeo = new THREE.ConeGeometry(0.4, 3, 16);
            mainFlameGeo.rotateX(-Math.PI / 2); // Rikta den bakåt
            mainFlameGeo.translate(0, 0, 1.5); // Flytta pivot-punkten till basen
            
            const mainFlame = new THREE.Mesh(mainFlameGeo, flameMaterial);
            mainFlame.position.set(0, 0, 3.2);
            spaceship.add(mainFlame);
            spaceship.userData.flames.push(mainFlame);

            // Sidoflammor (Koner)
            const sideFlameGeo = new THREE.ConeGeometry(0.25, 2, 16);
            sideFlameGeo.rotateX(-Math.PI / 2);
            sideFlameGeo.translate(0, 0, 1.0);

            const sideFlameL = new THREE.Mesh(sideFlameGeo, flameMaterial);
            sideFlameL.position.set(-1.2, 0, 2.9);
            spaceship.add(sideFlameL);
            spaceship.userData.flames.push(sideFlameL);

            const sideFlameR = new THREE.Mesh(sideFlameGeo, flameMaterial);
            sideFlameR.position.set(1.2, 0, 2.9);
            spaceship.add(sideFlameR);
            spaceship.userData.flames.push(sideFlameR);

            // Dölj flammorna från början
            spaceship.userData.flames.forEach(f => f.scale.set(0.01, 0.01, 0.01));

            // Motorljus (PointLight)
            engineLight = new THREE.PointLight(0x00ffff, 0, 15); 
            engineLight.position.set(0, 0, 4.5);
            spaceship.add(engineLight);

            // Strålkastare framåt
            const headLight = new THREE.SpotLight(0xffffff, 2.5, 300, 0.4, 0.5, 1);
            headLight.position.set(0, -0.5, -4);
            headLight.target.position.set(0, 0, -20);
            spaceship.add(headLight);
            spaceship.add(headLight.target);

            scene.add(spaceship);
        }

        function createEnvironment() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xfffaaa, 1.8);
            sunLight.position.set(100, 200, 50);
            scene.add(sunLight);

            starGeo = new THREE.BufferGeometry();
            const starCount = 3000;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i < starCount * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 4000;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            dustGeo = new THREE.BufferGeometry();
            const dustCount = 1000;
            const dustPos = new Float32Array(dustCount * 3);
            for(let i=0; i < dustCount * 3; i++) {
                dustPos[i] = (Math.random() - 0.5) * 400; 
            }
            dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
            const dustMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.5, transparent: true, opacity: 0.6 });
            dust = new THREE.Points(dustGeo, dustMat);
            scene.add(dust);
        }

        function generateAsteroids() {
            const rockMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x666666, 
                roughness: 0.8, 
                flatShading: true 
            });

            for (let i = 0; i < 150; i++) {
                const radius = (Math.random() * 8) + 4;
                const asteroidGeometry = new THREE.DodecahedronGeometry(radius, 1); 
                
                const positions = asteroidGeometry.attributes.position;
                for(let j=0; j < positions.count; j++) {
                    positions.setX(j, positions.getX(j) * (0.8 + Math.random() * 0.4));
                    positions.setY(j, positions.getY(j) * (0.8 + Math.random() * 0.4));
                    positions.setZ(j, positions.getZ(j) * (0.8 + Math.random() * 0.4));
                }
                asteroidGeometry.computeVertexNormals();

                const asteroid = new THREE.Mesh(asteroidGeometry, rockMaterial);
                
                do {
                    asteroid.position.set(
                        (Math.random() - 0.5) * 2000,
                        (Math.random() - 0.5) * 2000,
                        (Math.random() - 0.5) * 2000
                    );
                } while (asteroid.position.length() < 100);

                asteroid.userData = {
                    rotX: (Math.random() - 0.5) * 0.02,
                    rotY: (Math.random() - 0.5) * 0.02,
                    rotZ: (Math.random() - 0.5) * 0.02
                };

                scene.add(asteroid);
                asteroids.push(asteroid);
            }
        }

        function createExplosion(position) {
            const particleCount = 30;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;
                
                velocities.push(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                );
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ 
                color: 0xff8800,
                size: 2, 
                transparent: true, 
                opacity: 1 
            });
            
            const explosion = new THREE.Points(geometry, material);
            scene.add(explosion);
            
            explosions.push({ mesh: explosion, velocities: velocities, age: 0 });
        }

        function handleInput() {
            // Acceleration & Visuella Motorflammor
            if (keys.w) {
                acceleration.set(0, 0, -thrust);
                engineLight.intensity = 3; 
                // Skjut ut en lång och intensiv flamma
                spaceship.userData.flames.forEach(f => f.scale.set(1, 1, 1.5));
            } else if (keys.s) {
                acceleration.set(0, 0, thrust); 
                engineLight.intensity = 1;
                // Kort, bredare retro-burn när man backar/bromsar
                spaceship.userData.flames.forEach(f => f.scale.set(0.6, 0.6, 0.2));
            } else {
                acceleration.set(0, 0, 0);
                engineLight.intensity = 0;
                // Göm flamman helt
                spaceship.userData.flames.forEach(f => f.scale.set(0.01, 0.01, 0.01));
            }

            // Pitch (Upp/Ner)
            if (keys.ArrowUp) rotationSpeed.x += rotationAcceleration; 
            if (keys.ArrowDown) rotationSpeed.x -= rotationAcceleration; 

            // Yaw (Vänster/Höger)
            if (keys.ArrowLeft) rotationSpeed.y += rotationAcceleration; 
            if (keys.ArrowRight) rotationSpeed.y -= rotationAcceleration; 

            // Roll
            if (keys.a) rotationSpeed.z += rotationAcceleration; 
            if (keys.d) rotationSpeed.z -= rotationAcceleration; 

            // FLYGASSISTANS (Auto-stop på små rörelser)
            if (!keys.ArrowUp && !keys.ArrowDown && Math.abs(rotationSpeed.x) < rotAssistThreshold) {
                rotationSpeed.x *= 0.95;
            }
            if (!keys.ArrowLeft && !keys.ArrowRight && Math.abs(rotationSpeed.y) < rotAssistThreshold) {
                rotationSpeed.y *= 0.95;
            }
            if (!keys.a && !keys.d && Math.abs(rotationSpeed.z) < rotAssistThreshold) {
                rotationSpeed.z *= 0.95;
            }

            if (!keys.w && !keys.s && velocity.length() < velAssistThreshold) {
                velocity.multiplyScalar(0.95);
            }

            if (Math.abs(rotationSpeed.x) < 0.00001) rotationSpeed.x = 0;
            if (Math.abs(rotationSpeed.y) < 0.00001) rotationSpeed.y = 0;
            if (Math.abs(rotationSpeed.z) < 0.00001) rotationSpeed.z = 0;
            if (velocity.length() < 0.00001) velocity.set(0, 0, 0);
        }

        function checkCollisions() {
            const shipRadius = 3.5; 
            
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                
                asteroid.rotation.x += asteroid.userData.rotX;
                asteroid.rotation.y += asteroid.userData.rotY;
                asteroid.rotation.z += asteroid.userData.rotZ;

                const dist = spaceship.position.distanceTo(asteroid.position);
                const asteroidRadius = asteroid.geometry.parameters.radius;

                if (dist < shipRadius + asteroidRadius) {
                    createExplosion(asteroid.position);
                    scene.remove(asteroid);
                    asteroids.splice(i, 1);
                    score += 10;
                    updateScore();
                }
            }
        }

        function checkBoundary() {
            if (spaceship.position.length() > boundaryLimit) {
                resetSpaceship();
            }
        }

        function resetSpaceship() {
            spaceship.position.set(0, 0, 0);
            velocity.set(0, 0, 0);
            rotationSpeed.set(0, 0, 0);
            spaceship.quaternion.identity();
            score = Math.floor(score / 2);
            updateScore();
            showPopup("Tappa inte bort dig i rymden!");
        }

        function updateScore() {
            document.getElementById('score').innerText = 'Poäng: ' + score;
        }

        function showPopup(message) {
            let popup = document.getElementById('popup-message');
            if (!popup) {
                popup = document.createElement('div');
                popup.id = 'popup-message';
                document.body.appendChild(popup);
            }
            popup.textContent = message;
            popup.style.opacity = '1';
            
            setTimeout(() => {
                popup.style.opacity = '0';
            }, 3000);
        }

        function updateCamera() {
            let relativeCameraOffset = new THREE.Vector3(0, 4, 15); 
            let cameraOffset = relativeCameraOffset.applyMatrix4(spaceship.matrixWorld);
            
            camera.position.copy(cameraOffset);
            camera.lookAt(spaceship.position);
            
            let up = new THREE.Vector3(0, 1, 0).applyQuaternion(spaceship.quaternion);
            camera.up.copy(up);
        }

        function animateEnvironment() {
            dust.position.copy(spaceship.position);
            
            const positions = dustGeo.attributes.position.array;
            const shipDir = velocity.clone().normalize();
            const speed = velocity.length();

            for(let i=0; i < positions.length; i+=3) {
                positions[i] -= shipDir.x * speed * 0.5;
                positions[i+1] -= shipDir.y * speed * 0.5;
                positions[i+2] -= shipDir.z * speed * 0.5;

                const dx = positions[i];
                const dy = positions[i+1];
                const dz = positions[i+2];
                if (Math.sqrt(dx*dx + dy*dy + dz*dz) > 200) {
                    positions[i] = (Math.random() - 0.5) * 400 + shipDir.x * 200;
                    positions[i+1] = (Math.random() - 0.5) * 400 + shipDir.y * 200;
                    positions[i+2] = (Math.random() - 0.5) * 400 + shipDir.z * 200;
                }
            }
            dustGeo.attributes.position.needsUpdate = true;
            
            for (let i = explosions.length - 1; i >= 0; i--) {
                let exp = explosions[i];
                let expPositions = exp.mesh.geometry.attributes.position.array;
                
                for (let j = 0; j < expPositions.length / 3; j++) {
                    expPositions[j * 3] += exp.velocities[j * 3];
                    expPositions[j * 3 + 1] += exp.velocities[j * 3 + 1];
                    expPositions[j * 3 + 2] += exp.velocities[j * 3 + 2];
                }
                
                exp.mesh.geometry.attributes.position.needsUpdate = true;
                exp.mesh.material.opacity -= 0.02; 
                exp.age++;
                
                if (exp.age > 50) {
                    scene.remove(exp.mesh);
                    exp.mesh.geometry.dispose();
                    exp.mesh.material.dispose();
                    explosions.splice(i, 1);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            handleInput();

            spaceship.rotateX(rotationSpeed.x);
            spaceship.rotateY(rotationSpeed.y);
            spaceship.rotateZ(rotationSpeed.z);

            const localAccel = acceleration.clone().applyQuaternion(spaceship.quaternion);
            velocity.add(localAccel);
            
            velocity.multiplyScalar(drag); 
            spaceship.position.add(velocity);

            document.getElementById('velocity-meter').textContent = `Hastighet: ${(velocity.length() * 100).toFixed(0)} m/s`;
            
            checkCollisions();
            checkBoundary();
            updateCamera();
            animateEnvironment();

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
