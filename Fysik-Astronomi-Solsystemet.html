<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solsystemets Skala - 3D Simulering</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        .panel {
            background: rgba(10, 15, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            max-width: 350px;
            pointer-events: auto;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #4da8da;
        }
        p {
            margin: 0 0 15px 0;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ccc;
        }
        .controls-hint {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            color: #aaa;
        }
        .controls-hint svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .planet-label {
            position: absolute;
            top: 0; left: 0;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            pointer-events: none; /* Klick går igenom etiketten */
            transform: translate(-50%, -50%);
            z-index: 5;
            transition: opacity 0.2s;
        }
        .planet-label.hidden {
            opacity: 0;
        }
        .moon-label {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255,255,255,0.1);
            color: #aaddff;
            font-size: 0.65rem;
        }
        .slider-container {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
        }
        .slider-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        input[type=range] {
            width: 100%;
            accent-color: #4da8da;
        }
        .two-col-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .two-col-grid .col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 0.9rem;
        }
        button:hover {
            background: rgba(77, 168, 218, 0.4);
            border-color: #4da8da;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: white;
            z-index: 20;
            transition: opacity 0.5s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">Genererar Solsystemet...</div>
    <div id="labels-container"></div>

    <div id="ui-container">
        <div class="panel">
            <h1>Solsystemets Skala</h1>
            <p>1 enhet = 1 miljon km. Avstånden är proportionerligt korrekta för att visa de enorma avstånden.</p>
            
            <div class="controls-hint">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                Skrolla/Nyp för att zooma. Dra för att rotera i 3D.
            </div>

            <div class="slider-container">
                <label for="sizeSlider">
                    <span>Planetstorlek (Visuell):</span>
                    <span id="sliderValue">20x</span>
                </label>
                <input type="range" id="sizeSlider" min="1" max="50" step="1" value="20" oninput="updatePlanetSizes(this.value)">
            </div>

            <div class="slider-container">
                <label for="speedSlider">
                    <span>Animeringshastighet:</span>
                    <span id="speedValue">0.5x</span>
                </label>
                <input type="range" id="speedSlider" min="0" max="2" step="0.1" value="0.5" oninput="updateSpeed(this.value)">
            </div>

            <div class="btn-group">
                <button onclick="toggleLabels()" style="margin-bottom: 5px;">Visa/Dölj Etiketter</button>
                <div style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">Fokusera & Zooma på:</div>
                <div class="two-col-grid">
                    <div class="col">
                        <button onclick="flyAndFocus('Solen', 400)">Solen</button>
                        <button onclick="flyAndFocus('Merkurius', 2)">Merkurius</button>
                        <button onclick="flyAndFocus('Venus', 3)">Venus</button>
                        <button onclick="flyAndFocus('Jorden', 3)">Jorden</button>
                        <button onclick="flyAndFocus('Mars', 2)">Mars</button>
                        <button onclick="flyAndFocus('Ceres', 0.5)">Ceres</button>
                    </div>
                    <div class="col">
                        <button onclick="flyAndFocus('Jupiter', 25)">Jupiter</button>
                        <button onclick="flyAndFocus('Saturnus', 20)">Saturnus</button>
                        <button onclick="flyAndFocus('Uranus', 10)">Uranus</button>
                        <button onclick="flyAndFocus('Neptunus', 10)">Neptunus</button>
                        <button onclick="flyAndFocus('Pluto', 1)">Pluto (Kuiper)</button>
                        <button onclick="flyAndFocus('Oort', 8000000)">Oorts Kometmoln</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
        // --- GRUNDLÄGGANDE SETUP ---
        let scene, camera, renderer, controls;
        const planets = [];
        const clock = new THREE.Clock();

        let showLabels = true;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveMeshes = [];
        let focusedObject = null;
        const comets = [];
        const cometPaths = [];
        let globalTimeScale = 0.5;

        let flight = null;
        let sunGlowSprite;

        // 1 Enhet i Three.js = 1 Miljon Kilometer
        const DIST_SCALE = 1; 
        
        // Sanna radier i miljoner kilometer
        const SUN_RADIUS = 0.696; 

        window.onload = function() {
            init();
            animate();
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            
            // Justera UI för nya extrem-skalan
            const sizeSlider = document.getElementById('sizeSlider');
            sizeSlider.max = "5000";
            sizeSlider.value = "1000";
            updatePlanetSizes(1000);
            
            // Justera fly-to knapparna så att de passar de nya små radierna
            const buttons = document.querySelectorAll('.two-col-grid button');
            const targetDistances = [
                4.0,   // Solen
                0.05,  // Merkurius
                0.05,  // Venus
                0.15,  // Jorden (För att se månen bra)
                0.05,  // Mars
                0.01,  // Ceres
                0.5,   // Jupiter
                0.5,   // Saturnus
                0.2,   // Uranus
                0.2,   // Neptunus
                0.05,  // Pluto
                8000000 // Oort
            ];
            buttons.forEach((btn, index) => {
                const name = btn.innerText.split(' ')[0].replace('Solen', 'Solen').replace('Pluto', 'Pluto');
                btn.onclick = () => flyAndFocus(name === 'Oorts' ? 'Oort' : name, targetDistances[index]);
            });
        };

        function init() {
            scene = new THREE.Scene();
            
            // Extremt låg "near plane" för att inte klippa igenom true-scale planeter när man är inzoomad
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.00001, 15000000);
            camera.position.set(0, 300, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 12000000; 
            controls.minDistance = 0.0001; // Sänkt drastiskt för att kunna zooma på 1x planeter
            controls.target.set(0, 0, 0);

            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);
            const sunLight = new THREE.PointLight(0xffffee, 2, 20000000);
            scene.add(sunLight);

            window.addEventListener('pointerup', onMouseClick, false);
            window.addEventListener('wheel', cancelFlight, {passive: true});
            window.addEventListener('pointerdown', cancelFlight, {passive: true});
            window.addEventListener('touchstart', cancelFlight, {passive: true});

            // --- SKAPA SOLSYSTEMET (NU MED SANNA FYSISKA RADIER I MILJONER KM) ---
            createSun();
            
            createPlanet("Merkurius", 0.00244, 58, 0x888888, null, 0.04);
            createPlanet("Venus", 0.00605, 108, 0xe3bb76, null, 0.015);
            
            // Jorden & Månen (Månen är ca 0.38 miljoner km bort)
            createPlanet("Jorden", 0.00637, 150, 0x2b82c9, createEarthTexture, 0.01, false, { count: 1, named: ["Månen"] }, 0.384);
            
            createPlanet("Mars", 0.00339, 228, 0xc1440e, null, 0.008, false, { count: 2, named: ["Phobos", "Deimos"] }, 0.023);

            createAsteroidBelt(300, 600, 2500);
            createDwarfPlanet("Ceres", 0.00047, 413, 0x999999, 0.005);

            createPlanet("Jupiter", 0.07149, 779, 0xc88b3a, createJupiterTexture, 0.002, false, { count: 4, named: ["Io", "Europa", "Ganymedes", "Callisto"] }, 1.88);
            createPlanet("Saturnus", 0.05823, 1434, 0xeaddb9, null, 0.0009, true, { count: 4, named: ["Titan", "Rhea", "Iapetus", "Dione"] }, 1.22);
            createPlanet("Uranus", 0.02536, 2873, 0x4b70dd, null, 0.0004, false, { count: 4, named: ["Titania", "Oberon", "Umbriel", "Ariel"] }, 0.43);
            createPlanet("Neptunus", 0.02462, 4495, 0x274687, null, 0.0001, false, { count: 1, named: ["Triton"] }, 0.35);

            createKuiperBelt(4500, 7500, 12000);

            // Det unika binära Pluto/Charon-systemet
            createPlutoSystem(5900, 0.00008);
            createDwarfPlanet("Eris", 0.00116, 10100, 0xeeeeee, 0.00005);

            createOortCloud(20000, 7568000, 25000);
            createComets();
            createStars();

            window.addEventListener('resize', onWindowResize, false);
        }

        function createSun() {
            const sunGeometry = new THREE.SphereGeometry(1, 64, 64);
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            const grad = context.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.2, '#fff7a1');
            grad.addColorStop(1, '#ff8c00');
            context.fillStyle = grad;
            context.fillRect(0, 0, 256, 256);
            const texture = new THREE.CanvasTexture(canvas);

            const sunMaterial = new THREE.MeshBasicMaterial({ map: texture, color: 0xffffee });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.userData = { name: "Solen", isPlanet: true, baseRadius: SUN_RADIUS };
            scene.add(sun);
            interactiveMeshes.push(sun);

            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = 256; glowCanvas.height = 256;
            const glowCtx = glowCanvas.getContext('2d');
            const glowGrad = glowCtx.createRadialGradient(128, 128, 50, 128, 128, 128);
            glowGrad.addColorStop(0, 'rgba(255, 200, 50, 0.8)');
            glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
            glowCtx.fillStyle = glowGrad;
            glowCtx.fillRect(0, 0, 256, 256);
            const glowTexture = new THREE.CanvasTexture(glowCanvas);
            const glowMaterial = new THREE.SpriteMaterial({ map: glowTexture, transparent: true, blending: THREE.AdditiveBlending });
            sunGlowSprite = new THREE.Sprite(glowMaterial);
            scene.add(sunGlowSprite);
        }

        function createPlanet(name, baseRadius, distance, colorHex, textureFunc, speed, hasRings = false, moonData = null, moonBaseDist = 1) {
            const orbitContainer = new THREE.Object3D();
            scene.add(orbitContainer);

            const planetGroup = new THREE.Group();
            planetGroup.position.x = distance * DIST_SCALE;
            orbitContainer.add(planetGroup);

            let materialParams = { color: colorHex, roughness: 0.7, metalness: 0.1 };
            if (textureFunc) {
                materialParams.map = textureFunc();
                materialParams.color = 0xffffff;
            }

            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshStandardMaterial(materialParams);
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.userData = { name: name, isPlanet: true };
            interactiveMeshes.push(mesh);
            mesh.scale.set(baseRadius, baseRadius, baseRadius);
            planetGroup.add(mesh);

            if (hasRings) {
                const ringGeo = new THREE.RingGeometry(1.4, 2.2, 64);
                const ringMat = new THREE.MeshStandardMaterial({ 
                    color: 0xcfb285, side: THREE.DoubleSide, transparent: true, opacity: 0.8, roughness: 0.5
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2 - 0.3;
                mesh.add(ringMesh); 
            }

            const moonMaterials = [];
            const moonLabels = [];
            const moonAnimators = [];

            if (moonData && moonData.count > 0) {
                const moonSystem = new THREE.Group();
                planetGroup.add(moonSystem);

                for (let i = 0; i < moonData.named.length; i++) {
                    // Månarna placeras på logiska, sanna proportioner från planeten
                    const mDist = moonBaseDist + (i * moonBaseDist * 0.5);
                    const mGeo = new THREE.SphereGeometry(baseRadius * 0.25, 16, 16);
                    const mMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, transparent: true, opacity: 0 });
                    const mMesh = new THREE.Mesh(mGeo, mMat);
                    mMesh.position.x = mDist;

                    const mOrbit = new THREE.Object3D();
                    mOrbit.rotation.y = Math.random() * Math.PI * 2;
                    mOrbit.rotation.x = (Math.random() - 0.5) * 0.2;
                    mOrbit.add(mMesh);
                    moonSystem.add(mOrbit);

                    moonMaterials.push(mMat);
                    const keplerSpeed = 0.5 / Math.pow(mDist / moonBaseDist, 1.5);
                    moonAnimators.push({ obj: mOrbit, speed: keplerSpeed });

                    const label = document.createElement('div');
                    label.className = 'planet-label moon-label hidden';
                    label.innerText = moonData.named[i];
                    document.getElementById('labels-container').appendChild(label);
                    moonLabels.push({ element: label, mesh: mMesh });
                }
            }

            const pathGeo = new THREE.BufferGeometry();
            const points = [];
            const segments = 256; 
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * distance, 0, Math.sin(theta) * distance));
            }
            pathGeo.setFromPoints(points);
            const pathMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
            const pathLine = new THREE.Line(pathGeo, pathMat);
            scene.add(pathLine);

            const label = document.createElement('div');
            label.className = 'planet-label';
            label.innerText = name;
            document.getElementById('labels-container').appendChild(label);

            planets.push({
                container: orbitContainer,
                planetGroup: planetGroup,
                mesh: mesh,
                label: label,
                moonMaterials: moonMaterials,
                moonLabels: moonLabels,
                moonAnimators: moonAnimators,
                baseRadius: baseRadius, 
                speed: speed,
                rotationSpeed: 0.01 + Math.random() * 0.02,
                isInstanced: false
            });
        }

        // --- UNIK PLUTO/CHARON BARYCENTER SETUP ---
        function createPlutoSystem(distance, speed) {
            const orbitContainer = new THREE.Object3D();
            scene.add(orbitContainer);

            // Detta är systemets absoluta position i rymden kring solen
            const systemGroup = new THREE.Group();
            systemGroup.position.x = distance * DIST_SCALE;
            orbitContainer.add(systemGroup);

            // Barycentret snurrar runt sin egen axel
            const barycenter = new THREE.Group();
            systemGroup.add(barycenter);

            // Fysiskt sanna proportioner för Pluto och Charon (i miljoner km)
            const plutoRadius = 0.001188;
            const charonRadius = 0.000606;
            
            // Avståndet dem emellan är 19,570 km = 0.01957.
            // Massfördelningen gör att barycentret ligger 2110 km (0.00211) från Plutos centrum.
            const plutoOffset = -0.00211;
            const charonOffset = 0.01746; // Resterande avstånd (0.01957 - 0.00211)

            // PLUTO
            const plutoGeo = new THREE.SphereGeometry(1, 32, 32);
            const plutoMat = new THREE.MeshStandardMaterial({ color: 0xddccbb, roughness: 0.8 });
            const plutoMesh = new THREE.Mesh(plutoGeo, plutoMat);
            plutoMesh.scale.set(plutoRadius, plutoRadius, plutoRadius);
            plutoMesh.position.x = plutoOffset;
            plutoMesh.userData = { name: "Pluto", isPlanet: true };
            interactiveMeshes.push(plutoMesh);
            barycenter.add(plutoMesh);

            // CHARON
            const charonGeo = new THREE.SphereGeometry(1, 16, 16);
            const charonMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.9 });
            const charonMesh = new THREE.Mesh(charonGeo, charonMat);
            charonMesh.scale.set(charonRadius, charonRadius, charonRadius);
            charonMesh.position.x = charonOffset;
            charonMesh.userData = { name: "Charon", isPlanet: true };
            interactiveMeshes.push(charonMesh);
            barycenter.add(charonMesh);

            const pLabel = document.createElement('div');
            pLabel.className = 'planet-label';
            pLabel.innerText = "Pluto";
            document.getElementById('labels-container').appendChild(pLabel);

            const cLabel = document.createElement('div');
            cLabel.className = 'planet-label moon-label hidden';
            cLabel.innerText = "Charon";
            document.getElementById('labels-container').appendChild(cLabel);

            // Ritar Plutos omloppsbana
            const pathGeo = new THREE.BufferGeometry();
            const points = [];
            for (let i = 0; i <= 256; i++) {
                const theta = (i / 256) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * distance, 0, Math.sin(theta) * distance));
            }
            pathGeo.setFromPoints(points);
            const pathMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
            scene.add(new THREE.Line(pathGeo, pathMat));

            planets.push({
                container: orbitContainer,
                planetGroup: barycenter, // Vi skalar hela systemet som en enhet så avståndet bevaras i UI!
                mesh: plutoMesh, // Kameran låser på Pluto själv
                label: pLabel,
                charonMesh: charonMesh,
                charonLabel: cLabel,
                baseRadius: plutoRadius, 
                speed: speed,
                isPlutoSystem: true,
                barycenterSpeed: 0.5 // Snurrar relativt snabbt runt varandra (6.4 dagar)
            });
        }

        function createDwarfPlanet(name, baseRadius, distance, colorHex, speed) {
            createPlanet(name, baseRadius, distance, colorHex, null, speed, false, null);
        }

        function createComets() {
            const cometCount = 8;
            for (let i = 0; i < cometCount; i++) {
                const a = 1000000 + Math.random() * 2000000; 
                const perihelion = 100 + Math.random() * 700;
                const e = 1 - (perihelion / a);
                
                const orbitContainer = new THREE.Object3D();
                orbitContainer.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                scene.add(orbitContainer);

                const pathGeo = new THREE.BufferGeometry();
                const points = [];
                for (let theta = 0; theta <= Math.PI * 2; theta += 0.05) {
                    const r = (a * (1 - e * e)) / (1 + e * Math.cos(theta));
                    points.push(new THREE.Vector3(r * Math.cos(theta), 0, r * Math.sin(theta)));
                }
                const r0 = (a * (1 - e * e)) / (1 + e * Math.cos(0));
                points.push(new THREE.Vector3(r0 * Math.cos(0), 0, r0 * Math.sin(0)));
                pathGeo.setFromPoints(points);
                
                const pathMat = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.4 });
                const pathLine = new THREE.Line(pathGeo, pathMat);
                pathLine.visible = false; 
                orbitContainer.add(pathLine);
                cometPaths.push(pathLine);

                const cometGeo = new THREE.SphereGeometry(15, 8, 8);
                const cometMat = new THREE.MeshBasicMaterial({ color: 0x88ffff });
                const cometMesh = new THREE.Mesh(cometGeo, cometMat);
                orbitContainer.add(cometMesh);

                comets.push({ mesh: cometMesh, a: a, e: e, theta: Math.random() * Math.PI * 2 });
            }
        }

        function onMouseClick(event) {
            if(event.target.tagName === 'BUTTON' || event.target.tagName === 'INPUT') return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(interactiveMeshes);
            if (intersects.length > 0) {
                const targetObj = intersects[0].object;
                const name = targetObj.userData.name;
                
                let targetPos = new THREE.Vector3();
                targetObj.getWorldPosition(targetPos);
                let currentDist = camera.position.distanceTo(controls.target);
                
                flyAndFocus(name, currentDist);
            }
        }

        function toggleLabels() {
            showLabels = !showLabels;
            const labels = document.querySelectorAll('.planet-label');
            labels.forEach(l => {
                if(showLabels) l.classList.remove('hidden');
                else l.classList.add('hidden');
            });
        }

        function updatePlanetSizes(scaleFactor) {
            document.getElementById('sliderValue').innerText = (scaleFactor == 1 ? "1x (Sann skala)" : scaleFactor + "x");
            
            // Uppdatera Solens fasta mesh
            const sunMesh = interactiveMeshes.find(m => m.userData.name === 'Solen');
            if (sunMesh) {
                const sr = SUN_RADIUS * scaleFactor;
                sunMesh.scale.set(sr, sr, sr);
            }
            if (sunGlowSprite) {
                sunGlowSprite.scale.set(SUN_RADIUS * 6 * scaleFactor, SUN_RADIUS * 6 * scaleFactor, 1);
            }

            planets.forEach(p => {
                if (p.planetGroup && !p.isInstanced) {
                    // För barycentret (Pluto) och vanliga planeter
                    p.planetGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
                }
            });

            if (focusedObject) {
                if (focusedObject.userData.name === 'Solen') {
                    controls.minDistance = Math.max(0.0001, SUN_RADIUS * scaleFactor * 1.5);
                } else {
                    let pData = planets.find(p => p.mesh === focusedObject);
                    if (pData) controls.minDistance = Math.max(0.0001, pData.baseRadius * scaleFactor * 1.5);
                }
            }
        }

        function updateSpeed(scaleFactor) {
            globalTimeScale = parseFloat(scaleFactor);
            document.getElementById('speedValue').innerText = scaleFactor + "x";
        }

        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a5b8c';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#458b22';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * 512, y = Math.random() * 256, r = Math.random() * 20 + 5;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createJupiterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const colors = ['#a57c5b', '#c88b3a', '#e3cda4', '#b07f50', '#d8caab', '#a57c5b'];
            for (let y = 0; y < 256; y++) {
                let index = Math.floor((Math.sin(y * 0.1) + 1) * 2.5);
                if (Math.random() > 0.8) index = (index + 1) % colors.length;
                ctx.fillStyle = colors[index];
                ctx.fillRect(0, y, 1, 1);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createAsteroidBelt(innerRadius, outerRadius, count) {
            const geometry = new THREE.IcosahedronGeometry(1, 0);
            const material = new THREE.MeshStandardMaterial({ color: 0x887766, roughness: 0.8 });
            const instancedMesh = new THREE.InstancedMesh(geometry, material, count);
            const dummy = new THREE.Object3D();
            for (let i = 0; i < count; i++) {
                const r = innerRadius + Math.random() * (outerRadius - innerRadius);
                const theta = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 20;
                dummy.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                const scale = Math.random() * 1.5 + 0.5;
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedMesh);
            planets.push({ container: instancedMesh, speed: 0.001, isInstanced: true });
        }

        function createKuiperBelt(innerRadius, outerRadius, count) {
            const geometry = new THREE.IcosahedronGeometry(1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x99aabb, roughness: 0.6 });
            const instancedMesh = new THREE.InstancedMesh(geometry, material, count);
            const dummy = new THREE.Object3D();
            const midPoint = (innerRadius + outerRadius) / 2;
            const width = (outerRadius - innerRadius) / 2;
            for (let i = 0; i < count; i++) {
                const r = innerRadius + Math.random() * (outerRadius - innerRadius);
                const theta = Math.random() * Math.PI * 2;
                const normalizedDist = (r - midPoint) / width;
                const thicknessMultiplier = Math.sqrt(Math.max(0, 1 - normalizedDist * normalizedDist));
                const warp = Math.sin(theta * 2) * 200;
                const y = (Math.random() - 0.5) * 600 * thicknessMultiplier + warp;
                dummy.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                const scale = Math.random() * 2 + 0.5;
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedMesh);
            planets.push({ container: instancedMesh, speed: 0.0001, isInstanced: true });
        }

        function createOortCloud(innerRadius, outerRadius, count) {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < count; i++) {
                let x, y, z, r;
                do {
                    x = (Math.random() - 0.5) * 2;
                    y = (Math.random() - 0.5) * 2;
                    z = (Math.random() - 0.5) * 2;
                    r = Math.sqrt(x*x + y*y + z*z);
                } while (r > 1 || r < 0.1);
                const distance = innerRadius + Math.random() * (outerRadius - innerRadius);
                vertices.push((x / r) * distance, (y / r) * distance, (z / r) * distance);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ 
                color: 0x778899, size: 500, sizeAttenuation: true, transparent: true, opacity: 0.8
            });
            const oortCloud = new THREE.Points(geometry, material);
            scene.add(oortCloud);
            planets.push({ container: oortCloud, speed: 0.00001, isInstanced: true });
        }

        function createStars() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 8000;
            const starVertices = [];
            for(let i=0; i<starCount; i++) {
                const r = 8000000 + Math.random() * 4000000; 
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos((Math.random() * 2) - 1);
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                starVertices.push(x, y, z);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 200, sizeAttenuation: true});
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
        }

        // --- INTERAKTION OCH ANIMATION ---

        function flyAndFocus(name, requestedDist) {
            let currentScale = parseFloat(document.getElementById('sizeSlider').value) || 1000;
            let targetRadius = 1;
            let finalDist;

            let currentDist = camera.position.distanceTo(controls.target);
            cometPaths.forEach(p => p.visible = false);

            if (name === 'Oort') {
                focusedObject = null;
                finalDist = 8000000;
            } else {
                let pData = planets.find(p => p.mesh && p.mesh.userData.name === name);
                if (pData) {
                    focusedObject = pData.mesh;
                    targetRadius = pData.baseRadius * currentScale;
                } else if (name === 'Solen') {
                    focusedObject = interactiveMeshes.find(m => m.userData.name === 'Solen');
                    targetRadius = SUN_RADIUS * currentScale;
                }
                
                if (currentDist > 50000) {
                    finalDist = requestedDist;
                } else {
                    finalDist = currentDist;
                }

                finalDist = Math.max(finalDist, targetRadius * 1.5);
            }

            controls.minDistance = Math.max(0.0001, targetRadius * 1.5);

            let isLogJourney = Math.max(currentDist, finalDist) > 50000;

            flight = {
                startPos: camera.position.clone(),
                startTarget: controls.target.clone(),
                startDist: currentDist,
                endDist: finalDist,
                duration: isLogJourney ? 7.0 : 2.5,
                isLogarithmic: isLogJourney,
                isGoingToOort: (name === 'Oort'),
                time: 0
            };
        }

        function cancelFlight() {
            if (flight && flight.isGoingToOort) {
                cometPaths.forEach(p => p.visible = true);
            }
            flight = null;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const unscaledDelta = clock.getDelta();
            const delta = unscaledDelta * globalTimeScale;

            planets.forEach(p => {
                if(p.container) p.container.rotation.y += p.speed * delta * 60;
                
                // Rotera barycentret för Pluto-Charon systemet
                if(p.isPlutoSystem) {
                    p.planetGroup.rotation.y += p.barycenterSpeed * delta * 60;
                }

                if(p.mesh && !p.isInstanced) {
                    p.mesh.rotation.y += p.rotationSpeed * delta * 60;
                    
                    const isFocused = (focusedObject === p.mesh);
                    let currentMoonOpacity = 0;

                    if (p.moonMaterials && p.moonMaterials.length > 0) {
                        const targetOpacity = isFocused ? 1 : 0;
                        
                        p.moonAnimators.forEach(anim => {
                            anim.obj.rotation.y += anim.speed * delta * 60;
                        });

                        p.moonMaterials.forEach(mat => {
                            mat.opacity += (targetOpacity - mat.opacity) * 0.1;
                            mat.visible = mat.opacity > 0.01;
                            currentMoonOpacity = mat.opacity; 
                        });

                        p.moonLabels.forEach(ml => {
                            if (currentMoonOpacity > 0.05 && showLabels && isFocused) {
                                const vector = new THREE.Vector3();
                                ml.mesh.getWorldPosition(vector);
                                vector.project(camera);
                                if (vector.z < 1) {
                                    const x = (vector.x * .5 + .5) * window.innerWidth;
                                    const y = -(vector.y * .5 - .5) * window.innerHeight;
                                    ml.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                                    ml.element.style.opacity = currentMoonOpacity;
                                    ml.element.classList.remove('hidden');
                                } else {
                                    ml.element.classList.add('hidden');
                                }
                            } else {
                                ml.element.classList.add('hidden');
                                ml.element.style.opacity = 0;
                            }
                        });
                    }

                    // Hantera Charon Label om vi har den (speciell för Pluto)
                    if (p.charonLabel && showLabels) {
                        const isSystemFocused = (focusedObject === p.mesh || focusedObject === p.charonMesh);
                        if (isSystemFocused) {
                            p.charonLabel.classList.remove('hidden');
                            p.charonLabel.style.opacity = 1;
                            const vector = new THREE.Vector3();
                            p.charonMesh.getWorldPosition(vector);
                            vector.project(camera);
                            if (vector.z < 1) {
                                const x = (vector.x * .5 + .5) * window.innerWidth;
                                const y = -(vector.y * .5 - .5) * window.innerHeight;
                                p.charonLabel.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                            } else {
                                p.charonLabel.style.display = 'none';
                            }
                        } else {
                            p.charonLabel.classList.add('hidden');
                            p.charonLabel.style.opacity = 0;
                        }
                    }

                    if (p.label && showLabels) {
                        const vector = new THREE.Vector3();
                        p.mesh.getWorldPosition(vector);
                        vector.project(camera);
                        
                        if (vector.z < 1) {
                            const x = (vector.x * .5 + .5) * window.innerWidth;
                            const y = -(vector.y * .5 - .5) * window.innerHeight;
                            p.label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                            p.label.style.display = 'block';
                        } else {
                            p.label.style.display = 'none';
                        }
                    }
                }
            });

            comets.forEach(c => {
                const r = (c.a * (1 - c.e * c.e)) / (1 + c.e * Math.cos(c.theta));
                c.mesh.position.set(r * Math.cos(c.theta), 0, r * Math.sin(c.theta));
                let angularSpeed = 500000 / (r * r);
                angularSpeed = Math.min(angularSpeed, 2.0); 
                c.theta += angularSpeed * delta;
                if (c.theta > Math.PI * 2) c.theta -= Math.PI * 2;
            });

            let targetPos = new THREE.Vector3(0, 0, 0);
            if (focusedObject) {
                focusedObject.getWorldPosition(targetPos);
            }

            if (flight) {
                flight.time += unscaledDelta; 
                const t = Math.min(flight.time / flight.duration, 1.0);
                
                const targetEase = t * t * (3 - 2 * t);
                const currentTarget = flight.startTarget.clone().lerp(targetPos, targetEase);
                controls.target.copy(currentTarget);

                let currentDist;
                if (flight.isLogarithmic) {
                    const logStart = Math.log(flight.startDist);
                    const logEnd = Math.log(flight.endDist);
                    const distEase = t * t * (3 - 2 * t);
                    currentDist = Math.exp(logStart + (logEnd - logStart) * distEase);
                } else {
                    const distEase = t * t * (3 - 2 * t);
                    currentDist = flight.startDist + (flight.endDist - flight.startDist) * distEase;
                }

                let dir = flight.startPos.clone().sub(flight.startTarget).normalize();
                if (dir.lengthSq() === 0) dir.set(0, 1, 0);

                camera.position.copy(currentTarget).add(dir.multiplyScalar(currentDist));

                if (t >= 1.0) {
                    if (flight.isGoingToOort) {
                        cometPaths.forEach(p => p.visible = true); 
                    }
                    flight = null;
                }
            } else {
                const oldTarget = controls.target.clone();
                controls.target.copy(targetPos);
                
                if (focusedObject) {
                    const deltaPos = controls.target.clone().sub(oldTarget);
                    camera.position.add(deltaPos);
                }
            }

            controls.update(); 
            renderer.render(scene, camera);
        }
    </script>
