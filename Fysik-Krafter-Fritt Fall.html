<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Simulering: Fritt Fall</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 2px solid #444; background: #000; margin-top: 10px; }
        .controls { background: #333; padding: 20px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        .stats { font-family: monospace; font-size: 1.2em; margin-bottom: 10px; color: #00ff00; }
    </style>
</head>
<body>

    
    <h1>Fritt Fall Simulering</h1>

    <div class="stats">
        Tid: <span id="time">0.00</span> s | 
        Hastighet: <span id="vel">0.00</span> m/s | 
        Höjd: <span id="height">50.0</span> m
    </div>

    <div class="controls">
        <div>
            <label>Fallhöjd (meter): <input type="range" id="startHeight" min="10" max="200" value="50"> <span id="hVal">50</span>m</label>
            <label>Atmosfärens densitet: <input type="range" id="density" min="0" max="50" value="1.2"> <span id="dVal">1.2</span></label>
        </div>
        <div>
            <button onclick="resetSim()" style="padding: 10px 20px; cursor: pointer;">Släpp bollen!</button>
            <p style="font-size: 0.8em;">0 = Vakuum (Månen/Rymden)<br>1.2 = Jordens atmosfär</p>
        </div>
    </div>

    <canvas id="simCanvas" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Fysikaliska variabler
        let y = 0;             // Position i pixlar
        let velocity = 0;      // m/s
        let time = 0;          // s
        const g = 9.82;        // m/s^2
        let dt = 0.016;        // tidssteg (~60 fps)
        let isRunning = false;
        
        // Partiklar (Atmosfär)
        let particles = [];

        function createParticles(density) {
            particles = [];
            let count = density * 20; 
            for(let i=0; i<count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const density = parseFloat(document.getElementById('density').value);
            const targetHeight = parseFloat(document.getElementById('startHeight').value);
            const scale = canvas.height / targetHeight; // Pixlar per meter

            // Rita atmosfär (partiklar)
            ctx.fillStyle = "rgba(150, 200, 255, 0.5)";
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
                ctx.fill();
            });

            // Rita bollen
            ctx.fillStyle = "#ff4444";
            ctx.beginPath();
            ctx.arc(canvas.width/2, y * scale, 15, 0, Math.PI*2);
            ctx.fill();

            if (isRunning) {
                // Beräkna krafter
                // F_net = F_gravity - F_drag
                // Drag = 0.5 * rho * v^2 * Cd * A. Vi förenklar Cd och A till en konstant.
                let dragForce = 0.5 * (density * 0.1) * Math.pow(velocity, 2);
                let acceleration = g - dragForce;
                
                velocity += acceleration * dt;
                y += velocity * dt;
                time += dt;

                // Uppdatera UI
                document.getElementById('time').innerText = time.toFixed(2);
                document.getElementById('vel').innerText = velocity.toFixed(2);
                document.getElementById('height').innerText = Math.max(0, (targetHeight - y)).toFixed(1);

                // Stoppa vid marken
                if (y >= targetHeight) {
                    y = targetHeight;
                    isRunning = false;
                }
            }
            requestAnimationFrame(draw);
        }

        function resetSim() {
            y = 0;
            velocity = 0;
            time = 0;
            isRunning = true;
            createParticles(document.getElementById('density').value);
        }

        // Event listeners för reglage
        document.getElementById('density').oninput = function() {
            document.getElementById('dVal').innerText = this.value;
            createParticles(this.value);
        }
        document.getElementById('startHeight').oninput = function() {
            document.getElementById('hVal').innerText = this.value;
            resetSim();
        }

        createParticles(1.2);
        draw();
    </script>
</body>
</html>
