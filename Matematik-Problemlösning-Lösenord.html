<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lösenord – Escape Room</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #dbeafe;
    --ink: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 480px at 85% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(700px 420px at -10% 115%, var(--accent-soft), transparent 55%),
      #f1f5f9;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid #e2e8f0;
    background: rgba(255,255,255,.65);
    backdrop-filter: blur(4px);
  }
  .title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .title-wrap .lock { font-size: 1.5rem; }
  .title-wrap h1 { margin: 0; font-size: clamp(1.05rem, .9rem + .35vw, 1.35rem); line-height: 1.15; white-space: nowrap; }
  .title-wrap .hint-line { margin: 1px 0 0; font-size: clamp(.74rem, .65rem + .15vw, .9rem); color: var(--muted); white-space: nowrap; }
  @media (max-width: 760px) { .title-wrap .hint-line { display: none; } }

  .seedbox {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent-dark);
    border-radius: 999px; padding: 4px 10px 4px 12px;
    font-size: .82rem; font-weight: 700; white-space: nowrap;
  }
  .seedbox code { font-family: 'Courier New', monospace; letter-spacing: .12em; font-size: .95rem; }
  .seedbox button {
    border: none; background: rgba(255,255,255,.6); color: var(--accent-dark);
    border-radius: 999px; width: 22px; height: 22px; cursor: pointer; font-size: .85rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .seedbox button:hover { background: #fff; }

  .room-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .room-tabs a {
    text-decoration: none; font-weight: 600; font-size: .82rem;
    padding: 6px 12px; border-radius: 999px; border: 1px solid #e2e8f0;
    background: #fff; color: var(--muted); transition: .15s; white-space: nowrap;
  }
  .room-tabs a:hover { border-color: #cbd5e1; }
  .room-tabs a.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 3px 10px -3px var(--accent);
  }
  .home-link {
    text-decoration: none; color: var(--muted); background: #fff;
    border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 12px;
    font-size: .8rem; white-space: nowrap;
  }
  .home-link:hover { background: #f8fafc; }

  /* Game grid – 3x2 on wide screens, fills viewport, no page scroll */
  .game {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, minmax(150px, 330px));
    align-content: center;
    gap: clamp(10px, 1vw, 16px);
    padding: clamp(12px, 1.4vw, 22px) clamp(14px, 1.6vw, 26px);
  }
  .card {
    background: #fff; border: 1.5px solid #e2e8f0; border-radius: 16px;
    padding: clamp(11px, 1.1vw, 22px) clamp(14px, 1.3vw, 26px);
    display: flex; flex-direction: column; gap: clamp(7px, 0.8vw, 14px);
    overflow: hidden; box-shadow: 0 6px 18px -14px rgba(15,23,42,.4);
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .card.solved { border-color: #86efac; background: linear-gradient(180deg, #f0fdf4, #fff 55%); }
  .card.wrong { border-color: #fca5a5; animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .card .head { flex: 0 0 auto; display: flex; align-items: center; gap: 9px; }
  .badge {
    flex: none;
    width: clamp(24px, 1.7vw, 34px); height: clamp(24px, 1.7vw, 34px); border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-dark);
    font-weight: 700; font-size: clamp(.85rem, .6rem + .4vw, 1.15rem);
    display: flex; align-items: center; justify-content: center;
  }
  .card.solved .badge { background: #bbf7d0; color: #166534; }
  .topic { font-size: clamp(.64rem, .52rem + .22vw, .88rem); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: #94a3b8; }
  .card.solved .topic { color: #4ade80; }
  .q { flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0; font-size: clamp(1.05rem, .65rem + .95vw, 1.55rem); line-height: 1.5; }
  .q b { color: var(--ink); }
  .ans { flex: 0 0 auto; display: flex; align-items: center; gap: clamp(9px, 1vw, 14px); }
  .ans input {
    width: clamp(44px, 3.2vw, 62px); height: clamp(44px, 3.2vw, 62px);
    text-align: center; font-size: clamp(1.4rem, 1rem + 1vw, 2.1rem); font-weight: 700;
    border: 2px solid #cbd5e1; border-radius: 12px; background: #f8fafc; text-transform: uppercase;
    transition: .15s; padding: 0;
  }
  .ans input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .card.solved .ans input { border-color: #22c55e; background: #dcfce7; color: #166534; }
  .card.wrong .ans input { border-color: #ef4444; background: #fef2f2; }
  .slot-label { font-size: clamp(.78rem, .62rem + .28vw, 1rem); color: #94a3b8; }
  .card.solved .slot-label { color: #22c55e; font-weight: 700; }
  .card.solved .slot-label::after { content: " ✓"; }

  .footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 16px 12px; border-top: 1px solid #e2e8f0; background: rgba(255,255,255,.65); backdrop-filter: blur(4px);
  }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 11px;
    padding: 11px 24px; font-size: 1rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px -6px var(--accent); transition: .15s;
  }
  button.primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
  button.ghost {
    background: #fff; color: var(--muted); border: 1px solid #e2e8f0; border-radius: 11px;
    padding: 10px 14px; font-size: .88rem; cursor: pointer;
  }
  button.ghost:hover { background: #f8fafc; }
  .progress { flex: 1 1 160px; display: flex; align-items: center; gap: 8px; min-width: 140px; font-size: .82rem; color: var(--muted); }
  .progress .bar { flex: 1; height: 9px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); transition: width .35s; }
  .feedback { font-size: .85rem; font-weight: 600; flex: 0 1 auto; }
  .feedback.bad { color: #dc2626; }

  /* Win overlay */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 70; padding: 20px;
    background: rgba(15,23,42,.55); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #fff; border-radius: 20px; padding: 28px 34px; text-align: center;
    max-width: 460px; box-shadow: 0 25px 60px -20px rgba(0,0,0,.5); animation: pop .3s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .panel .big { font-size: 2.6rem; }
  .panel h2 { margin: 4px 0 6px; font-size: 1.4rem; }
  .panel p { margin: 0 0 14px; color: var(--muted); }
  .panel .code-line {
    font-family: 'Courier New', monospace; font-size: 1.3rem; font-weight: 700;
    letter-spacing: .3em; background: #f1f5f9; color: #334155; padding: 6px 14px 6px 20px; border-radius: 10px; display: inline-block; margin-bottom: 10px;
  }
  .panel .magic {
    display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent-dark);
    background: var(--accent-soft); border-radius: 12px; padding: 10px 16px; margin: 6px 0 14px; letter-spacing: .04em;
  }
  .panel .meta { font-size: .82rem; color: #94a3b8; margin-bottom: 14px; }
  .panel button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-weight: 700; cursor: pointer; }

  /* Teacher / facit view */
  .facit { flex: 1 1 auto; overflow: auto; padding: 16px; }
  .facit .box { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px 24px; box-shadow: 0 8px 24px -16px rgba(15,23,42,.4); }
  .facit h2 { margin: 0 0 4px; }
  .facit .lead { color: var(--muted); margin: 0 0 16px; }
  .facit ol { margin: 0; padding-left: 22px; }
  .facit ol li { margin-bottom: 10px; line-height: 1.4; }
  .facit .tag { font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: #94a3b8; }
  .facit .sv { font-weight: 800; color: #166534; }
  .facit .summary { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
  .facit .summary .code-line { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .25em; background: #f1f5f9; padding: 4px 12px; border-radius: 8px; }
  .facit .summary .magic { font-weight: 800; color: var(--accent-dark); }

  /* Small screens: allow normal scrolling */
  @media (max-width: 900px) {
    .game { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, minmax(150px, 300px)); }
    .q { font-size: clamp(1.05rem, .9rem + 1.2vw, 1.4rem); }
  }
  @media (max-width: 620px), (max-height: 540px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    .game { display: flex; flex-direction: column; }
    .card { min-height: 140px; }
    .q { overflow: visible; font-size: 1.08rem; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<header class="topbar">
  <div class="title-wrap">
    <span class="lock">🔐</span>
    <div>
      <h1 id="roomTitle">Lösenord</h1>
      <p class="hint-line">Lös alla sex – skriv ett tecken i varje ruta – tryck <b>Lås upp</b>.</p>
    </div>
  </div>
  <span class="seedbox" id="seedbox" title="Din unika spelkod – styr siffrorna i uppgifterna">
    🎟️ Spelkod: <code id="seedText">----</code>
    <button id="newSeedBtn" title="Slumpa en ny spelkod">🔄</button>
  </span>
  <nav class="room-tabs" id="roomTabs">
    <a href="?1" data-room="1">🧩 Åk 7</a>
    <a href="?2" data-room="2">📐 Åk 8</a>
    <a href="?3" data-room="3">🧮 Åk 9</a>
  </nav>
  <a class="home-link" href="./index.html">← Alla simuleringar</a>
</header>

<main class="game" id="game"></main>

<footer class="footer" id="footer">
  <button class="primary" id="submitBtn">🔓 Lås upp</button>
  <button class="ghost" id="resetBtn" title="Töm alla rutor">↺ Töm</button>
  <div class="progress"><span id="progressText">0 / 6</span><span class="bar"><span id="progressBar"></span></span></div>
  <span class="feedback" id="feedback"></span>
</footer>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="big">🎉</div>
    <h2>Du knäckte koden!</h2>
    <p id="winMsg"></p>
    <div class="code-line" id="winCode"></div>
    <span class="magic" id="winMagic"></span>
    <div class="meta" id="winMeta"></div>
    <button id="winClose">Stäng</button>
  </div>
</div>

<script>
/* ---------- seeded randomness ---------- */
function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = Math.random;
function rint(min, max) { return Math.floor(RNG() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(RNG() * arr.length)]; }
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function letterAt(n) { return ALPHA[n - 1]; }

/* ---------- magic word ---------- */
const MAGIC_PRE = ["GYLLENE","SKUGG","STJÄRN","DRAK","FROST","STORM","MÅN","SOL","KRISTALL","JÄRN","SILVER","NORD","ELD","NATT","DAGG","SKY","HAV","BERG","ÅSK","DIMM","GLÖD","RIM","GNIST","FLAMM","VIND","REGN","SNÖ","IS","GULD","RUN"];
const MAGIC_SUF = ["DRAKEN","KOMETEN","PORTALEN","NYCKELN","KRONAN","ORAKLET","FLAMMAN","STORMEN","KÄLLAN","GÅTAN","SKÖLDEN","FYREN","KOMPASSEN","LABYRINTEN","FALKEN","VARGEN","RUNAN","KAMMAREN","VALVET","TORNET","BRON","SPEGELN","GRINDEN","STIGEN","KLINGAN","BÅGEN","STJÄRNAN","BÄGAREN","KRISTALLEN","GRYNINGEN"];
function magicWordFrom(roomId, code) {
  const h = hashStr('magic|' + roomId + '|' + code);
  return MAGIC_PRE[h % MAGIC_PRE.length] + MAGIC_SUF[Math.floor(h / MAGIC_PRE.length) % MAGIC_SUF.length];
}

/* ---------- rooms ---------- */
const ROOM_META = {
  1: { label: "Åk 7", title: "🧩 Trollkarlens Lösenord (Åk 7)", accent: "#2563eb", dark: "#1d4ed8", soft: "#dbeafe",
       win: 'Bra jobbat! Säg det magiska ordet till din lärare.' },
  2: { label: "Åk 8", title: "📐 Geometrins Valv (Åk 8)", accent: "#0d9488", dark: "#0f766e", soft: "#ccfbf1",
       win: 'Snyggt räknat! Säg det magiska ordet till din lärare.' },
  3: { label: "Åk 9", title: "🧮 Algebraburen (Åk 9)", accent: "#7c3aed", dark: "#6d28d9", soft: "#ede9fe",
       win: 'Imponerande! Säg det magiska ordet till din lärare.' }
};

function buildRoom1() {
  const cl = [];
  { const a = pick([2,3,4]), x = rint(2,8), b = pick([1,3,5,7]);
    cl.push({ topic:'Ekvationer', q:`Lös ekvationen <b>${a}x + ${b} = ${a*x+b}</b>. Vad är <b>x</b>?`, a:String(x) }); }
  { const p = rint(3,12);
    cl.push({ topic:'Alfabetet', q:`Vilken bokstav har <b>plats ${p}</b> i alfabetet?`, a:letterAt(p) }); }
  { const w = rint(3,6), h = rint(4,9), A = w*h;
    cl.push({ topic:'Geometri', q:`En rektangel är <b>${w} cm</b> bred och <b>${h} cm</b> hög. Hur stor är arean (cm²)? Skriv <b>tiotalssiffran</b>.`, a:String(Math.floor(A/10)%10) }); }
  { const per = pick([25,50,100,200]), d = rint(3,9);
    cl.push({ topic:'Vardagsmatte', q:`Du sparar <b>${per} kr</b> varje dag. Hur många dagar tar det att spara ihop <b>${per*d} kr</b>?`, a:String(d) }); }
  { const m = rint(2,6);
    cl.push({ topic:'Medelvärde', q:`Tre tärningskast har tillsammans summan <b>${3*m}</b>. Vad är <b>medelvärdet</b> av kasten?`, a:String(m) }); }
  { const a = pick([2,3]), x = rint(2,9), b = pick([1,2]), inner = x+b;
    cl.push({ topic:'Ekvationer', q:`I ekvationen <b>${a}(x + ${b}) = ${a*inner}</b>: lös ut x och skriv <b>bokstaven på den platsen</b> i alfabetet.`, a:letterAt(x) }); }
  return cl;
}

function buildRoom2() {
  const cl = [];
  { const combos = [[20,10],[30,10],[40,10],[50,10],[60,10],[70,10],[80,10],[90,10],[20,15],[40,15],[60,15],[20,25],[10,30],[20,30],[20,35],[10,40],[20,40],[30,20],[40,20],[10,50],[10,70],[10,90],[10,60],[10,80],[10,20]];
    const c = pick(combos);
    cl.push({ topic:'Procent', q:`I en klass på <b>${c[0]} elever</b> är <b>${c[1]} %</b> glasögonbärare. Hur många elever är det?`, a:String(c[0]*c[1]/100) }); }
  { const r = rint(2,5), A = 3*r*r;
    cl.push({ topic:'Cirklar', q:`En cirkel har radien <b>${r} cm</b>. Beräkna arean med <b>π ≈ 3</b>. Skriv <b>tiotalssiffran</b> i svaret.`, a:String(Math.floor(A/10)%10) }); }
  { const variants = [['liter','deciliter'],['meter','decimeter'],['decimeter','centimeter'],['centimeter','millimeter']];
    const v = pick(variants), a = rint(3,9), b = rint(1,9), res = 10*a - b;
    cl.push({ topic:'Enhetsomvandling', q:`Hur många <b>${v[1]}</b> är <b>${a} ${v[0]}</b> minus <b>${b} ${v[1]}</b>? Skriv <b>tiotalssiffran</b> i svaret.`, a:String(Math.floor(res/10)%10) }); }
  { const s = rint(2,9), V = s*s*s;
    cl.push({ topic:'Volym', q:`En kubformad behållare har sidan <b>${s} dm</b>. Hur många <b>liter</b> rymmer den? (1&nbsp;dm³&nbsp;=&nbsp;1&nbsp;liter.) Skriv <b>entalssiffran</b>.`, a:String(V%10) }); }
  { const k = rint(2,9), a = rint(2,4);
    cl.push({ topic:'Koordinatsystem', q:`En rät linje går genom <b>(0, 0)</b> och <b>(${a}, ${a*k})</b>. Vilket <b>y</b>-värde har linjen när <b>x = 1</b>?`, a:String(k) }); }
  { const opts = [['antalet hörn i en kub',8],['antalet kanter i en kub',12],['antalet begränsningsytor i ett rätblock',6],['antalet hörn i en femhörning',5],['antalet hörn i en sexhörning',6],['antalet hörn i en kvadrat',4],['antalet hörn i en triangel',3]];
    const o = pick(opts);
    cl.push({ topic:'Rymdgeometri', q:`Bestäm <b>${o[0]}</b>. Skriv <b>bokstaven på den platsen</b> i alfabetet.`, a:letterAt(o[1]) }); }
  return cl;
}

function buildRoom3() {
  const cl = [];
  { const triples = [[3,4,5],[5,12,13],[8,15,17],[20,21,29],[9,40,41],[12,16,20],[16,30,34],[10,24,26]];
    const t = pick(triples);
    cl.push({ topic:'Pythagoras sats', q:`En rätvinklig triangel har kateterna <b>${t[0]} cm</b> och <b>${t[1]} cm</b>. Skriv <b>entalssiffran</b> i hypotenusans längd.`, a:String(t[2]%10) }); }
  { const k = rint(2,9), s = rint(2,5);
    cl.push({ topic:'Likformighet', q:`Två trianglar är likformiga. En sida i den lilla är <b>${s} cm</b>; motsvarande sida i den stora är <b>${s*k} cm</b>. Vad är <b>skalfaktorn</b>?`, a:String(k) }); }
  { const k = pick([2,3,4]), m = pick([-7,-5,-3,-1,1,3,5,7]), x = rint(2,9), y = k*x+m;
    const msign = m < 0 ? '− ' + (-m) : '+ ' + m;
    cl.push({ topic:'Räta linjens ekvation', q:`Linjen <b>y = ${k}x ${msign}</b>. Vilket <b>x</b>-värde ger <b>y = ${String(y).replace('-','−')}</b>?`, a:String(x) }); }
  { const dir = pick(['höjs','sänks']), p = pick([10,20,25,30,40,50,60,70,75,80,90]);
    const tiondel = dir === 'höjs' ? Math.floor((100+p)/10) % 10 : Math.floor((100-p)/10) % 10;
    cl.push({ topic:'Förändringsfaktor', q:`Ett pris <b>${dir}</b> med <b>${p} %</b>. Skriv siffran på <b>tiondelsplatsen</b> i förändringsfaktorn.`, a:String(tiondel) }); }
  { const g = rint(2,9), c = rint(2,9);
    cl.push({ topic:'Faktorisering', q:`Uttrycket <b>${g}x + ${g*c}</b> kan skrivas som <b>${g}(x + a)</b>. Vad är <b>a</b>?`, a:String(c) }); }
  { const n = rint(1,9), primes = [2,3,5,7,11,13,17,19,23];
    const ord = ['första','andra','tredje','fjärde','femte','sjätte','sjunde','åttonde','nionde'][n-1];
    cl.push({ topic:'Primtal', q:`Ta det <b>${ord}</b> primtalet. Skriv <b>bokstaven på den platsen</b> i alfabetet.`, a:letterAt(primes[n-1]) }); }
  return cl;
}
const BUILDERS = { 1: buildRoom1, 2: buildRoom2, 3: buildRoom3 };

/* ---------- read url: ?N  &s=SEED  &facit ---------- */
function pickRoomId() {
  const raw = window.location.search.replace(/^\?/, '').split('&')[0].trim();
  let id = parseInt(raw, 10);
  if (![1,2,3].includes(id)) id = parseInt(new URLSearchParams(window.location.search).get('room'), 10);
  return [1,2,3].includes(id) ? id : 1;
}
function randomSeed() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

const roomId = pickRoomId();
const params = new URLSearchParams(window.location.search);
let seed = (params.get('s') || params.get('seed') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
const isFacit = params.has('facit');
if (!seed) {
  seed = randomSeed();
  // keep the seed in the URL so a reload is stable and the link is shareable
  const newUrl = window.location.pathname + '?' + roomId + '&s=' + seed + (isFacit ? '&facit' : '') + window.location.hash;
  history.replaceState(null, '', newUrl);
}

const meta = ROOM_META[roomId];
document.documentElement.style.setProperty('--accent', meta.accent);
document.documentElement.style.setProperty('--accent-dark', meta.dark);
document.documentElement.style.setProperty('--accent-soft', meta.soft);
document.title = meta.title.replace(/^[^ ]+ /, '') + ' – Escape Room';
document.getElementById('roomTitle').textContent = meta.title;
document.getElementById('seedText').textContent = seed;

// tabs (carry the seed so a teacher-assigned code follows the student between rooms)
document.querySelectorAll('#roomTabs a').forEach(a => {
  const r = parseInt(a.dataset.room, 10);
  a.href = '?' + r + '&s=' + seed + (isFacit ? '&facit' : '');
  if (r === roomId) a.classList.add('active');
});
document.getElementById('newSeedBtn').addEventListener('click', () => {
  window.location.href = window.location.pathname + '?' + roomId + '&s=' + randomSeed() + (isFacit ? '&facit' : '');
});

// build the questions with the seeded RNG
RNG = mulberry32(hashStr(roomId + '|' + seed));
const CLUES = BUILDERS[roomId]();
const ANSWERS = CLUES.map(c => c.a.toUpperCase());
const CODE = ANSWERS.join('');
const MAGIC = magicWordFrom(roomId, CODE);

/* ---------- facit (teacher) view ---------- */
if (isFacit) {
  document.getElementById('footer').style.display = 'none';
  const game = document.getElementById('game');
  game.className = 'facit';
  game.innerHTML = `
    <div class="box">
      <h2>Lärarvy – ${meta.label}</h2>
      <p class="lead">Spelkod <b>${seed}</b>. Eleven med denna spelkod ser exakt dessa uppgifter och svar.</p>
      <ol>${CLUES.map(c => `<li><span class="tag">${c.topic}</span><br>${c.q}<br>Svar: <span class="sv">${c.a.toUpperCase()}</span></li>`).join('')}</ol>
      <div class="summary">
        Kod att skriva in: <span class="code-line">${ANSWERS.join(' ')}</span><br><br>
        🔮 Magiskt ord eleven ska säga: <span class="magic">${MAGIC}</span>
      </div>
    </div>`;
} else {
  /* ---------- play view ---------- */
  const game = document.getElementById('game');
  CLUES.forEach((clue, i) => {
    const n = i + 1;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="head"><div class="badge">${n}</div><span class="topic">${clue.topic}</span></div>
      <p class="q">${clue.q}</p>
      <div class="ans"><input type="text" maxlength="1" autocomplete="off" id="char${n}" aria-label="Tecken ${n}"><span class="slot-label">tecken ${n}</span></div>`;
    game.appendChild(card);
  });

  const inputs = CLUES.map((_, i) => document.getElementById('char' + (i + 1)));
  const feedbackEl = document.getElementById('feedback');
  const progressText = document.getElementById('progressText');
  const progressBar = document.getElementById('progressBar');

  function sanitize(v) { return v.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 1); }
  function correctAt(i) { return inputs[i].value.toUpperCase() === ANSWERS[i]; }
  function refresh(mark) {
    let solved = 0;
    inputs.forEach((inp, i) => {
      const card = inp.closest('.card');
      const ok = correctAt(i);
      if (ok) solved++;
      if (mark) { card.classList.toggle('solved', ok); if (ok) card.classList.remove('wrong'); }
    });
    progressText.textContent = solved + ' / ' + inputs.length;
    progressBar.style.width = (solved / inputs.length * 100) + '%';
    return solved;
  }

  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
      inp.value = sanitize(inp.value);
      inp.closest('.card').classList.remove('wrong');
      if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      refresh(false);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && idx > 0) { inputs[idx - 1].focus(); }
      else if (e.key === 'ArrowLeft' && idx > 0) inputs[idx - 1].focus();
      else if (e.key === 'ArrowRight' && idx < inputs.length - 1) inputs[idx + 1].focus();
      else if (e.key === 'Enter') validate();
    });
  });

  function validate() {
    let all = true;
    inputs.forEach((inp, i) => {
      const card = inp.closest('.card');
      if (correctAt(i)) { card.classList.add('solved'); card.classList.remove('wrong'); }
      else { card.classList.remove('solved'); if (inp.value) card.classList.add('wrong'); all = false; }
    });
    const solved = refresh(false);
    if (all) {
      feedbackEl.textContent = '';
      win();
    } else {
      feedbackEl.className = 'feedback bad';
      feedbackEl.textContent = solved === 0
        ? 'Inget rätt ännu.'
        : solved + ' av ' + inputs.length + ' rätt – de röda stämmer inte.';
    }
  }

  function win() {
    document.getElementById('winMsg').textContent = meta.win;
    document.getElementById('winCode').textContent = ANSWERS.join(' ');
    document.getElementById('winMagic').textContent = '🔮 ' + MAGIC;
    document.getElementById('winMeta').textContent = 'Spelkod ' + seed + ' · ' + meta.label;
    document.getElementById('overlay').classList.add('show');
    confetti();
  }

  document.getElementById('submitBtn').addEventListener('click', validate);
  document.getElementById('resetBtn').addEventListener('click', () => {
    inputs.forEach(inp => { inp.value = ''; const c = inp.closest('.card'); c.classList.remove('solved', 'wrong'); });
    feedbackEl.textContent = '';
    refresh(false);
    inputs[0].focus();
  });
  document.getElementById('winClose').addEventListener('click', () => document.getElementById('overlay').classList.remove('show'));
  document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') e.currentTarget.classList.remove('show'); });
  refresh(false);
  if (inputs[0]) inputs[0].focus();
}

/* ---------- confetti ---------- */
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
function sizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
sizeCanvas();
window.addEventListener('resize', sizeCanvas);
function confetti() {
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
  const ps = [];
  const cx = canvas.width / 2, cy = canvas.height / 3;
  for (let i = 0; i < 170; i++) {
    const ang = Math.random() * Math.PI * 2, sp = Math.random() * 9 + 3;
    ps.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4, r: Math.random() * 6 + 2, c: colors[(Math.random() * colors.length) | 0], life: 1 });
  }
  let running = true;
  (function frame() {
    if (!running) return;
    requestAnimationFrame(frame);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = 0;
    for (const p of ps) {
      if (p.life <= 0) continue;
      alive++;
      p.vy += 0.18; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.life -= 0.012;
      ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!alive) { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  })();
}
</script>
</body>
