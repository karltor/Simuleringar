<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <style>
body, html {
  height: 100%;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.centered-text {
  position: absolute;
  top: 0;
  width: 100%;
  text-align: center;
  font-size: 24px;
  margin-top: 20px; /* Adjust top margin to your liking */
}

</style>
</head>

<body>
  <div class="centered-text">Lista ut vad som är fel på tärningen</div>

  <script>
/* slightly rounded hollow black square (white in the middle) in the middle of the screen, 200 px in width and height. */
var square = document.createElement('div');
square.style.width = '200px';
square.style.height = '200px';
square.style.backgroundColor = 'black';
square.style.borderRadius = '10px';
square.style.position = 'absolute';
square.style.top = '50%';
square.style.left = '50%';
square.style.marginTop = '-100px';
square.style.marginLeft = '-100px';
square.style.backgroundColor = 'white';
square.style.border = '10px solid black';
document.body.appendChild(square);
/* random number 1-6 inside square with a arial font 100 px. */
var randomNumber = document.createElement('div');
randomNumber.style.fontFamily = 'arial';
randomNumber.style.fontSize = '100px';
randomNumber.style.position = 'absolute';
randomNumber.style.top = '50%';
randomNumber.style.left = '50%';
randomNumber.style.marginTop = '-50px';
randomNumber.style.marginLeft = '-50px';
randomNumber.innerHTML = Math.floor(Math.random() * 6) + 1;
randomNumber.style.marginTop = '-50px';
randomNumber.style.marginLeft = '-30px';
randomNumber.style.userSelect = 'none';
square.appendChild(randomNumber);

/* If square is clicked, change number according to this probability: 1/7 for 1,2,4,5,6 and 2/7 for 3. Rotate square on y-axis*/
var rotate = function() {
  var angle = 0;
  var rotateInterval = setInterval(function() {
    angle += 5;
    square.style.transform = 'rotateY(' + angle + 'deg)';
    if (angle >= 360) {
      clearInterval(rotateInterval);
    }
  }, 7);
};
square.addEventListener('click', function() {

  rotate()
  var random = Math.random();
  if (random < 1/7) {
    randomNumber.innerHTML = 3;
  } else {
    randomNumber.innerHTML = Math.floor(Math.random() * 6) + 1;
  }
});

</script>
</body>

</html>
