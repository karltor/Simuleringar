<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stjärnans Födelse - Interaktiv Simulering</title>
    
    <!-- Tailwind CSS för styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React och ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel för att kompilera JSX direkt i webbläsaren -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Här laddas vår React-app in -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Färgpaletter för ljus bakgrund
        const COLORS = {
          cold: '#3b82f6',   // Kall gas (Blå)
          warm: '#ea580c',   // Varm gas (Orange)
          hot: '#ef4444',    // Mycket varm (Röd)
          helium: '#9333ea', // Helium (Mörklila)
          photon: '#fbbf24'  // Foton/Ljus (Gul)
        };

        const STAGES = [
          {
            title: "1. Gravitation",
            description: "Gasmolnet är enormt. Gravitationen börjar dra partiklarna inåt mot centrum. När de faller inåt ökar deras hastighet (lägesenergi blir till värme).",
            physics: { radius: 450, maxSpeed: 1.5, opacity: 0, fusion: false }
          },
          {
            title: "2. Strålning flyr",
            description: "Gasen är fortfarande gles. När partiklar krockar avger de ljus (strålning). Eftersom gasen är gles flyger ljuset rakt ut och kyler molnet.",
            physics: { radius: 250, maxSpeed: 3, opacity: 0.1, fusion: false }
          },
          {
            title: "3. Ökad opacitet",
            description: "Molnet har krympt och blivit extremt tätt! Nu krockar ljuset med gasen direkt och stängs inne. Temperaturen i kärnan skenar.",
            physics: { radius: 120, maxSpeed: 6, opacity: 0.9, fusion: false }
          },
          {
            title: "4. Tändning av Fusion",
            description: "Det enorma trycket tvingar ihop vätekärnorna. De slås ihop (mergas) till Helium. Denna process frigör en extrem chockvåg av energi!",
            physics: { radius: 70, maxSpeed: 10, opacity: 1.0, fusion: true }
          }
        ];

        function StarFormationSimulation() {
          const [currentStage, setCurrentStage] = useState(0);
          const canvasRef = useRef(null);
          const stageRef = useRef(currentStage);

          useEffect(() => {
            stageRef.current = currentStage;
          }, [currentStage]);

          const nextStage = () => setCurrentStage(s => Math.min(s + 1, STAGES.length - 1));
          const prevStage = () => setCurrentStage(s => Math.max(s - 1, 0));

          useEffect(() => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            let animationFrameId;

            const resizeCanvas = () => {
              canvas.width = canvas.parentElement.clientWidth;
              canvas.height = canvas.parentElement.clientHeight;
            };
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const particles = [];
            const photons = [];
            const shockwaves = [];
            const NUM_PARTICLES = 450; // Dubblat antal för tydligare gasmoln

            // Initiera partiklar
            for (let i = 0; i < NUM_PARTICLES; i++) {
              const angle = Math.random() * Math.PI * 2;
              const r = Math.sqrt(Math.random()) * 1200; // Startar massivt utspritt (långt utanför skärmen)
              particles.push({
                id: i,
                x: canvas.width / 2 + Math.cos(angle) * r,
                y: canvas.height / 2 + Math.sin(angle) * r,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                type: 'H',
                heLife: 0 // Används för att låta Helium fadéa ut och bli väte igen
              });
            }

            let currentRadius = STAGES[0].physics.radius;
            let globalOpacity = 0;

            const draw = () => {
              const { width, height } = canvas;
              const centerX = width / 2;
              const centerY = height / 2;
              
              const targetPhysics = STAGES[stageRef.current].physics;

              // Animerad övergång av radie och opacitet
              currentRadius += (targetPhysics.radius - currentRadius) * 0.05;
              globalOpacity += (targetPhysics.opacity - globalOpacity) * 0.05;

              ctx.fillStyle = '#f8fafc'; // Ljus bakgrund
              ctx.fillRect(0, 0, width, height);

              // Rita stjärnans gräns/täthet (Visar hur opaciteten stänger inne kärnan)
              if (globalOpacity > 0.1) {
                const bgGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, currentRadius);
                bgGradient.addColorStop(0, `rgba(254, 226, 226, ${globalOpacity * 0.8})`); // Röd/varm kärna
                bgGradient.addColorStop(0.8, `rgba(252, 165, 165, ${globalOpacity * 0.4})`);
                bgGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = bgGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
                ctx.fill();
              }

              // --- Uppdatera & Rita Gaspartiklar ---
              particles.forEach((p, index) => {
                // Gravitationsdrag mot mitten
                const dx = centerX - p.x;
                const dy = centerY - p.y;
                const distToCenter = Math.sqrt(dx * dx + dy * dy);
                
                // Starkare drag ju längre ut de är
                p.vx += (dx / distToCenter) * 0.05;
                p.vy += (dy / distToCenter) * 0.05;

                // Värme (slumpmässig rörelse)
                p.vx += (Math.random() - 0.5) * (targetPhysics.maxSpeed * 0.2);
                p.vy += (Math.random() - 0.5) * (targetPhysics.maxSpeed * 0.2);

                // Hastighetsbegränsning
                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (speed > targetPhysics.maxSpeed) {
                    p.vx = (p.vx / speed) * targetPhysics.maxSpeed;
                    p.vy = (p.vy / speed) * targetPhysics.maxSpeed;
                }

                // Tidsrese-fix och Helium-fade (Återvinner Väte så det aldrig tar slut)
                if (!targetPhysics.fusion && p.type === 'He') {
                    p.type = 'H';
                } else if (p.type === 'He') {
                    p.heLife -= 0.005; // Fadear ut långsamt
                    if (p.heLife <= 0) p.type = 'H'; // Blir väte igen när energin falnat
                }

                // Ny position
                let nextX = p.x + p.vx;
                let nextY = p.y + p.vy;
                const nextDist = Math.sqrt(Math.pow(centerX - nextX, 2) + Math.pow(centerY - nextY, 2));

                // ABSOLUT GRÄNS: Partiklar kan inte lämna den aktuella radien.
                // Detta förhindrar "explosioner" och garanterar att stjärnan krymper.
                if (nextDist > currentRadius) {
                    const angle = Math.atan2(nextY - centerY, nextX - centerX);
                    p.x = centerX + Math.cos(angle) * currentRadius * 0.98;
                    p.y = centerY + Math.sin(angle) * currentRadius * 0.98;
                    p.vx *= -0.5; // Studsa inåt
                    p.vy *= -0.5;
                } else {
                    p.x = nextX;
                    p.y = nextY;
                }

                // --- Tydlig Visualisering av Fusion (Steg 4) ---
                if (targetPhysics.fusion && p.type === 'H' && distToCenter < currentRadius * 0.6) {
                    for (let j = index + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        if (p2.type === 'H') {
                            const ddx = p2.x - p.x;
                            const ddy = p2.y - p.y;
                            if (ddx*ddx + ddy*ddy < 40) { // Krock!
                                // MERGE: Båda blir Helium tillfälligt
                                p.type = 'He';
                                p.heLife = 1.0 + Math.random() * 0.5; // Får individuell livslängd
                                p2.type = 'He';
                                p2.heLife = 1.0 + Math.random() * 0.5;
                                
                                // Sjuhelvetes massa energi! Skapa en massiv chockvåg
                                shockwaves.push({
                                    x: p.x,
                                    y: p.y,
                                    radius: 5,
                                    maxRadius: currentRadius * 2,
                                    alpha: 1.0
                                });

                                // Skjut ut extremt ljus/energistrålar (RNG distans)
                                for(let k=0; k<2; k++) {
                                    const pAngle = Math.random() * Math.PI * 2;
                                    photons.push({
                                        x: p.x, y: p.y,
                                        vx: Math.cos(pAngle) * 16,
                                        vy: Math.sin(pAngle) * 16,
                                        maxDist: currentRadius + 200 + Math.random() * 600, // Åker långt ut!
                                        isFusion: true
                                    });
                                }
                                break;
                            }
                        }
                    }
                }

                // Skapa fotoner/ljus sporadiskt (mest i steg 2 och 3)
                if (stageRef.current >= 1 && p.type === 'H' && Math.random() < 0.003 * targetPhysics.maxSpeed) {
                    const photonAngle = Math.random() * Math.PI * 2;
                    photons.push({
                        x: p.x,
                        y: p.y,
                        vx: Math.cos(photonAngle) * 8,
                        vy: Math.sin(photonAngle) * 8,
                        maxDist: currentRadius * (1.5 + Math.random() * 2), // Kortare räckvidd
                        isFusion: false
                    });
                }

                // Välj färg baserat på temperatur/hastighet
                let color = COLORS.cold;
                if (p.type === 'He') color = COLORS.helium;
                else if (speed > 4) color = COLORS.hot;
                else if (speed > 2) color = COLORS.warm;

                // Rita partikeln
                ctx.beginPath();
                // Helium är betydligt större för att visa att de slott sig samman
                ctx.arc(p.x, p.y, p.type === 'He' ? 5 : 2.5, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.globalAlpha = p.type === 'He' ? Math.min(1, p.heLife + 0.2) : 1.0; // Tonar ut Helium
                ctx.fill();
                ctx.globalAlpha = 1.0; // Återställ
                
                // Glöd på helium
                if (p.type === 'He') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(147, 51, 234, ${p.heLife * 0.4})`;
                    ctx.fill();
                }
              });

              // --- Uppdatera & Rita Strålning (Fotoner) ---
              for (let i = photons.length - 1; i >= 0; i--) {
                const ph = photons[i];
                ph.x += ph.vx;
                ph.y += ph.vy;

                const phDist = Math.sqrt(Math.pow(centerX - ph.x, 2) + Math.pow(centerY - ph.y, 2));

                // OPACITET I PRAKTIKEN:
                // I steg 3 har molnet hög opacitet. Om normal foton (ej fusion) når kanten studsar den!
                if (globalOpacity > 0.5 && phDist > currentRadius * 0.9 && phDist < currentRadius * 1.2 && !ph.isFusion) {
                    // Studsa inåt igen (stängd inne)
                    const angleToCenter = Math.atan2(centerY - ph.y, centerX - ph.x);
                    ph.vx = Math.cos(angleToCenter) * 8;
                    ph.vy = Math.sin(angleToCenter) * 8;
                    ph.maxDist *= 0.8; // Förlorar energi vid studs
                }

                // Fotonen försvinner när den når sin maxdistans eller åker utanför skärmen
                if (phDist > ph.maxDist || ph.x < 0 || ph.x > width || ph.y < 0 || ph.y > height) {
                  photons.splice(i, 1);
                } else {
                  // RNG Fade: Lägre opacity ju närmare sin maxdistans den kommer
                  let opacity = 1 - (phDist / ph.maxDist);
                  if (opacity < 0) opacity = 0;

                  ctx.beginPath();
                  ctx.moveTo(ph.x, ph.y);
                  ctx.lineTo(ph.x - ph.vx * 1.5, ph.y - ph.vy * 1.5);
                  ctx.strokeStyle = `rgba(251, 191, 36, ${opacity})`; // Fotonfärg tonas ut
                  ctx.lineWidth = ph.isFusion ? 4 : 2; // Tjockare strålar från fusion
                  ctx.stroke();
                }
              }

              // --- Rita Fusions-Chockvågor (Steg 4) ---
              for (let i = shockwaves.length - 1; i >= 0; i--) {
                  const wave = shockwaves[i];
                  wave.radius += 4; // Vågen expanderar snabbt
                  wave.alpha -= 0.03; // Tonar ut
                  
                  if (wave.alpha <= 0) {
                      shockwaves.splice(i, 1);
                  } else {
                      ctx.beginPath();
                      ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
                      ctx.strokeStyle = `rgba(250, 204, 21, ${wave.alpha})`; // Lysande gul
                      ctx.lineWidth = 4 * wave.alpha;
                      ctx.stroke();
                      
                      // Ljus fyllning för blixten i mitten
                      if (wave.radius < 20) {
                          ctx.fillStyle = `rgba(255, 255, 255, ${wave.alpha})`;
                          ctx.fill();
                      }
                  }
              }

              animationFrameId = requestAnimationFrame(draw);
            };

            draw();

            return () => {
              cancelAnimationFrame(animationFrameId);
              window.removeEventListener('resize', resizeCanvas);
            };
          }, []);

          return (
            <div className="flex flex-col md:flex-row w-full h-screen bg-slate-50 text-slate-900 font-sans overflow-hidden">
              
              {/* Canvas Area */}
              <div className="relative flex-1 w-full h-1/2 md:h-full bg-white border-b md:border-b-0 md:border-r border-slate-200">
                <canvas 
                  ref={canvasRef} 
                  className="absolute inset-0 w-full h-full block"
                />
                
                {/* Enkel Legend */}
                <div className="absolute top-4 right-4 bg-white/90 p-4 rounded-xl border border-slate-200 backdrop-blur-md text-sm shadow-lg font-medium">
                  <div className="flex items-center gap-3 mb-2">
                      <span className="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 
                      <span>Vätekärna (Låg energi)</span>
                  </div>
                  <div className="flex items-center gap-3 mb-2">
                      <span className="w-3 h-3 rounded-full bg-red-500 inline-block"></span> 
                      <span>Vätekärna (Hög energi)</span>
                  </div>
                  <div className="flex items-center gap-3 mb-2">
                      <span className="w-4 h-4 rounded-full bg-purple-600 inline-block shadow-[0_0_8px_rgba(147,51,234,0.5)]"></span> 
                      <span className="font-bold">Helium (Fusion)</span>
                  </div>
                  <div className="flex items-center gap-3">
                      <span className="w-4 h-1 bg-amber-400 inline-block"></span> 
                      <span>Ljus / Energistrålning</span>
                  </div>
                </div>
              </div>

              {/* Info Panel */}
              <div className="w-full md:w-[380px] bg-white flex flex-col z-10 shadow-2xl">
                <div className="p-8 flex-1 flex flex-col justify-center">
                  <h1 className="text-3xl font-black mb-8 text-slate-900 tracking-tight">
                    Stjärnans Födelse
                  </h1>

                  <div className="bg-slate-50 rounded-2xl p-6 border border-slate-200 min-h-[200px] shadow-inner">
                     <h2 className="text-xl font-bold text-slate-900 mb-4">
                        {STAGES[currentStage].title}
                     </h2>
                     <p className="text-slate-600 leading-relaxed text-base font-medium">
                       {STAGES[currentStage].description}
                     </p>
                  </div>
                  
                  {/* Progress */}
                  <div className="flex justify-between items-center mt-12 px-2">
                     {STAGES.map((_, index) => (
                       <div key={index} className="flex flex-col items-center flex-1">
                         <div className={`w-4 h-4 rounded-full transition-all duration-500 ${
                           index === currentStage ? 'bg-blue-600 scale-125 shadow-lg' : 
                           index < currentStage ? 'bg-blue-300' : 'bg-slate-200'
                         }`} />
                         <div className={`h-1.5 w-full mt-4 rounded transition-all duration-500 ${
                           index < STAGES.length - 1 ? 
                             (index < currentStage ? 'bg-blue-300' : 'bg-slate-100') 
                             : 'hidden'
                         }`} />
                       </div>
                     ))}
                  </div>
                </div>

                {/* Kontroller */}
                <div className="p-6 border-t border-slate-100 flex justify-between items-center bg-white shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
                  <button 
                    onClick={prevStage} 
                    disabled={currentStage === 0}
                    className="px-4 py-3 rounded-xl text-slate-500 font-bold hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center gap-2"
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Bakåt
                  </button>
                  
                  <button 
                    onClick={nextStage} 
                    disabled={currentStage === STAGES.length - 1}
                    className="px-6 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-lg active:scale-95 flex items-center gap-2"
                  >
                    Nästa steg
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // Renderar appen till root-elementet
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StarFormationSimulation />);
    </script>
</body>
</html>
