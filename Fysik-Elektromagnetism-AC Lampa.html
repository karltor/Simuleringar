<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Simulerad Lampa med Justerad Frekvens</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .lamp-container {
            position: relative;
            width: 200px;
            height: 400px;
            margin: 50px auto;
        }
        .lamp {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 150px;
            background: radial-gradient(circle at 50% 20%, #ffffaa, #ffaa00 60%, #000000 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 50px rgba(255, 255, 100, 0.5);
        }
        .speech-bubble {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: #fff;
            color: #000;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.4;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fff transparent;
        }
        .slider-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
        }
        input[type=range] {
            width: 100%;
        }
        .frequency-label {
            color: #fff;
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="lamp-container">
        <div class="speech-bubble">
            Ljusstyrkan ändras enligt en sinuskurva med valbar frekvens.<br>
            Det svenska elnätet har en frekvens på 50 Hz.
        </div>
        <div class="lamp" id="lamp"></div>
    </div>
    <div class="slider-container">
        <input type="range" id="frequencySlider" min="0.1" max="50" step="0.1" value="1">
        <div class="frequency-label">Frekvens: <span id="frequencyValue">1</span> Hz</div>
    </div>

    <script>
        const lamp = document.getElementById('lamp');
        const frequencySlider = document.getElementById('frequencySlider');
        const frequencyValue = document.getElementById('frequencyValue');

        let frequency = parseFloat(frequencySlider.value);
        frequencyValue.textContent = frequency;

        frequencySlider.addEventListener('input', function() {
            frequency = parseFloat(this.value);
            frequencyValue.textContent = frequency.toFixed(1);
        });

        let previousTimestamp = null;
        let brightness = 0.5; // Startvärde för ljusstyrka
        const tau = 0.02; // Tidskonstant för termisk tröghet (justerbar)

        function animateLamp(timestamp) {
            if (!previousTimestamp) previousTimestamp = timestamp;
            const deltaTime = (timestamp - previousTimestamp) / 1000; // Konvertera till sekunder
            previousTimestamp = timestamp;

            const omega = 2 * Math.PI * frequency;
            const targetBrightness = (Math.sin(omega * timestamp / 1000) + 1) / 2;

            // Uppdatera ljusstyrka med hänsyn till termisk tröghet
            const alpha = deltaTime / (tau + deltaTime);
            brightness = brightness + alpha * (targetBrightness - brightness);

            // Justera ljusstyrkan baserat på frekvensen
            if (frequency >= 40) {
                brightness = 1;
            } else if (frequency > 30 && frequency < 40) {
                const factor = (frequency - 30) / 10; // Varierar från 0 till 1
                brightness = brightness * (1 - factor) + 1 * factor;
            }

            lamp.style.opacity = brightness;

            requestAnimationFrame(animateLamp);
        }

        requestAnimationFrame(animateLamp);
    </script>

</body>
</html>
