<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>

  <script>
/* create a horizontal line, 10% of screen width, placed in the centre of the screen. */
var line = document.createElement('div');
line.style.width = '10%';
line.style.height = '1px';
line.style.backgroundColor = 'black';
line.style.position = 'absolute';
line.style.top = '50%';
line.style.left = '45%';
document.body.appendChild(line);
/* centered on the page, 45% margin from top, place a random integer. 30 px. */
var randomNumber = document.createElement('div');
randomNumber.innerHTML = Math.floor(1+Math.random() * 24);
randomNumber.style.position = 'absolute';
randomNumber.style.top = '45%';
randomNumber.style.left = '50%';
randomNumber.style.marginLeft = '-15px';
randomNumber.style.fontSize = '30px';
document.body.appendChild(randomNumber);
/* Centered on the page, 45% margin from bottom, place an integer with a random value between 1.5*randomnumber and 2.5*randomvalue, rounded to nearest integer. */
var randomNumber2 = document.createElement('div');
randomNumber2.innerHTML = Math.floor(Math.random() * (2.5 * randomNumber.innerHTML - 1.5 * randomNumber.innerHTML) + 1.5 * randomNumber.innerHTML);
randomNumber2.style.position = 'absolute';
randomNumber2.style.bottom = '45%';
randomNumber2.style.left = '50%';
randomNumber2.style.marginLeft = '-15px';
randomNumber2.style.fontSize = '30px';
document.body.appendChild(randomNumber2);
/* Add three nice looking buttons on the bottom part of the page, 10% margin from bottom. Buttons are called "Lägre", "Samma", "Högre". */
var button1 = document.createElement('button');
button1.innerHTML = 'Lägre';
button1.style.position = 'absolute';
button1.style.bottom = '10%';
button1.style.left = '30%'; // Justering av position för att ta hänsyn till större knappstorlek
button1.style.width = '100px'; // Större bredd
button1.style.height = '50px'; // Större höjd
button1.style.fontSize = '20px'; // Större typsnittsstorlek
document.body.appendChild(button1);

var button2 = document.createElement('button');
button2.innerHTML = 'Samma';
button2.style.position = 'absolute';
button2.style.bottom = '10%';
button2.style.left = '50%';
button2.style.marginLeft = '-50px'; // Justering av marginal för att ta hänsyn till större knappstorlek
button2.style.width = '100px'; // Större bredd
button2.style.height = '50px'; // Större höjd
button2.style.fontSize = '20px'; // Större typsnittsstorlek
document.body.appendChild(button2);

var button3 = document.createElement('button');
button3.innerHTML = 'Högre';
button3.style.position = 'absolute';
button3.style.bottom = '10%';
button3.style.right = '30%'; // Justering av position för att ta hänsyn till större knappstorlek
button3.style.width = '100px'; // Större bredd
button3.style.height = '50px'; // Större höjd
button3.style.fontSize = '20px'; // Större typsnittsstorlek
document.body.appendChild(button3);
/* Add two integers, "score" and "fail". Type "Rätt":score and below it "Fel":fail in a nice font in the top left with some margin to borders. */
var score = document.createElement('div');
score.innerHTML = 'Rätt: 0';
score.style.position = 'absolute';
score.style.top = '10%';
score.style.left = '10%';
score.style.fontSize = '30px';
document.body.appendChild(score);
var fail = document.createElement('div');
fail.innerHTML = 'Fel: 0';
fail.style.position = 'absolute';
fail.style.top = '15%';
fail.style.left = '10%';
fail.style.fontSize = '30px';
document.body.appendChild(fail);
/* When "Lägre" is pressed, check if randomnumber/randomnumber2<1/2. If true, add 1 to score, if not true, add 1 to fail. Randomize randomnumber and randomnumber2. */
button1.onclick = function() {
  if (randomNumber.innerHTML / randomNumber2.innerHTML < 0.5) {
    score.innerHTML = 'Rätt: ' + (parseInt(score.innerHTML.substring(6)) + 1);
  } else {
    fail.innerHTML = 'Fel: ' + (parseInt(fail.innerHTML.substring(5)) + 1);
  }
  randomNumber.innerHTML = Math.floor(1+Math.random() * 24);
  randomNumber2.innerHTML = Math.floor(Math.random() * (2.5 * randomNumber.innerHTML - 1.5 * randomNumber.innerHTML) + 1.5 * randomNumber.innerHTML);
  updatePercentage()
}
/* When "Samma" is pressed, check if randomnumber/randomnumber2=1/2. If true, add 1 to score, if not true, add 1 to fail. Randomize randomnumber and randomnumber2. */
button2.onclick = function() {
  if (randomNumber.innerHTML / randomNumber2.innerHTML == 0.5) {
    score.innerHTML = 'Rätt: ' + (parseInt(score.innerHTML.substring(6)) + 1);
  } else {
    fail.innerHTML = 'Fel: ' + (parseInt(fail.innerHTML.substring(5)) + 1);
  }
  randomNumber.innerHTML = Math.floor(1+Math.random() * 24);
  randomNumber2.innerHTML = Math.floor(Math.random() * (2.5 * randomNumber.innerHTML - 1.5 * randomNumber.innerHTML) + 1.5 * randomNumber.innerHTML);
  updatePercentage()
}
/* When "Högre" is pressed, check if randomnumber/randomnumber2>1/2. If true, add 1 to score, if not true, add 1 to fail. Randomize randomnumber and randomnumber2. */
button3.onclick = function() {
  if (randomNumber.innerHTML / randomNumber2.innerHTML > 0.5) {
    score.innerHTML = 'Rätt: ' + (parseInt(score.innerHTML.substring(6)) + 1);
  } else {
    fail.innerHTML = 'Fel: ' + (parseInt(fail.innerHTML.substring(5)) + 1);
  }
  randomNumber.innerHTML = Math.floor(1+Math.random() * 24);
  randomNumber2.innerHTML = Math.floor(Math.random() * (2.5 * randomNumber.innerHTML - 1.5 * randomNumber.innerHTML) + 1.5 * randomNumber.innerHTML);
  updatePercentage()
}
/* Write "Är bråket högre eller lägre än en halv" centered at the top, 30 px font size, 10% margin from top. */
var question = document.createElement('div');
question.innerHTML = 'Är bråket högre eller lägre än en halv?';
question.style.position = 'absolute';
question.style.top = '10%';
question.style.left = '50%';
question.style.marginLeft = '-150px';
question.style.fontSize = '30px';
document.body.appendChild(question);

var percentageCorrect = document.createElement('div');
percentageCorrect.innerHTML = 'Procentuellt rätt: 0%';
percentageCorrect.style.position = 'absolute';
percentageCorrect.style.top = '20%';
percentageCorrect.style.left = '10%';
percentageCorrect.style.fontSize = '30px';
document.body.appendChild(percentageCorrect);

function updatePercentage() {
  var correct = parseInt(score.innerHTML.substring(6));
  var incorrect = parseInt(fail.innerHTML.substring(5));
  var total = correct + incorrect;

  if (total == 0) {
    percentageCorrect.innerHTML = 'Procentuellt rätt: 0%';
  } else {
    var percentage = Math.round((correct / total) * 100);
    percentageCorrect.innerHTML = 'Procentuellt rätt: ' + percentage + '%';
  }
}
</script>

</body>

</html>
