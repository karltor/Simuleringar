name: Generate Auto Index
on:
  push:
    branches:
      - main  # Eller 'master' om din gren heter det

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Directory Index
        run: |
          # Starta HTML-filen med din stil
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Karls Simuleringar</title>' > index.html
          echo '<style>body{font-family:sans-serif;padding:40px;background:#f4f4f9;} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;} .card{background:white;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-decoration:none;color:#333;display:block;margin-bottom:5px;transition:0.2s;} .card:hover{background:#eef;transform:scale(1.02);} h2{border-bottom:2px solid #333;margin-top:40px;}</style></head><body>' >> index.html
          echo '<h1>Välkommen till Karls simuleringar</h1><div class="grid">' >> index.html

          # Hitta alla HTML-filer (utom index.html) och skapa länkar
          # Detta kommando listar filer och gör om filnamn till snygga titlar
          find . -name "*.html" ! -name "index.html" -not -path "*/.*" | sort | while read file; do
            filename=$(basename "$file" .html)
            displayname=$(echo $filename | sed 's/-/ /g' | sed 's/_/ /g')
            clean_path=$(echo $file | sed 's|^\./||')
            echo "<a class='card' href='$clean_path'>$displayname</a>" >> index.html
          done

          echo '</div></body></html>' >> index.html

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automagisk uppdatering av index" && git push)
