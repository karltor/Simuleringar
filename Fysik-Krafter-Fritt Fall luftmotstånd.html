<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luftmotstånd Simulator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #container {
            display: flex;
            align-items: center;
        }
        canvas {
            border: 1px solid black;
            margin-right: 20px;
        }
        #controls {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        #slider {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" width="500" height="800"></canvas>
        <div id="controls">
            <input id="slider" type="range" min="10" max="200" value="50">
            <button id="dropButton">Släpp sfären</button>
            <button id="resetButton">Återställ</button>
        </div>
    </div>
    <script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const slider = document.getElementById('slider');
const dropButton = document.getElementById('dropButton');
const resetButton = document.getElementById('resetButton');

let timeDisplay = document.createElement('div');
let velocityDisplay = document.createElement('div');

document.getElementById('controls').appendChild(timeDisplay);
document.getElementById('controls').appendChild(velocityDisplay);

let sphere = { x: 250, y: 50, radius: 50, vy: 0 };
let particles = [];
let gravity = 0.2;
let dragCoefficient = 0.01;
let animationFrameId;

let startTime, endTime;

function createParticles(num) {
    particles = [];
    for (let i = 0; i < num; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: 2,
            vx: Math.random() * 1 - 0.5,
            vy: Math.random() * 1 - 0.5
        });
    }
}

function drawSphere() {
    ctx.beginPath();
    ctx.arc(sphere.x, sphere.y, sphere.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'blue';
    ctx.fill();
    ctx.closePath();
}

function drawParticles() {
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'black';
        ctx.fill();
        ctx.closePath();

        // Particle random movement
        p.x += p.vx;
        p.y += p.vy;

        // Boundary conditions
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    });
}

function checkCollisionWithParticles() {
    let dragForce = 0;
    particles.forEach(p => {
        let dx = p.x - sphere.x;
        let dy = p.y - sphere.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < sphere.radius + p.radius) {
            // If collision occurs, apply a drag force proportional to the overlap
            let overlap = sphere.radius + p.radius - distance;
            dragForce += dragCoefficient * overlap;

            // Optionally, you can also make particles react by moving them slightly
            let angle = Math.atan2(dy, dx);
            p.x += Math.cos(angle) * overlap;
            p.y += Math.sin(angle) * overlap;
        }
    });
    return dragForce;
}

function updateSphere() {
    let dragForce = checkCollisionWithParticles();

    sphere.vy += gravity - dragForce;
    sphere.y += sphere.vy;

    if (sphere.y + sphere.radius >= canvas.height) {
        sphere.y = canvas.height - sphere.radius;
        cancelAnimationFrame(animationFrameId);

        // Stop the timer and calculate final velocity
        endTime = new Date();
        let timeTaken = ((endTime - startTime) / 1000).toFixed(2);
        timeDisplay.innerText = `Tid: ${timeTaken} sekunder`;

        let finalVelocity = sphere.vy.toFixed(2);
        velocityDisplay.innerText = `Sluthastighet: ${finalVelocity} px/s`;

        sphere.vy = 0;
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawParticles();
    updateSphere();
    drawSphere();
    if (sphere.y + sphere.radius < canvas.height) {
        animationFrameId = requestAnimationFrame(animate);
    }
}

slider.addEventListener('input', () => {
    createParticles(slider.value);
});

dropButton.addEventListener('click', () => {
    cancelAnimationFrame(animationFrameId);
    startTime = new Date(); // Start the timer
    animate();
});

resetButton.addEventListener('click', () => {
    cancelAnimationFrame(animationFrameId);
    sphere = { x: 250, y: 50, radius: 50, vy: 0 };
    createParticles(slider.value);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSphere();
    timeDisplay.innerText = 'Tid: -- sekunder';
    velocityDisplay.innerText = 'Sluthastighet: -- px/s';
});

createParticles(slider.value);
drawSphere();

// Initial display
timeDisplay.innerText = 'Tid: -- sekunder';
velocityDisplay.innerText = 'Sluthastighet: -- px/s';

</script>
</body>
</html>
