<!DOCTYPE html>
<html>
<head>
  <title>Grundpotensform Träning</title>
  <style>
body {
  font-family: Arial, sans-serif;
  background-color: #e6ffe6;
  text-align: center;
  font-size: 1.2rem;
}

#main-title {
  font-size: 3rem;
  margin-bottom: 40px;
}

#question-bank button, #answer-buttons button {
  background-color: #4CAF50;
  color: white;
  border: none;
  padding: 20px 40px;
  margin: 8px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1.5rem;
}

#question {
  font-size: 2rem;
  margin: 40px;
    min-height: 100px;  /* Ställ in en minsta höjd */
}

#answer-buttons {
  display: inline-block;
}

#stats {
  position: absolute;
  top: 60%;
  right: 4px;
  background-color: #f0fff0;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
  font-size: 1rem;
}

.fraction {
  display: inline-block;
  vertical-align: middle; 
  text-align: center;
  margin: 0 10px;
}

.numerator, .denominator {
  display: block;
}

.denominator {
  border-top: 2px solid black;
}

#feedback {
  font-size: 2rem;
  transition: opacity 1s ease;
}

</style>
</head>
<body>
  <h1 id="main-title">Träna på Matematik</h1>
  <div id="question-bank">
    <button onclick="loadQuestions('potenser.txt')">Potenser</button>
    <button onclick="loadQuestions('multiplikation.txt')">Multiplikation och Division</button>
    <button onclick="loadQuestions('grundpotens.txt')">Grundpotensform</button>
  </div>
  <div id="question"></div>
  <div id="answer-buttons">
    <button onclick="checkAnswer(true)">Sant</button>
    <button onclick="checkAnswer(false)">Falskt</button>
  </div>
  <div id="feedback"></div>
  <div id="stats">
    <h2>Statistik</h2>
    <table id="stats-table">
      <thead>
        <tr>
          <th>Kategori</th>
          <th>Rätt</th>
          <th>Fel</th>
          <th>Streak</th>
          <th>Bästa Streak</th>
        </tr>
      </thead>
      <tbody>
        <tr id="stats-potenser">
          <td>Potenser</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>
        </tr>
        <tr id="stats-multiplikation">
          <td>Multiplikation och Division</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>
        </tr>
        <tr id="stats-grundpotens">
          <td>Grundpotensform</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>
          <td>0</td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
let questions = [];
let currentQuestion;
let currentIndex = 0;
let currentCategory = "";
let correctCount = 0;
let wrongCount = 0;
let streakCount = 0;
let bestStreakCount = 0;

function updateStats() {
  const statsRow = document.getElementById(`stats-${currentCategory}`);
  if (statsRow) {
    statsRow.children[1].innerText = correctCount;
    statsRow.children[2].innerText = wrongCount;
    statsRow.children[3].innerText = streakCount;
    statsRow.children[4].innerText = bestStreakCount;
  }
}

function loadQuestions(questionBank) {
  currentCategory = questionBank.split('.')[0].toLowerCase();
  document.getElementById("main-title").innerText = `Träna på ${currentCategory}`;
 loadStats();
  correctCount = localStorage.getItem(`correctCount-${currentCategory}`) ? parseInt(localStorage.getItem(`correctCount-${currentCategory}`)) : 0;
  wrongCount = localStorage.getItem(`wrongCount-${currentCategory}`) ? parseInt(localStorage.getItem(`wrongCount-${currentCategory}`)) : 0;
  streakCount = localStorage.getItem(`streakCount-${currentCategory}`) ? parseInt(localStorage.getItem(`streakCount-${currentCategory}`)) : 0;
  bestStreakCount = localStorage.getItem(`bestStreakCount-${currentCategory}`) ? parseInt(localStorage.getItem(`bestStreakCount-${currentCategory}`)) : 0;

  fetch(questionBank)
    .then(response => response.text())
    .then(data => {
      questions = [];
      currentIndex = 0;
      const lines = data.split('\n');
      lines.forEach(line => {
        const [question, answer] = line.split(',');
        questions.push({ question, answer: answer === 'true' });
      });
      nextQuestion();
      updateStats();
    });
}

function loadStats() {
  correctCount = localStorage.getItem(`correctCount-${currentCategory}`) ? parseInt(localStorage.getItem(`correctCount-${currentCategory}`)) : 0;
  wrongCount = localStorage.getItem(`wrongCount-${currentCategory}`) ? parseInt(localStorage.getItem(`wrongCount-${currentCategory}`)) : 0;
  streakCount = localStorage.getItem(`streakCount-${currentCategory}`) ? parseInt(localStorage.getItem(`streakCount-${currentCategory}`)) : 0;
  bestStreakCount = localStorage.getItem(`bestStreakCount-${currentCategory}`) ? parseInt(localStorage.getItem(`bestStreakCount-${currentCategory}`)) : 0;

  updateStats();
}

// Initiering
document.addEventListener("DOMContentLoaded", function() {
  loadStats();
});

function nextQuestion() {
  if (currentIndex < questions.length) {
    currentQuestion = questions[currentIndex];
    const formattedQuestion = formatQuestion(currentQuestion.question);
    document.getElementById('question').innerHTML = formattedQuestion;
  } else {
    document.getElementById('feedback').innerText = "Inga fler frågor!";
  }
}

function formatQuestion(question) {
  question = question.replace(/\b\d{4,}\b/g, (match) => {
    return match.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  });
  question = question.replace(/\*/g, '×');
  return question.replace(/(\d+)\^(\d+)/g, "$1<sup>$2</sup>")
                 .replace(/(\d+<sup>\d+<\/sup>)\/(\d+<sup>\d+<\/sup>)=/g, "<span class='fraction'><span class='numerator'>$1</span><span class='denominator'>$2</span></span> = ");
}

function checkAnswer(answer) {
  const feedback = document.getElementById('feedback');
  if (currentQuestion.answer === answer) {
    feedback.innerText = "Rätt!";
    correctCount++;
    streakCount++;
    if (streakCount > bestStreakCount) {
      bestStreakCount = streakCount;
    }
  } else {
    feedback.innerText = "Fel!";
    wrongCount++;
    streakCount = 0;
  }

  localStorage.setItem(`correctCount-${currentCategory}`, correctCount);
  localStorage.setItem(`wrongCount-${currentCategory}`, wrongCount);
  localStorage.setItem(`streakCount-${currentCategory}`, streakCount);
  localStorage.setItem(`bestStreakCount-${currentCategory}`, bestStreakCount);

  updateStats();

  feedback.style.opacity = 1;
  setTimeout(() => {
    feedback.style.opacity = 0;
  }, 300);

  currentIndex++;
  nextQuestion();
}
</script>
</body>
</html>
