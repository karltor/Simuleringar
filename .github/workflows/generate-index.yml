name: Generate Smart Grid Accordion
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Generate HTML
        run: |
          cat <<'EOF' > index.html
          <!DOCTYPE html>
          <html lang="sv">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Karls Dashboard</title>
            <style>
              /* Tunnare och tajtare grundstil */
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 10px 15px; color: #333; margin: 0; }
              h1 { text-align: left; margin: 10px 0 20px 10px; font-size: 1.5rem; color: #1a202c; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
              
              /* CSS GRID: Här är magin som utnyttjar hela skärmen */
              .container { 
                display: grid; 
                /* auto-fit skapar så många kolumner som får plats. Minst 280px breda, annars tänjer de ut sig */
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
                gap: 15px; 
                width: 100%;
                align-items: start; 
              }
              
              .subject-block { background: white; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border: 1px solid #e1e4e8; }
              
              /* Tajtare rubriker */
              .subject-title { 
                background: #007bff; color: white; padding: 8px 12px; margin: 0; 
                font-size: 1rem; font-weight: 600; cursor: pointer; 
                display: flex; justify-content: space-between; align-items: center;
                border-radius: 5px 5px 0 0;
              }
              
              .content-wrapper { display: none; padding: 8px; }
              
              /* Kompaktare listor */
              .category-group { margin-bottom: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; }
              .category-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
              
              .category-name { font-weight: 700; color: #444; display: block; margin: 4px 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
              
              .sim-link { 
                display: block; padding: 5px 8px; margin: 2px 0; 
                background: #f8f9fa; border-radius: 4px; text-decoration: none; 
                color: #0366d6; font-size: 0.85rem; border: 1px solid transparent; 
              }
              .sim-link:hover { background: #f0f8ff; border-color: #cce5ff; text-decoration: underline; }
              
              .active { display: block !important; }
            </style>
          </head>
          <body>
            <h1>⚙️ Mina Simuleringar</h1>
            <div class="container" id="main-content">
          EOF

          > raw_data.txt

          find . -maxdepth 1 -name "*.html" ! -name "index.html" -not -path "*/.*" | sort | while read -r f; do
            filename=$(basename "$f" .html)
            sub=$(echo "$filename" | cut -d'-' -f1)
            cat_name=$(echo "$filename" | cut -d'-' -f2)
            sim_name=$(echo "$filename" | cut -d'-' -f3-)
            
            if [ "$sub" == "$sim_name" ] || [ -z "$cat_name" ]; then 
              sub="Övrigt"
              cat_name="Allmänt"
              sim_name="$filename"
            fi

            echo "$sub|$cat_name|$sim_name|$f" >> raw_data.txt
          done

          current_sub=""
          current_cat=""
          
          sort raw_data.txt | while IFS='|' read -r sub cat_name sim_name f; do
            if [ "$sub" != "$current_sub" ]; then
              if [ "$current_sub" != "" ]; then echo "</div></div>" >> index.html; fi
              echo "<div class='subject-block'>" >> index.html
              echo "<div class='subject-title' onclick='toggle(this.nextElementSibling)'>$sub <span>-</span></div>" >> index.html
              echo "<div class='content-wrapper active'>" >> index.html
              current_sub="$sub"
              current_cat=""
            fi
            
            if [ "$cat_name" != "$current_cat" ]; then
              echo "<span class='category-name'>📂 $cat_name</span>" >> index.html
              current_cat="$cat_name"
            fi
            
            echo "<a class='sim-link' href=\"$f\">$sim_name</a>" >> index.html
          done

          if [ "$current_sub" != "" ]; then
             echo "</div></div>" >> index.html
          fi

          cat <<'EOF' >> index.html
            </div>
            <script>
              function toggle(el) {
                el.classList.toggle('active');
                const span = el.previousElementSibling.querySelector('span');
                span.innerText = el.classList.contains('active') ? '-' : '+';
              }
            </script>
          </body>
          </html>
          EOF

      - name: Commit change
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'action@github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Optimize layout for density" && git push)
