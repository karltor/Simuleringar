<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Likformighet och Kongruens</title>
    <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #e0f7fa;
}

.container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background-color: #e0f2f1;
    padding: 20px;
}

.top-bar {
    text-align: center;
    margin-bottom: 10px; /* Minskad marginal */
}

.top-bar h1 {
    color: #004d40;
    margin: 0; /* Tar bort standardmarginal */
}

.figure-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 10px; /* Minskad marginal */
    flex-wrap: wrap;
}

.figure-container div {
    margin: 10px;
}

canvas {
    border: 1px solid #000;
    background-color: #fff;
}

canvas {
    /* Ökad canvasstorlek */
    width: 400px;
    height: 400px;
}

.back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    font-size: 16px;
    background-color: #00838f;
    color: #fff;
    border: none;
    border-radius: 5px;
}

.back-button:hover {
    background-color: #006064;
}

.answer-buttons {
    text-align: center;
    margin-top: 20px;
}

.answer-buttons button {
    padding: 15px 30px;
    margin: 0 20px;
    font-size: 18px;
    cursor: pointer;
    background-color: #00838f;
    color: #fff;
    border: none;
    border-radius: 5px;
}

.answer-buttons button:hover {
    background-color: #006064;
}

.feedback {
    text-align: center;
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
}

.feedback.green {
    color: green;
}

.feedback.red {
    color: red;
}

.next-button {
    display: block;
    margin: 20px auto;
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    background-color: #00838f;
    color: #fff;
    border: none;
    border-radius: 5px;
}

.next-button:hover {
    background-color: #006064;
}

</style>
</head>
<body>
    <div class="splash-screen">
        <h1>Välkommen!</h1>
        <h2>Välj ett ämne:</h2>
        <div class="buttons">
            <button onclick="window.location.href='similarity.html'">Likformighet</button>
            <button onclick="window.location.href='congruence.html'">Kongruens</button>
        </div>
    </div>
</body>
</html>
